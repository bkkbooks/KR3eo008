body:
  text: 卷七水屬風痹附麻木不仁風痹一症即今所謂痛風也經云風寒濕三氣雜至合而為痹風氣勝者為行痹寒氣勝者為痛痹濕氣勝者為著痹行痹則行而不定走注歷節以散風為主仍參以逐寒利氣治血之劑用三氣飲等蓋血行則風自滅也痛痹則寒氣凝結痛有定處以散寒為主而參以疏風燥濕辛溫補火之品用五積散之類蓋雨雪見晛則消也著痹則肢體沉重疼痛麻木以利濕為主而參以疏風散寒理脾補氣之品酌用羌活勝濕湯及五積散之屬蓋土旺則能勝濕也至於冬遇為骨痹春遇為筋痹夏遇為脈痹秋遇為皮痹總不外此風寒濕三者為患蓋痹者閉也血氣為邪所閉不得通行而後成痹其在皮膚者輕在筋骨者重在臟腑者更重多熱者方是陽症無熱者便是陰症經云真氣不能周於身周身痹痛名曰周痹蠲痹湯治之金匱云血痹身體不仁由風寒在脈則血凝不流黃耆桂枝五物湯主之著痹身重腰冷甘姜苓朮湯主之若肢節疼痛頭眩短氣欲吐腳腫者此三焦俱病也桂枝芍藥知母湯主之凡痹在骨安腎丸痹在筋羚羊角散痹在肉神效黃耆湯痹在皮越婢湯加羌活細辛白蒺藜凡痹病脈沉澀者胸膈有寒痰故也寒濕不可屈伸者活絡丹古方治痹多用麻黃白芷入四物四君之內景嶽謂諸痹皆在陰分總由真陰衰弱精血虧損而三氣得以乘之因陰邪留滯故經脈為之不利惟三氣飲大防風湯方能奏效或用易老天麻丸浸酒亦佳凡治痹宜峻補真陰使血氣流行則寒邪自去若過用風濕痰滯等藥反至增劇附麻木不仁麻者如繩縛而初放氣虛也木者痛癢不知濕痰與死血也經云營衛俱虛則不仁又云衛氣不行則為麻木大抵麻木總屬氣血不足風氣痰濕得以乘虛而內襲不必分治故半身及頭面手臂腳腿麻木者東垣並用神效黃耆湯治之或謂手麻是氣虛十指麻乃濕痰死血故氣不行宜導痰湯加烏藥蒼朮若手足麻痛不能舉多眠昏冒者支飲也宜茯苓丸筆花氏曰痹症特經絡之病耳治失其當邪歸臟腑則難為力大約服補太早未有能愈者而黃耆熟地為尤甚暑濕之入經絡者其忌補為尤甚古方不可盡執也余有外治痹痛之方載在後手臂痛門跋內應取以參看而治自當見效至麻木不仁一症經云脾病不能為胃行其津液四肢不得稟水穀氣氣日以衰脈道不利筋骨肌肉皆無氣以生故不用焉此症自宜溫經助氣兼風濕者並治其邪自無不愈風痹麻木湯頭三氣飲芷附桂辛歸芍地杞牛杜苓五積參苓夏陳甘枳朴蒼麻黃歸芍桂芎芷桔乾薑羌活勝濕湯防風羌獨藁本蔓草芎蠲痹湯用歸赤芍薑黃羌活耆草搭黃耆桂枝五物湯桂枝耆芎加棗姜甘姜苓朮名腎著理中去參附子入桂枝芍藥知母湯朮附桂芍母麻黃安腎丸用桂術苓川烏蓯蓉巴戟增山藥蒺藜破故紙石斛萆薢共桃仁羚羊角散用桂附芎歸防羚白芍獨神效黃耆湯人參橘皮甘芍加蔓菁越婢湯倍麻黃石膏甘草與棗姜活絡丹用乳沒南星川烏地龍末四物湯治血芎歸熟地芍四君子湯中和義參朮茯苓甘草比大防風湯八珍齊附桂牛杜羌防耆易老天麻丸天麻牛膝全萆薢歸附子羌活生地研導痰湯用半夏陳甘草枳實與南星茯苓丸用半苓殼風化硝丸薑汁曲痿經云肺熱葉焦發為痿躄又曰因於濕首如裹濕熱不攘大筋緛短小筋弛長緛短為拘弛長為痿本神篇曰精傷則骨痠痿厥精時自下痿症大都起於陽明濕熱內蘊不清則肺受熱乘而日槁脾受濕淫而日溢遂成上枯下濕之候故五六七月每當其時也亦有由腎水不能勝心火上爍肺金肺受火制六葉皆焦以致金燥水虧兩足痿弱筋縱而不任地內經治痿獨取陽明蓋陽明主潤宗筋宗筋主束骨而利機關陽明又屬於帶脈而絡於督脈故陽明虛則宗筋縱帶脈不引而足痿不用也瀉南方而補北方治痿之法無過於此然而天産作陽厚味發熱病痿者若不淡薄食味必不能痊東垣取黃柏為君黃耆等補藥相佐以痿病無寒故也有濕熱用東垣健步丸加黃柏黃芩蒼朮濕痰用二陳湯加蒼朮白朮黃芩黃柏竹瀝薑汁血虛用四物湯加蒼朮黃柏下補陰丸無火症用鹿角膠丸金剛丸氣虛用四君子湯加蒼朮黃芩黃柏按黃柏蒼朮名二妙丸治痿聖藥也張路玉曰痿症之原有二一屬腎與膀胱蓋腎傷精脫即內經所謂精傷則骨痠痿厥精時自下也用都氣丸及六味八味丸之類若三陽為病發寒熱下為癰腫及痿痛者此是膀胱發病也用五苓散一屬脾濕傷腎經云秋傷於濕上逆而軟發為痿厥用腎著湯加萆薢其濕熱久郁內蒸肺金受傷者五痿湯以調理之筆花氏曰痿症亦經絡之病由於濕更由於熱若有濕而不甚熱不過肢重腫痛耳惟濕熱太甚則四肢筋軟而弛足不任地而痿症成譬之弓弦秋風起則燥而徑短夏暑至則柔而弛長痿症亦猶是也東垣二妙散用蒼朮燥濕黃柏清熱真屬神方凡濕熱未清則防己苡仁羌活獨活寄生花粉龜板之屬俱可增入其他鹿角虎脛蓯蓉杜仲等雖壯筋骨然必濕熱既清始可入藥否則以熱治熱吾未見其有當也痿症湯頭東垣健步丸羌防柴滑甘川烏花粉己苦瀉桂糊丸二陳湯半陳甘草共茯苓四物湯治血芎歸熟地芍補陰丸用熟柏母歸芍虎龜陳牛瑣鹿角膠丸鹿角霜參苓朮杜地歸相牛膝兔絲黽板共虎脛骨炙煉丸良金剛丸用酒腰搗萆杜蓯蓉兔絲找四君子湯中和義參朮茯苓甘草比都氣丸用地黃丸加五味子都氣全八味地黃丸六味附桂添五苓散本四苓豬赤瀉術加桂成腎著湯用附子強甘姜苓朮即此方即痹症之甘姜苓朮湯五痿湯用四君知柏當歸麥苡仁頭痛經云頭痛巔疾下虛上實過在足少陰巨陽甚則入腎心煩頭痛病在膈中過在手巨陽少陰犯大寒內至骨髓則腦逆故頭痛齒亦痛名曰厥逆若真頭痛則腦盡痛手足寒至節死不治頭痛宜分外感內傷其外感頭痛者唯三陽厥陰有此症太陽痛在後陽明痛在前少陽痛在側身必寒熱脈必緊數或咳嗽項強散其寒邪而痛自止如川芎細辛蔓荊柴胡之類甚者用麻黃桂枝紫蘇白芷生薑蔥白皆宜大寒犯腦羌活附子湯若火邪頭痛惟陽明為甚必多內熱脈洪痛而兼脹宜白虎湯加澤瀉木通生地麥冬之屬若他經之火則芍藥花粉芩連知柏龍膽梔子俱可然治火之法不宜佐以升散為得風火相煽額與眉稜俱痛選奇湯加蔥豉其內傷頭痛者久病多有之血虛則火動必兼煩熱內熱等症一陰煎玉女煎六味地黃丸之類氣虛則沉沉倦怠脈必微細如理中湯補中益氣湯皆可或以五福飲加川芎細辛蔓荊以升達陽氣更佳若常吐清水食姜止痛者中氣虛寒也六君子加當歸黃耆木香炮姜若痰厥頭痛則噁心煩亂頭旋氣短如在風露中宜半夏白朮天麻湯有傷酒頭痛則兼嘔逆眩暈用外臺茯苓飲加煨葛根有傷濕頭痛則頭重不能舉腹隱隱作痛宜用羌活勝濕散外用瓜蒂散搐鼻或清空膏亦佳大怒則太陽作痛先用小柴胡湯加山梔後用六味丸降火氣血俱虛而頭痛者調中益氣湯加川芎蔓荊細辛甚效至若偏正頭風痛連魚尾如牽引之狀目不可開眩不能抬宜用芎辛湯加全蠍五枚上膈有熱川芎茶調散加片芩若久而不愈乃痰涎風火郁遏經絡氣血壅滯甚則目昏緊小二便祕澀宜砭其血以解鬱逍遙散加蔥豉偏左加黃芩偏右加石膏筆花氏曰頭痛之症外而風邪內而肝火胃火痰火濕火陰虛陽虛皆能作痛卷中論治已詳且盡獨有偏頭風最難療治其症由於風邪肝火者居多若婦女梳頭及産後受病者百藥不能愈也若督脈為病諸藥不效宜茸朱丹若頭痛腹痛互相乘除者脾陰虛而胃火上下也用芎歸芍藥黃連木香不效加童便香附蔥白古方治半片頭痛左合四物右合四君固妙更有祕方用白芷川芍末黃牛腦一具共入磁瓶酒燉隨量一醉酒醒痛失矣至目中生翳白鳳仙一株搗爛火酒一斤浸露七夜去渣飲之效頭痛湯頭羌活附子湯麻防升芷蠶耆柏草蒼白虎湯治陽明熱知母石膏糯甘得選奇湯用羌防芩甘蔥豉共生薑一陰煎用生熟地丹參冬芍牛甘記玉女煎用熟地石膏麥冬知母膝六味地黃湯山山熟地黃丹苓並澤瀉八味附桂相理中湯用參朮姜炙草還加制附剛補中益氣耆朮陳參草升柴當歸身五福飲用參熟地當歸白朮炙草記六君子湯治虛痰四君又加陳半添半夏白朮天麻湯黃柏黃耆澤瀉蒼神麯麥芽參茯橘湯頭三味乾生薑外臺茯苓飲參朮橘皮生薑苓枳實羌活勝濕湯防風羌獨藁本蔓草芎瓜蒂散赤小豆香豉煎湯探吐奏清空膏用芩連芎防羌活共柴甘小柴胡湯赤芍芩棗姜甘草夏人參調中益氣湯黃耆人參蒼升柴並炙草橘紅共木香芎辛湯用芎辛芽茶白芷草姜成川芎茶調散白芷羌防見荊薄香附甘為末茶調咽逍遙散用柴歸芍苓澤陳甘煨姜薄茸朱丹治虛火草烏瞿麥黃柏子辰砂共煅但取砂加淨鹿茸棗丸是四物湯治血芎歸熟地芍四君子湯中和義參朮茯苓甘草比心痛胃脘痛經云邪在心則心痛喜悲時眩僕又云手少陰之脈動則病咽乾心痛渴而欲飲又云實則外堅充滿按之而痛虛則氣不足按之則氣足以溫之故不痛丹溪曰凡言心痛都屬胃脘雖數日不食不死若痛止便食必復痛若外受寒者當溫散內受寒者當溫利病久屬鬱則化熱用山梔為導佐以薑汁臺芎開之若痛甚加炮姜為從治景嶽謂真心痛者必手足冷至節爪甲青此旦發夕死之候其痛在膈上者實胃脘痛內經所謂當心而痛也此症多因食因寒因氣不順而致然食與寒亦無不皆關於氣故治痛以理氣為主食滯者兼乎消導寒滯者兼乎溫中平胃散胃愛散皆宜若氣結難解者唯神香散為妙若停食脹痛連胸者吐之連腹者下之若因火鬱及痰飲者隨症治之有素好熱酒致死血流於胃口作痛脈必芤澀飲下作厄口中作血腥氣宜手拈散加枳梗開提其氣虛者四物湯加桃仁穿山降桂之屬煎服有胸腹之痛無關於內而在筋骨皮肉之間者此邪之在經不可混治當辨寒熱氣血勞傷細加詳問若房勞後痛極者此陰寒也先以蔥姜搗炒尉之再進理陰煎等補之此外更有蟲痛者唇紅吐沫用化蟲丸虛痛者按之即止即怔忡之屬用歸脾湯瘀血者痛若錐刺而有定處用手拈散伏飲痛者乾嘔吐涎搖之作水聲小半夏加茯苓湯吸風痛者二陳加草蔻乾薑吳萸發熱加山梔疰痛者觸冒邪祟面目青黯或昏憒譫語神朮散蔥白酒生薑湯並用又有胃脘癰症痛而吐膿血者不必治而自愈若大痛引及脅背藥不能納者唯探吐一法最捷或刮痧亦效筆花氏曰心痛者胞絡受病也其症有九一氣二血三熱四寒五飲六食七虛八蟲九疰若胃脘作痛俗呼心痛大約寒症居多然亦有氣滯血滯及肝犯者患此症平日惟有常服六君子丸終身不食生冷及閉氣諸物不論寒暑以棉布護胸而戒嗔怒斯無上妙方也若痛發而用薑桂特治其標耳古人食品春用蔥秋用芥養胃之道也心胃痛湯頭平胃散用蒼朮厚朴炙草陳皮合胃愛散研四君炒米耆姜肉果丁神香散治氣痛丁香白蔻研末共手拈散研延胡索靈脂草果及沒藥四物湯治血芎歸熟地芍理陰煎用炙草歸熟地乾薑附肉桂化蟲丸用蕪雷榔木香陳術曲雄黃歸脾湯用四君遠耆歸木香棗仁眼小半夏加茯苓湯茯苓三兩半夏姜二陳湯半陳甘草與茯苓神朮散用蒼朮防風甘草加蔥白六君子丸治虛痰四君又加陳半添胸痹胸痹之病喘息咳唾胸背痛短氣寸脈沉遲關脈小緊此因陽氣衰微陰寒結聚栝蔞薤白白酒湯主之胸痹不得臥心痛徹背者痰垢積滿循脈而溢於背也宜用栝蔞薤白半夏湯主之胸痹心中痞滿氣結胸痛脅下逆搶心此胸中實痰外溢也宜枳實薤白桂枝湯若素稟不足虛痰內結人參理中湯主之胸痹胸中氣塞短氣經所謂短氣不足以息者實也用茯苓杏仁甘草湯以疏利肺氣或橘皮枳實生薑湯以疏利胃氣胸痹緩急者薏苡附子散主之心中痞諸逆心懸痛桂枝生薑枳實湯主之心痛徹背背痛徹心烏頭赤石脂丸主之千金治胸痹達背痛用細辛散胸中逆氣心痛徹背少氣不食用前胡湯胸中幅幅如滿噎塞習習如癢喉中澀燥唾沫用橘皮枳實生薑湯不應用治中湯胸痹腹背閉滿上氣喘息用下氣湯胸背疼痛用尉背散膽經受病亦令胸痛小柴胡湯加枳殼不應本方對小陷胸一服神效風寒在肺胸滿痛氣喘甘桔湯加理氣散風之劑病人胸中似喘不喘似嘔不嘔似噦不噦徹心中憒憒然無奈者生薑半夏湯主之千金加橘皮吳茱萸名通氣散以治胸滿短氣而噎若飲食填塞宜用吐法筆花氏曰陽受氣於胸中以布氣息今陰乘陽位阻其陽氣呼吸往來之道則聚飲停痰徹心憒亂矣昔喻嘉言謂胸中陽氣如離照當空曠然無外設地氣一上則窒塞有加凡胸痹症皆陽氣不用陰氣在上之候也其症微者但通其上焦不足之陽如薤白白酒或半夏栝蔞桂枝枳實厚朴乾薑杏仁橘皮參苓朮草等擇用對症三四味即成一方蓋以陽通陽陰藥不得豫也其症甚者則用附子烏頭蜀椒大辛熱以驅下焦之陰而復上焦之陽方合胸痹湯頭栝蔞薤白白酒湯加入半夏成二方栝蔞薤白半夏湯即前方加半夏枳實薤白桂枝湯厚朴栝蔞二味相理中湯用參朮姜炙草還加制附剛茯苓杏仁甘草湯即此三味水煎良橘皮枳實生薑湯即此三味治滿癢薏苡附子散五兩一枚研桂枝生薑枳實湯三味以外不用相烏頭赤石脂成丸蜀椒附子乾薑全細辛散治痛徹背甘草生薑枳實配栝蔞白朮乾地黃白茯細辛同肉桂前胡湯用歸芍草人參芩半竹薑棗下氣湯童便杏仁檳榔煎尉背法用芎羌活附桂烏辛蜀椒末治中湯即理中內加青陳見中風生薑半夏湯制夏薑汁相通氣散用陳皮吳茱薑汁半夏宜小柴胡湯赤芍芩棗姜甘草夏人參小陷胸湯結胸求黃連半夏並瓜蔞甘桔湯甘草共桔梗腹痛經云邪在脾胃陽氣不足陰氣有餘則寒中腸鳴腹痛又云火鬱之發民病腹中暴痛丹溪曰凡心腹痛者必用溫散此鬱結不行阻氣不運故痛也用二陳湯加川芎蒼朮倍加山梔煎服痛甚加炮姜反佐之景嶽謂無形者痛無常處病在氣分故或脹或止宜順其氣而自愈有形者痛有常所病在血分或為食積故脹無休息宜隨症而攻消之凡綿綿而痛欲得熱手按及喜飲熱湯者寒也理中湯加肉桂香砂若時痛時止熱手按而不減脈洪數者熱也二陳湯加枳實厚朴芩連山梔感暑而痛或瀉利並作脈必虛四味香薷飲感濕而痛便泄溺澀胃苓湯食積作痛腹中直條扛起膨脹噯腐者保和九便閉者三黃枳朮丸下之下後仍痛拒按積末盡也再消之蟲痛者懊憹嘔水當從蟲積治之若有瘀血必呆痛不移澤蘭湯行之若脾胃素虛飲食不化而痛者六君子加香砂若肝木乘脾及血虛腹痛者芍藥甘草湯若七情內結心腹絞痛時作時發七氣湯酌用當臍作痛為腎虛任脈為病用六味丸加龜板灰凡治腹痛以芍藥枳朮丸為最又有暑月霍亂絞腸大痛吐瀉不得者名乾霍亂俗名攪腸痧急以鹽湯灌而探吐之服神香散正氣散之屬或用陳香櫞煎湯服之亦佳此症粥飲入口即死慎之筆花氏曰腹痛當辨其有定無定喜按拒按或常或暫口渴與否便可得其崖略惟痧暑及蛔厥之痛變生頃刻痧則先用神香散蟲則先用花椒湯暫緩其痛再議進藥若氣脹而痛勢亦難緩四磨飲疏之若痧疹腹毒者餘毒留滯腸胃也清其熱毒而痛自止一用曲楂朴芽之屬則周身之火毒隨藥而內陷甚非細故腹痛湯頭二陳湯半陳甘草與茯苓理中湯用參朮姜炙草還加制附剛四味香薷飲扁豆厚朴香薷甘草湊胃苓湯用五苓再加平胃合而成保和丸用曲楂苓連翹萊蔔半夏陳三黃枳朮丸荷葉水為團神麯陳枳朮大黃共芩連澤蘭湯調經脈柏子茺牛地歸芍六君子湯治虛痰四君又加陳半添芍草甘草湯二味戊巳方七氣湯治氣結苓蘇夏朴姜煎啜六味丸即六味地黃湯芍藥枳朮丸白朮赤芍陳皮共枳實神香散治氣痛丁香白蔻研末共藿香正氣芷腹苓半朴蒼蘇桔草陳四磨飲用沉香烏藥枳實與檳榔小腹痛經云金鬱之發心脅滿引小腹善暴痛不可反側又曰胞痹者少腹膀胱按之內痛若沃以湯澀於小便上為清涕又曰小腸病者小腹痛腰脊控睪而痛膀胱病者小便偏腫而痛以手按之即欲小便而不得按小腹正中為少陰任沖之分野其傍為厥陰肝經之分野小腹痛滿皆為內有留著非虛氣也一屬燥結大腸大便不通按之堅滿繞臍攻痛小便黃赤脈數實宜大承氣湯下之若津枯祕結者脈不甚旺麻仁丸一屬熱結膀胱溺閉不通按之滿而不堅彈之有聲煩渴引飲宜四苓五苓等一屬血結膀胱其症善忘如狂渴不能飲小便自清尺脈必盛宜代抵當丸主之若醉飽入房強力忍精而致少陰與任督受傷血結陰分者此真陰虧損必致小便澀數脹滿如淋宜濟生腎氣丸紅酒煎服若婦人行經之時交合受傷時時不淨而少腹滿痛者此衝脈傷也十全大補湯倍加肉桂又有下元本虛勉力勞役而致蓄血小腹滿痛者此肝經受傷其滿必見於左旁宜調肝散然亦有右旁偏滿者此必飽食奔馳脾陰下溜食積痰膩留結也景嶽用生大蒜一片而以火酒磨木香嚼送之以消面停之症筆花氏曰小腹為厥陰所屬傷寒邪熱傳入或蓄血下焦俱宜下之直中症小腹冷痛則溫之若尋常小腹痛多屬癥瘕之氣聚於小腸曰小腸氣必失氣乃快聚於膀胱曰膀胱氣少腹熱若沃以湯小便澀治此當用墜降之藥其行氣皆當用核乃能宣達病所如橘核丸奔豚丸之屬是也大約此症莫非疝類亦有氣血寒熱之殊特不痛引睪丸耳小腹痛湯頭大承氣湯用芒硝枳實大黃原朴饒麻仁丸內小承氣白芍蜜丸麻杏泥四苓散用豬赤苓瀉術加桂即五苓代抵當丸大黃生歸桃山甲桂玄明濟生腎氣丸六味附桂牛車前十全大補八珍齊四君四物加桂耆調肝散用歸芎半夏菖蒲肉桂從酸棗木瓜牛膝共細辛甘草棗姜同橘核丸用木茴香香附桃楂楝紅良奔豚丸用茱桂附楝橘茴苓荔木做脅痛經云肝病者兩脅下痛引小腹令人善怒心病者胸中痛脅支滿脅下痛又曰肝有邪其氣流於兩脅又曰少陽有餘病筋痹脅滿又曰胃痛者腹䐜脹胃脘當心而痛上支兩脅蓋脅痛之病本屬肝膽二經然而心脾肺胃腎與膀胱諸經有邪氣逆不解勢必延及少陽厥陰而為脅痛故因焦勞憂思而得者此心肺之所傳也飲食勞倦而得者此脾胃之所傳也色欲內傷水道壅閉而得者此腎與膀胱之所傳也傳至本經則無非肝膽之病矣獨有忿怒疲勞傷血傷氣傷筋及邪在半表半裡者是真肝膽之病治宜直取本經若傳自他經者必拔其致病之本方能應乎且本經病必脅痛耳聾寒熱作嘔者方是少陽表症否則悉屬內傷不可不察外感則宜和解內傷則調氣消滯行痰降火活血疏郁補陰諸法當隨症施治其有謂病在左者為血積病在右者為氣鬱及濕痰流注其說亦難盡信惟察其有形而堅硬拒按者是血積無形而聚散不常者是氣痛若食積痰飲亦屬有形而無非由於氣滯但得氣行則何聚不散乎筆花氏曰脅痛之症不外乎肝膽如少陽受邪用小柴胡湯肝氣不和柴胡疏肝散七情鬱結輕則逍遙散重則化肝煎若兼肝火食積痰飲瘀血者隨症治之若右脅痛是肝移邪於肺用推氣散大法左用枳殼右用鬱金皆為的劑亦有虛寒作痛得熱則散手按則止者又宜溫補不可拘執也脅痛湯頭小柴胡湯赤芍芩棗姜甘草半人參柴胡疏肝香附芎枳殼陳甘赤芍從逍遙散用柴歸芍苓朮陳甘煨姜薄化肝煎用青陳芍丹梔澤貝添白芥推氣散用枳鬱金薑棗甘陳桔桂心腰痛經云督脈為病脊強反折腰痛不可以轉搖又曰腎盛怒則傷志喜忘其前言腰痛不可以俯仰屈伸又曰巨陽虛則頭項腰背痛又曰膀胱之脈挾脊抵腰故挾脊痛腰似折蓋腰者腎之府腎與膀胱為表裡故在經則屬太陽在臟則屬腎氣而又為沖任督帶之要會所以病腰痛者多由真陰之不足宜以培補腎氣為主即間有實邪者不過十中之二三耳腰痛有五症一曰陽虛不足少陰腎衰二曰風痹寒濕三曰勞役傷腎四曰跌墜損傷五曰寢臥濕地其悠悠戚戚痛而不已者腎虛也遇陰雨或久坐痛而重者濕也其遇寒而痛者寒也遇熱而痛者火也鬱怒而痛則由氣滯憂思而痛則由氣虛勞動即痛者肝腎之衰也若風寒之在經者其來必驟必有寒熱脈必緊數其痛必拘急兼痠而多連脊背治當解表正柴胡飲之類挾寒則加溫散若濕滯在經者或雨水濕衣或坐臥濕地其濕氣自外而入宜平胃散小水不利者胃苓湯若風濕相兼一身盡痛者羌活勝濕湯若跌撲在筋骨血脈凝滯而痛者宜四物湯加桃仁紅花牛膝肉桂延胡乳沒之類外以酒糟蔥姜搗罨更速丹溪治法腎虛腰痛用杜仲龜板知母枸杞五味之屬豬脊髓丸服濕熱用蒼朮杜仲黃柏川芎痰積用二陳湯加南星佐以快氣藥景嶽治好飲火酒濕熱內聚痛不可忍脈洪溺閉膀胱脹急者以大分清飲加倍黃柏龍膽而愈至於腰痠之症悉屬房勞宜八味丸加補骨杜仲腰軟之症則有虛有濕虛者八味丸其濕熱襲於少陽經絡即為腎著陳無擇曰腎著之病體重腰冷如帶五千錢治宜疏濕兼溫散法腎著湯腰胯痛症系寒濕流注於足少陽之經絡結滯為痛宜滲濕湯去橘紅加肉桂若肝腎伏熱加薑汁炒黃柏酒炒防己若腰胯連腳膝曉夜疼痛者此腎虛風毒乘之也用虎骨散加補骨脂老人腰痛連膝者二至丸筆花氏曰腰痛有風寒有濕熱有瘀血有氣滯有痰飲皆標也腎虛其本也凡痛而牽引腿足脈浮弦者為風腰冷如冰喜尉為寒並用獨活湯痛而身重如帶錢物如坐水中為濕蒼白二陳湯加獨活若蒹腰間發熱痿軟無力為濕熱恐成痿症前方加黃柏若瘀積則轉側若錐刺大便黑色脈芤澀澤蘭湯若氣滯則走注忽刺痛聚散不常脈弦急橘核丸腰間腫按之不痛而軟者痰也二陳湯加白朮白芥萆薢竹瀝薑汁之屬腰痛如脫重按稍止而脈細弱者虛也六君加杜仲續斷兼陰冷更佐八味丸此普明子之法也大抵腰痛多屬腎虛挾邪者自宜先祛邪而後用補然而補腎之中陽虛冷痛者宜補火陰虛髓熱者宜滋水又當詳審也腰痛湯頭正柴胡飲防風陳芍藥姜甘六味平平胃散製蒼朮炙草陳皮同厚朴胃苓湯用五苓再加平胃合而成羌活勝濕湯防風羌獨藁本蔓草芎四物湯治血芎歸熟地芍二陳湯半陳甘草與茯苓大分清飲二苓通車澤山梔枳殼從八味地黃丸六味附桂添腎著湯用附子強甘姜苓朮即此方滲濕湯用二術丁陳姜附甘棗茯虎骨散用歸芎桂龜板牛膝羌萆薢二至丸用附桂杜鹿茸麋茸補骨佐獨活湯用羌活柴胡細辛姜草合參苓半夏共沙參五味棗仁烏梅肉蒼白二陳湯二陳白朮蒼澤蘭湯調經脈柏子茺牛地歸芍橘核丸用木茴香香附桃楂楝紅良肩背痛經云肺病者喘咳逆氣肩背痛汗出又曰邪在腎則肩背痛是腎氣上逆也東垣曰肩背痛不可向顧此手太陽氣鬱不行也以風藥散之若氣短者逍遙散若脊強腰似折項似拔此足太陽經氣不行也羌活勝濕湯風寒汗出中風肩背痛小便數而缺者風熱乘其肺而氣鬱也消風散加枳桔濕熱相搏肩背沉重而痛當歸拈痛湯若當肩背一片冷痛者此有寒積也近效白朮附子湯素有痰飲流注作痛者導痰湯有腎氣不循故道氣逆挾脊而上作痛者用沉香肉桂茯苓牛膝茴香川椒青鹽或觀書對奕久坐而痛者補中益氣加羌活防風肥人喜捶而痛快者屬痰瘦人喜捶者屬血少氣虛大約背痛須加羌防引經肥人少佐附子筆花氏曰肩背痛古方用茯苓丸謂痰飲為患也然背痛多屬於風胸痛多屬於痰氣背為諸腧所伏風邪必從腧入實經絡之病間有胸痛連背者氣閉其經也亦有背痛連胸者風鼓其氣也故治胸痛者可理痰氣治背痛者必祛風邪一定之理宜用秦艽天麻湯挾寒者加附桂虛者補中益氣湯加秦艽天麻如風痰互入經絡作痛則茯苓丸秦艽天麻湯二方合用可也肩背痛湯頭逍遙散用柴歸芍苓朮陳甘煨姜薄羌活勝濕湯防風羌獨藁本蔓草芎消風散用參苓羌防芎藿朴甘陳當歸拈痛湯羌參二術姜茵芩升葛瀉甘苦母豬防近效白朮附子湯再加甘草棗生薑導痰湯用二陳添來枳實與南星補中益氣耆朮陳參草升柴當歸身茯苓丸用半苓殼風化硝丸薑汁曲秦艽天麻湯芎歸陳姜羌活草桑枝手臂痛臂痛為風寒濕所搏或因飲液流入或因提挈重物皆能致痛有腫者有不腫者除痰飲症外其餘諸痛並宜五積散蠲痹湯選用虛者加人參以助藥力挈重傷筋宜和氣調血十全大補湯痰飲流注四肢肩背痠疼兩臂軟痛導痰湯加木香薑黃或二陳湯加蒼活手痛一症經云手屈不伸者其病在筋薏苡湯伸而不屈者其病在骨白朮附子湯更有手腫痛名曰手氣或指掌連臂痛悉屬風熱挾痰蠲痹湯薄桂薑黃能引藥至手臂痛處濕痛更效筆花氏曰手臂之痛外而風寒內而痰濕總以辛散逐邪為主勿輕用補宜與風痹治法參看余嘗煮糯米飯一升加炒白芥子生薑蔥頭各二兩搗爛拌入乘熱作大餅貼痛處冷則更換較之雷火針神效百倍惟愈後宜棄飯河中以惜五穀此餘數年之病得此方治今已十年不復發矣手臂痛湯頭五積參苓夏陳甘枳朴蒼麻黃歸芍桂芎芷桔乾薑蠲痹湯用歸赤芍薑黃羌活耆草搭十全大補八珍齊四君四物加桂耆導痰湯用半夏陳甘草枳實與南星二陳湯半陳甘草與茯苓薏苡湯用歸芍蒼麻黃肉桂草生薑白朮附子湯甘草大棗姜腿痛大股痛膝痛經云身半以下者濕中之也又云清濕襲虛則病始於下致為腿足之病又云足陽明實則狂顛虛則足不收脛枯大抵腰腿腳膝痠疼重著腫痛者不問久近乾溼總宜除濕湯若兼吞酸脹滿者平胃散腿痛之症有由於血虛足不任地行則振掉宜六味丸加巴戟續斷杜仲鹿茸受濕者兩腿隱痛或麻瞀作腫身重肢節疼惡風羌活勝濕湯濕熱者痛自腰胯以至足脛或上下紅腫小便赤澀當歸拈痛湯流注者郁痰留於腰脅有塊互換作痛噁心頭眩宜二陳湯加羌活白朮若陰虛則足心及脛熱痛肌體羸瘦宜虎潛丸加肉桂陽虛則足腫無力補中益氣湯加桂附大股痛之症喜按者肝腎虛寒而濕氣痹著也四斤丸等痛不可按者敗血也川芎肉桂湯或舒筋三聖散酒調服婦人産後多有此症宜加穿山甲桃仁若寒熱而腫痛者須防發癰若有濕熱者痛處必腫而沉重不能轉側二妙散加羌防升柴木草之類膝痛之症經云膝者筋之府屈伸不能行而僂俯筋將憊矣故膝痛皆因肝腎之虛而風寒濕氣得以襲之也大都痛在筋者多挾風熱則屈不伸而腫宜二妙散加羌防升柴若陰虛則熱而不腫虎潛丸受濕熱者沉重而痛當歸拈痛湯受寒飲者痛在骨而屈伸不利活絡丹或川芎肉桂湯筆花氏曰腿股之痛受濕居多然亦有氣血之滯亦有脾腎之虛松枝酒虎骨膠丸均可酌用惟膝蓋痛則防成鶴膝雖屬陰虧而肝熱在筋寒邪乘襲亦能作痛凡清熱溫寒去濕補腎宜審明而活用也腿股膝痛湯頭除濕湯用平胃苓朮半夏棗姜配平胃散製蒼朮炙草陳皮同厚朴六味丸即六味地黃湯羌活勝濕湯防風羌獨藁本蔓草芎當歸拈痛湯參朮草羌防茵芩升葛母豬瀉苦姜蒼二陳湯半陳甘草與茯苓虎潛丸用桂知柏虎牛歸熟瑣歸芍補中益氣耆朮陳參草升柴當歸身四斤丸虎天麻牛附蓯蓉加木瓜若非虎骨名鹿茸菟絲熟地杜仲加川芎肉桂湯兩防桃獨羌柴歸草蒼舒筋三聖散當歸肉桂延胡驗二妙散治下濕蜜炙黃柏加蒼朮活絡丹用乳沒南星川烏地龍末松枝酒用鉤風藤松節桑歸菊寄生虎骨天麻木香斷秦艽狗脊五加增虎骨膠丸附桂參當歸地杞杜山苓牛膝丹皮兼澤瀉虎膠續斷桑寄生腳氣經云跖跛寒風濕之病也又云太陰所致為重腑腫又云傷於風者上先受之傷於濕者下先受之按腳氣之病其初甚微自膝至足或麻痹冷痛或痿弱攣急或腫或枯細或蒸蒸惡熱灑灑惡寒或有物如指發自踹腸而氣上衝心是腳氣之正病也亦有寒熱頭痛腹痛昏瞶嘔吐是腳氣之兼病也此症緩者或二三月其來漸急者或一二日其來速治之若緩恐其氣上衝心亦能殺人腳氣無非濕滯如無他症而身體重著專宜治濕以分利為主古人治法熱藥多寒藥少經云濕淫於內治以苦熱故每用麻黃川烏桂附乾薑之屬正以烏附麻黃走而不守故能通行經絡乾薑官桂辛甘大熱故能助陽退陰也然而自汗走注者為風勝無汗攣急掣痛者為寒勝腫滿重著為濕勝煩渴燥熱為暑勝亦宜隨症分表裡以施治若寒氣壅滯入腹喘急疼痛上衝悶亂危急欲絶者宜行滯降氣為主四磨飲或茱萸木瓜湯若寒濕在經脈筋骨但痠軟無力拘攣疼痛酒浸牛膝丸濕熱下壅者防己飲濕熱上衝者活人犀角散心悟以腫者為濕腳氣不腫者為乾腳氣濕者脛腫水氣勝也檳榔湯木通散檳榔散乾者枯細風燥症也四物加牛膝木瓜萬不可用補藥足跟痛者由腎臟陰虛故足脛時熱而痛也六味丸加龜板肉桂陽虛則不能久立八味丸挾濕挾痰者各隨症治足心痛者因腎虛濕著命門火不歸經故足心及踝骨熱疼也腎著湯下八味丸肥人多濕痰久坐臥則起而痛加二妙散筆花氏曰腳氣謂之壅疾必不可補總以利濕行氣為為主有勢驟者與傷寒相似一或衝心危症也其不腫而熱痛及久痛而枯細者皆屬血少風燥之症行將痿廢不可不知又未便利其濕矣金匱用礬石湯浸足以治衝心甚妙腳氣湯頭四磨飲用沉香烏藥枳實與檳榔茱萸木瓜湯加姜與檳榔酒浸牛膝丸虎骨附椒酣防己飲用二術檳通犀芎柏地甘成活人犀角散蘇防枳殼伴檳沉木香冬赤茯石膏滿檳榔湯共香附木瓜五加陳草蘇木通散治濕腳二苓蘇檳兼桑白四物湯治血芎歸熟地芍六味地黃湯山山熟地黃丹苓兼澤瀉八味附桂相腎著湯用附子強甘姜苓朮即此方二妙散治下濕蜜炙黃柏加蒼朮檳榔散防己歸芍秦艽膝天麻青木香獨活桑枝矣
