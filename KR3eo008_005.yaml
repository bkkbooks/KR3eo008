body:
  text: 卷五土屬臌脹臌脹一症衛氣之逆也經云厥氣在下營衛留止寒氣逆上真邪相攻兩氣相搏乃合而為脹其脈大堅以澀又曰足太陰虛則臌脹言正氣虛也腎氣實則脹脾氣實則腹脹胃氣實則脹濁陰在上則生䐜脹言邪氣實也胃中寒則脹滿臟寒生滿病此氣寒而脹也諸脹腹大皆屬於熱此氣熱而脹也諸濕腫滿皆屬於脾此氣濕而脹也凡脹皆在於臟腑之外排臟腑而廓胸脅脹皮膚故命曰脹其在心則煩心短氣臥不安在肺則虛滿而喘咳在肝則脅滿痛引小腹在脾則善噦肢體煩重在腎則腹滿引背腰髀痛此五臟脹也又在胃則腹滿脘痛妨食而便難在大腸則腸鳴飧泄而痛在小腸則少腹引腰而痛在膀胱則少腹滿而氣癃在三焦則氣滿皮膚中而不堅在膽則脅痛口苦善太息此六腑脹也諸脹須明逆順補虛瀉實神歸其室久塞其空謂之良工景嶽曰五臟六腑經絡皮膚皆能作脹而總不離乎脾胃然脾胃為倉廩之官受納有坤順之德運化有乾健之功使果脾胃強健則隨納隨化何脹之有其脹者皆脾土受虧運輸失職清濁相混經隧壅塞而成也若病至單鼓必其傷敗有漸更非旦夕所能圖功矣經云從上之下者治其上從上之下而甚於下者先治上而後治下初脹者工在疾瀉疏利為主宜分消丸風火濕食隨症加減久病老弱者宜參苓薑術以補中病在下焦則用歸地附桂之屬峻補其下疏啓其中使氣得峻補則氣自上行而中焦疏通矣所謂塞因塞用也若實有痞塞難以純補稍佐辛香如朴砂丁芥陳附之屬否則啓峻湯為極妙普明子謂有臌脹蠱脹之別臌者中空無物填實則消經所謂塞因塞用也然亦有寒熱虛實淺深部位之不同熱者脈數有力溺赤便閉寒者脈細無力色白喜熱虛者時脹時減按之不痛實者腹脹不減按之愈痛又病淺者飲食如常病深者飲食減少且脹甚之處及先起處必有部位即可知屬何臟腑東垣用枳朮丸加減寒熱攻補隨症施治余制和中丸取效甚多氣虛者用白朮丸以六君子湯送之蠱者中實有物消之則平經所謂堅者削之也大約非蟲即血蟲則唇紅口瘡腹疼化蟲丸主之血則脅滿少腹脹腹上手足有紫紅縷紋小便利大便黑金匱下瘀血湯通瘀煎之類攻之虛者琥珀人參丸若飲食濕熱滯而脹痛者三黃枳朮丸皆可用也有用蒜瓣入滾湯煮半熟以佐食者消脹氣之佳法也即小水不利之症以熟蒜搗丸四苓散亦佳其攻補兩難者惟陳香櫞去穰以人溺白垢煅過每服二錢或人參或砂仁湯送筆花氏曰臌脹一症氣失運化清濁相混而成實者調和氣血虛者兼補兼消總以病之新久年之老壯脈之強弱為斷然遍身俱腫者臟腑各有見症猶可按症而治若單腹脹則脾胃衰微濁氣凝結始攻則暫消其後必復脹再攻之如鐵石矣此皆元氣與身為難也唯有培養一法益元氣是也有招納一法宣布五陽是也再有解散一法開鬼門潔淨府是也丹溪曰單腹脹必用大劑參術佐陳皮茯苓蒼朮厚朴之類此言至為有理又素問云心腹脹治以雞矢醴一劑知二劑已有時復發則飲食不節病氣復聚也古方有用陳海蜇淡煮萊蔔菜頻食之今人服者甚效愚謂此必體實而稍挾熱者故效若虛寒者投之則更傷其脾胃矣惟草靈丹似覺理足附方於後其小腹脹極旁及於上而脈沉者金匱腎氣丸其要藥也水腫經云三陰結謂之水又曰肺移寒於腎為湧水腎者胃之關也關門不利故聚水而從其類上下溢於皮膚胕腫腹大上為喘呼不得臥標本俱病也又曰水穀入於口輸於腸胃其液別為五邪氣內逆則氣為之閉塞不行而為水脹其始起目窠微腫如新臥起其頸脈動時咳陰股間寒足脛腫腹乃大其水成矣以手按其腹隨手而起如裹水之狀此其候也臥不能正偃者胃不和也正偃則咳甚上迫肺也腹中鳴者病本於胃也薄脾則煩不能食食不能下者胃脘膈也身重難於行者胃脈在足也平治權衡去菀陳莝微動四極溫衣繆刺開鬼門潔淨府精巳時復五陽已布故精自生形自順骨肉相保巨氣乃平金匱曰病有風水有皮水有正水有石水風水者脈浮身重骨節疼痛汗出惡風防己黃耆湯主之腹痛加白芍若一身悉腫惡風脈浮不渴續自汗出無大熱越婢湯主之皮水者即氣水水氣在皮膚中脈浮不惡風不渴其腹如鼓四肢腫而聶聶動當發其汗防己茯苓湯主之厥而皮水者蒲灰散主之正水者其脈沉遲外症自喘脈沉小屬少陰本病若脈浮者為風水虛脹者為氣水發其汗則已脈沉者麻黃附子湯浮者宜杏子湯里水者即石水其脈自沉腹滿不喘一身面目黃腫小便不利越婢加朮湯主之甘草麻黃湯亦主之氣分心下堅大如盤邊如旋杯水飲所作桂枝湯去芍藥加麻辛附子湯主之汗出而愈又枳朮湯主之腹中和即當散也按前方治水氣陰盛故通其陽後方因陽氣不虧則開痰結誠仲景之妙用也景嶽曰水之本在腎其標在肺其制在脾水不歸經逆而上泛傳於脾則肌肉浮腫傳於肺則氣息喘急故水病以肺脾腎為三綱古人治水必兼治氣經云膀胱者州都之官津液藏焉氣化則能出矣氣化者腎中之氣也陰中無陽則氣不化水必不利故薛立齋宗金匱腎氣之法誠良劑也惟是有濕者尚宜導水兼熱者並宜清利寒濕在氣分薑附必用寒濕在血分桂附為功其有形壯病實而喘腫勢甚者則十棗湯神佑丸疏鑿飲等亦宜速導危急旦夕者沉香琥珀丸囊腫便閉者三白飲若腰以上腫宜汗用麻黃石膏杏苡等以清上焦之氣開鬼門也腰以下腫宜利小便用五苓五皮等以分下焦之清潔淨府也如濕熱下著為痹宜用加味活絡等以通下焦之郁又先喘而後腫者主治在肺防耆湯先腫而後喘者主治在脾分消湯陽水者脈數煩渴可用劫奪陰水者脈遲不渴自宜補火生土又在因機通變也筆花氏曰水腫一症固屬脾虛不能制水腎虛不能行水而成然宜急於潤肺氣順則膀胱之氣化而水自行矣試驗諸禽畜有肺者有尿無肺者無尿可悟也至治氣之法一治肺氣主周身之氣下行二治胃氣主胸中之氣下行三治膀胱之氣主吸引胸中之氣下行治肺氣者開鬼門之謂也用麻黃羌活防風柴胡蔥白及柳枝煎洗法並蘇子降氣湯之類治胃氣者潔淨府之謂也用澤瀉木通通草防己葶藶茯苓豬苓秋石之類治膀胱之氣者宜布五陽之謂也用附子肉桂乾薑吳萸及腎氣丸之屬其形氣實滿外內壅塞喘腫危迫者則始用去菀陳莝法如商陸大戟甘遂芫花牽牛等及十棗神祐疏鑿諸方亦干戈捍患之所必用也至金匱風水皮水正水石水之別不可不精求其義風水者腎因風而水積經所謂腎風者面胕龐然壅害於言多汗惡風脊痛不能正偃正偃則咳其本在腎其末在肺皆積水也脈浮惡風骨節痛知風水之在外也用防己黃耆湯者防己療風水通湊理黃耆溫肉補氣白朮治風主汗甘草益土棗薑辛散若腹痛則肝邪氣塞故加芍藥若身腫不渴自汗此風氣鼓水向外故用越婢湯發之中有石膏化熱使無上逆之虞也皮水者肺主皮毛皮毛有邪則肺氣鬱發其汗則外氣通而鬱解矣所謂金鬱泄之也水漬於脾以滲淡之用茯苓湯以茯苓易白朮加桂枝解肌以散水於外也況四肢風動則桂枝更宜矣正水者腎經之水自病即所謂關門不利也其脈沉小本無外出之意若浮而虛脹則風氣欲發於外宜發汗即脈沉而無他症亦宜用麻黃附子甘草蕩動其水以救腎邪若外症喘滿則水氣在上矣宜去附子而加杏仁以救肺此治金水二臟法也石水者脈自沉水積膀胱故小腹硬滿如石而不喘但其水潛伏不動非借風水越婢湯之法不能激之四汽此即所謂開鬼門法也甘草麻黃湯即越婢湯之變法病體本輕一發肺氣則膀胱氣化行矣凡金匱一切治方每嫌峻厲難合今病獨此水腫數方周匝精詳非此不足以勝病真神方也若病之淺者則五苓五皮亦能消水腫在下焦非腎氣丸不能益火而化氣余嘗用大赤鯉魚加堅細赤小豆一升煮服水勢應手而行腫亦即退或以大鯉魚破開入五苓散瓦合炙焦為末加麝少許薑棗湯送服亦佳又總論曰臌脹水腫同出一源氣不離乎水水不離乎氣更有兼氣水而為患者然氣脹則腹色蒼黃腹筋起按之成窟水脹則皮薄色澤按不成窟凡病在氣分則治氣為主而兼宜行水病在水分則治水為主而兼宜理氣此中自有玄妙大約氣實宜沉烏枳朴若堅甚則更用硝黃氣虛宜耆朮參苓若火衰則必加附桂且血虛則朝寬暮急氣虛則朝急暮寬水之輕者五苓五皮水之重者十棗神祐水在表越婢杏子水在裡降氣分消土不制水則用六君腎不行水則宗腎氣治法無遺蘊矣臌脹水腫湯頭氣水二症病每相因方亦通用故合集之分消丸用薑四君豬瀉夏朴實連芩啓峻湯用異功散附桂乾薑當歸驗再加肉果及沉香此外耆朴商增減枳朮丸用枳朮研荷葉包飯煨透丸和中丸芩術曲扁楂陳實香砂夏丹參五穀蟲加麥白朮丸治虛滿苓陳砂曲谷蟲飯六君子湯治虛痰四君又將陳半添化蟲丸用蕪雷榔木香陳術曲雄黃下瘀血湯大黃桃去足蟅蟲草枚熬蟅蟲即地鱉蟲通瘀煎瀉香附楂烏青歸尾木紅花琥珀人參丸芎苓附桂靈脂山甲沉三黃枳朮丸荷葉水為團神麯陳枳朮大黃共芩連四苓散用豬赤苓瀉術加桂即五苓雞矢醴用雞矢白微炒八合酒煮呷草靈丹用黃牛糞陰乾炒黃煎濾淨金匱腎氣丸六味附桂牛車前防己黃耆湯術甘共棗薑蒲灰散治皮水厥七分蒲灰三分滑麻黃附子湯甘草共成方杏子湯治風水脹麻黃杏仁甘草樣越婢加朮湯麻黃術草棗膏薑甘草麻黃湯四錢甘草與麻黃麻辛附子湯三味同煎加生薑枳朮湯煎枳朮十枚枳實二兩術十棗湯用棗先煎芫花遂戟七分研神祐丸攻擊牽牛與大黃青陳芫戟遂輕粉共檳香疏鑿飲商陸通苓瀉大腹羌秦赤小豆檳榔薑椒目沉香琥珀丸郁李杏陳全蘇木苓葶藶防己麝瀉丸三白飲用白牽牛桑皮陳術木通儔五苓散本四苓豬赤瀉術加桂成五皮飲用薑桑白大腹五加茯苓葉加味活絡丹乳沒芎膽草烏地龍末防耆湯治風入肺葉脹眼下臥蠶起防桔杏桑蘇貝耆水薑煎服功奇異分消湯用參苓瀉草蔻吳茱朴半夏川烏連柏生乾薑加入木通寒脹下蘇子降氣湯半前陳朴歸甘薑桂煎積聚經云積者陰氣也聚者陽氣也五臟所生日積六腑所生日聚積則由漸而成故堅硬不移而有形聚者作止不常忽聚忽散而無形其原或以飲食之滯或以膿血之留或風寒外感之邪亦能成積或名伏梁或名風根如瘧痞之類皆是然食滯非寒未必成積而風寒非食未必成形也又曰肝之積名曰肥氣在左脅下如覆杯有頭足令人發咳痎瘧心之積名曰伏梁起臍上大如臂上至心令人煩心脾之積名曰痞氣在胃脘覆大如盤令人發黃瘦軟肺之積名曰息賁在右脅下覆大如杯令人寒熱喘嗽腎之積名曰奔豚發於少腹上至心若豚狀上下無時令人喘逆骨痿有身體髀股皆腫環臍而痛名曰伏梁即風根也其氣溢於大腸而著於肓不可動動之為溺澀之病病脅下滿氣逆二三歲不已名曰息積此不妨於食不可灸刺為導引服藥又腸覃寒氣客於腸外與衛氣相搏有所繫癖而內著惡氣乃起瘜肉乃生始如雞卵成如懷孕堅而能移月事以時下石瘕生於胞中寒氣客於子門氣閉不通惡血不瀉留衃日大如懷子伏月事不以時下皆生於女子可導而下堅者削之留者攻之結者散之客者除之上之下之摩之浴之薄之劫之開之發之適事為故金匱云奔豚從少腹起上衝咽喉發作欲死復還或腹痛往來寒熱皆從驚恐得之奔豚湯主之心胸大寒痛嘔不食腹中上衝皮起見有頭足上下痛不可觸大建中湯主之脅下偏痛發熱脈緊弦寒也以溫藥下之大黃附子湯寒氣厥逆赤丸景嶽云內經治積其要不過攻消散補四者而已凡堅積氣實者如祕方化滯丸百順丸次則三稜丸等攻之如不堪攻擊則用保和丸大小和中飲等消之若氣聚無形者排氣飲四磨飲等散之若積痞勢緩而攻補未便者宜調理脾胃為主枳朮丸芍藥枳朮丸皆其宜也若脾腎不足氣失運化則宜養中煎溫胃飲理陰煎暖肝煎補之凡堅硬之積必在腸胃之外募原之間非藥力所能到宜琥珀膏三聖膏阿魏膏等以攻其外長桑君針法以攻其內並以灸法收功許學士曰治積以所惡者攻之所喜者誘之則易愈如肉積用硇砂水銀酒積用神麯麥芽血積用水蛭虻蟲氣積用木香檳榔水積用牽牛甘遂涎積用雄黃膩粉食積用礞石巴豆各從其類也若認積不明泛用攻消之品不能取效徐東皋曰脾胃氣虛失運而成積者惟宜以六君子湯等養其正氣所謂養正積自除也若大積大聚堅固不移者若非攻擊悍利之藥豈能推逐或兼用外治法亦可李士材曰治積宜分初中末三法病邪初起正強邪淺宜用攻受病漸久邪深正弱宜且攻且補若病根經久正氣消殘則宜專補凡攻之太急則傷正氣而邪反固矣余嘗用陰陽攻積丸先補數日而後攻之再復補之屢攻屢補以平為期石頑曰積聚氣窒心腹㽱痛大七氣湯以鐵落飲煎服飲癖成塊在脅腹間口吐涎沫清水六君子湯合五苓散酒癖肌黃食少大七氣紅酒煎服瘕氣無定處用散聚湯若攻刺心腹上下如雷鳴木香通氣散肉積四味阿魏丸石瘕用和血通經湯不愈見晛丸虛則補之腸覃阿魏麝香散伏梁環臍而痛大建中湯加芩桂息積不妨於食宜三因化氣散外用阿魏膏瘧痞用明淨雄黃用醋煮研神麯為丸酒服勿間消盡乃止筆花氏曰積聚之治只分有形無形有形者攻消是用無形者散補隨宜然既名曰積則其來有漸琢磨之力非旦夕所能為功況脾胃不虛則氣血流通何至成積治此者姑容固虞養患猛厲又慮傷殘也全師以克敵斯為良工心苦昔有老人年百餘歲人求其致壽之方答云余無別法惟一生不以臟腑化堅物不以臟腑暖冷物而已保生者宜知之積聚湯頭奔豚湯草李根皮夏葛芩芎薑芍歸大建中湯參薑椒飴糖半杯微火熬大黃附子湯細辛二味合成方赤丸二枚烏頭炮半夏細辛茯苓饒祕方化滯稜莪朮香連丁夏青皮橘百順丸治諸積老大黃皂角蒸餅搗三稜丸用醋煮焙莪苓夏麥青皮配保和丸用曲查苓連翹萊蔔半夏陳大和中飲陳實砂麥芽厚朴澤瀉查小和中飲扁豆薑厚朴芩查甘陳相排氣飲用木藿香附澤枳陳烏朴四磨飲用沉香烏藥枳實與檳榔枳朮丸用枳朮研荷葉包飯煨透丸芍藥枳朮丸赤芍陳皮米粥團養中煎用參苓草山藥扁豆乾薑好溫胃散用參朮陳扁豆乾薑歸草能理陰煎用炙草歸熟地乾薑附肉桂暖肝煎用歸杞茴沉香烏藥苓薑桂阿魏膏芷羌獨芍天麻紅花鱉山甲槐柳桃枝兩頭尖桂地大黃玄參發琥珀膏用芷防風木松丁香木鱉通當歸辰砂桂心合麻油黃丹煎成功三聖膏炒細石灰醋熬膏入大黃桂六君子湯治虛痰四君又加陳半添外治用小鱉管仲倍紅莧阿魏蔥蜜搗加麝青布掩陰陽攻積丸吳萸川烏連薑桂參芩夏巴沉琥皂延大七氣湯桂青陳智藿草附桔蓬稜鐵落飲苓神玄丹貝膽星蒲翹天麥橘朱遠共鉤藤生鐵落熬水煎藥五苓散本四苓豬赤瀉術加桂成散聚湯用二陳湯當歸桂杏及檳榔木香通氣共戎鹽枳朴稜蓬乾薑甘四味阿魏丸連翹山查連和血通經熟地黃當歸蘇木廣皮良紅花貫衆兼肉桂血竭三稜與木香見晛丸紫石英延胡附桂大黃檳木香血竭鬼箭羽桃仁水蛭瀉三稜阿魏麝香散野水紅花子參朮雄黃桂神麯烏芋是烏芋即荸薺三因化氣散薑桂蓬青陳胡椒砂仁草丁香與茴沉痞滿經云胃病則賁響腹脹脾病則腹脹善噫心主病則胸脅支滿寒氣至則堅痞腹滿痛急下利之病生矣又曰脾虛則腹滿腸鳴飧泄食不化又曰太陰司天胸中不利心下痞痛丹溪曰痞滿與脹滿不同脹滿則內脹而形外痞則內悶而外無脹急之形有因誤下而成者有因氣弱而成者東垣謂傷寒痞從血中來從外之內雜病痞亦從血中來從內之外有形者以苦瀉之無形者以辛散之凡用氣分藥不效者不知治血也劉宗厚曰古方治痞用芩連枳實之苦以泄之薑朴半夏之辛以散之參術之甘溫以補之苓澤之鹹淡以滲之果有內實之症略以疏導結胸是實邪大陷胸湯痞是虛邪半夏瀉心湯景嶽治食滯痞用大和中飲枳朮丸神香散治外邪痞陷胸湯瀉心湯等治虛寒痞用六君子歸脾湯理陰煎六味回陽飲按痞者痞塞不開滿者脹滿不行凡有邪有滯者實痞也否則虛痞也有脹有痛者實滿也否則虛滿也實者可散可消虛者非溫補不可散痞用蘇梗半夏蒼朮陳皮白芥之屬消痞用枳實厚朴神麯楂炭桃仁紅花青皮鱉甲柴胡赤芍之屬筆花氏曰痞滿之症雖有虛有實然其實則虛氣而已氣不能運行於內外聚而為痞其馴至於膨脹不難矣時醫見有滯悶不論濕熱肝氣食積肆意攻伐枳朴楂曲無一不用逮正氣既傷使無形之邪結痞於中而欲藉藥力以散其結不亦難乎凡病之有形者易治無形者難治此等症全在臨疹時心光四照用筆輕靈其中機巧不能言喻非笨工所能見到也然亦恃病者善自求生戒嗔怒慎飲食遠房幃心寬體舒唯適之安庶否塞開而交泰成不徒責之藥石也痞滿湯頭大陷胸湯生大黃芒硝甘遂共成方半夏瀉心湯芩連人參乾薑半棗甘大和中飲陳實砂麥芽厚朴澤瀉查枳朮丸用枳朮研荷葉包飯煨透丸神香散治氣作痛白蔻丁香研末共六君子湯治虛痰四君又加陳半添歸脾湯用四君遠耆歸木香棗仁眼理陰煎用炙草歸熟地乾薑附肉桂六味回陽參附歸熟地乾薑甘草炙黃疸經云溺黃赤安臥已食如飢目黃齒垢爪甲黃者黃疸也又曰風寒客於人閉而為熱失汗或痹不仁又失治則肝傳之脾名曰脾風發疸腹中熱心煩出黃金匱云諸病黃家但當利其小便假令脈浮當以汗解之桂枝加黃耆湯黃疸病茵陳五苓散主之酒疸必小便不利心中熱足下熱腹滿鼻燥脈浮者先吐之沉弦者先下之梔子大黃湯酒疸久下則為黑疸心中如啖蒜齏狀敗血之色也前方去大黃合犀角地黃湯谷疸寒熱不食頭眩心胸不安茵陳蒿湯主之女勞疸額上黑微汗手足中熱薄暮即發膀胱急小便自利若腹如水狀者不治硝石礬石散主之黃疸腹滿小便不利而赤自汗此表和裡實當下之大黃硝石湯凡疸而渴者難治不渴者可治發於陰部其人必嘔陽部必振寒而發熱喻嘉言曰夏月天氣熱地氣濕人受二氣內結髮疸與盦醬無異必從外感汗吐下三法去其濕熱至谷疸酒疸女勞疸則純是內傷與外感無涉陰疸一症仲景之方論已亡惟羅謙甫有茵陳四逆湯一方以治過用寒涼陽疸變陰之症足補仲景之缺景嶽謂黃疸有四一曰陽黃二曰陰黃三曰表邪發黃四曰膽黃陽黃因濕多成熱其症必身熱煩渴消穀善飢小便赤澀脈必洪滑宜清濕熱用大分清飲梔子柏皮湯陰黃則全非濕熱多由內傷不足不可以黃為意宜培氣血四君子溫胃飲六味五福之屬表邪發黃而內熱未清者柴芩煎茵陳五苓散之類膽黃則受驚憂而傷膽氣宜與陰黃同治必兼酸澀鎮重固其虛脫如七福飲加龍骨牡蠣之屬筆花氏曰疸症之休咎定於渴不渴者證津液之通與不通也津液通則不渴而濕熱易去不通則渴而濕熱難行其勢然也然而治陽黃易治陰黃難治女勞疸更難至谷疸酒疸皆陽黃之類也余仕綏猺時山署四面蒸沍面目漸黃溺澀不食明知為疸矣時因調闈赴省投以茵陳大黃湯不應商之於醫咸謂濕鬱極重前方合用胃苓湯一劑而腹硬如石大痛手不可按漸延胸膈坐臥不能奄奄垂斃矣時已四鼓余默思其理自覺五中燥甚急命制杏酪一甌飲之痛減而睡晨起即覓腐漿牛乳並大進生地麥冬花粉及甘露法以收功此滋陰治疸之法故記之可見濕熱症亦有用養陰者必然陰分素虛熱傷津液之故黃疸湯頭桂枝加黃耆湯好桂耆赤芍薑甘棗茵陳五苓治發黃五苓茵陳加棗薑梔子大黃湯香豉枳實梔大黃犀角地黃湯生地赤芍麥冬良茵陳蒿湯梔子大黃硝石礬石散麥粥飲和咽大黃硝石湯黃柏梔子相茵陳四逆湯茵陳附子草炮薑大分清飲通二苓車澤山梔枳殼均梔子柏皮湯梔柏甘草良四君子湯中和義參朮茯苓甘草比溫胃飲用參朮陳扁豆乾薑歸草能六味地黃湯山山熟地黃丹苓兼澤瀉八味附桂相五福飲用參熟地當歸白朮炙草記柴芩煎治壯熱梔瀉枳殼木通得茵陳大黃湯再加梔子相此方即前茵陳蒿湯胃苓湯用五苓再加平胃合而成甘露須天麥生熟地黃芩枳甘枇杷葉石斛共茵陳七福飲用棗仁歸遠志參甘地術為痰飲經曰歲土太過飲發中滿食減又曰太陽司天濕氣變物水飲內畜中滿不食又曰太陰所至為積飲痞隔土鬱之發為飲發注下太陽之復唾出清水及為噦噫又曰諸病水液澄徹清冷皆屬於寒考內經止有積飲之説本無痰症之名自仲景創之而諸家言痰者紛紛矣然痰與飲不同飲為水液停積胸腹間而痰則稠濁無處不到凡五臟之傷皆能致之當知其辨張子和曰痰症有五風痰熱痰濕痰酒痰食痰留在中脘亦令人憎寒發熱痞滿自汗有似傷寒者特頭不痛項不強耳陳無擇曰病人百藥不效關脈伏而大或眼皮眼下如灰煙黑者皆痰也丹溪謂二陳湯治一身之痰下行上行各加引藥吳茭山曰八味者治痰之本也龐安常謂肺受火不得清肅下行則津液凝濁不生血而生痰當以潤劑滋陰如地杞麥冬之類投以二陳立見其殆景嶽曰治痰宜分緩急風寒之痰宜從辛散脾胃之痰宜去濕滯兼扶中土腎水虛泛之痰宜壯水之源陰火乘肺之痰宜滋津液火邪之痰宜用清降痰在膈上在經絡及膠固稠濁者非吐不去在腸胃可下而愈在四肢非竹瀝不能達在脅下非白芥子不能除在皮裡膜外非薑汁竹瀝不能開至於飲症金匱云其人素盛今瘦水在腸間瀝瀝有聲名痰飲飲水流脅下咳唾引痛名懸飲飲水歸四肢當汗不出身體疼痛名溢飲咳逆倚息氣短不得臥其形如腫名支飲水在心心下堅築短氣惡水不欲飲水在肺吐涎沫欲飲水水在脾少氣身重水在肝脅下支滿嚏而痛水在腎心下悸心有留飲其人背惡寒如掌大或脅下痛引血盆咳嗽則轉甚或短氣而渴四肢歷節痛心悸膈上病痰則喘咳寒熱背痛腰疼目泣自出其人振振身瞤劇痰挾瘀血遂成窠囊惟蒼朮行之極妙其餘病痰飲者當溫藥和之治虛寒痰飲用苓桂朮甘湯外臺茯苓飲及小半夏茯苓湯普明子曰痰有燥濕之分飲有表裡之別濕痰生於脾滑而易出二陳湯六君子等主之燥痰生於肺干而難出貝母瓜蔞散人參清肺飲等主之若肺火不能下降致真水上泛用六味丸以滋其陰此治痰法也飲之在表者發熱浮腫香蘇五皮等合用以疏之飲之在裡者或停心下伏兩脅走腸間變幻萬狀用外臺茯苓飲苓桂朮甘湯等加蒼朮治之此治飲法也筆花氏曰濃則為痰薄則為飲莫非脾陽失職飲食不為津液而為痰飲古人所以治痰先理脾也然而痰飲之症變狀百出妄見妄言脈亦乍大乍小無有定準或肢體半寒半熱晝輕夜重溺濁如朱不知者疑為鬼祟而非也先宜苓桂朮甘湯等加蒼朮旋用六君子等以收功至於猝倒痰迷及行入經絡為患則宜參厥逆痹症之法治之更有猝然老痰結核在咽亦非細故宜用五倍子玄明粉枳實等加咸藥以軟堅而化痰帶血者加韭汁若火痰用芩膏風痰用南附濕痰用蒼夏食痰用楂曲酒痰用粉葛老痰用蔞貝頑痰用海粉經絡痰用荊竹瀝隨症施之而已痰飲湯頭二陳湯半陳甘草與茯苓八味地黃丸六味附桂添苓桂朮甘湯只此四味良外臺茯苓飲參朮生薑陳皮又枳實小半夏茯苓湯茯苓三兩半夏薑六君子湯治虛痰四君又加陳半添貝母爪蔞散貝蔞茯苓桔梗橘紅求人參清肺桑白皮杏仁阿膠粟殼隨炙甘知母烏梅肉一棗還須地骨皮香蘇散用蘇葉香附甘陳薑棗啜五皮飲用薑桑白大腹五加茯苓葉滾痰丸用大黃芩礞石沉香辰砂噴噎膈經云三陽結謂之膈又云胃病者膈咽不通飲食不下則暴憂之病也又曰憂愁者氣閉塞而不行又曰形苦志苦病生於咽嗌治之以苦藥此症都由憂思傷脾血液衰涸胃脘枯稿而成甚至鬱氣生痰妨礙食路古人謂食則暴吐病在上焦從乎氣或吐而痛痛而吐病在中焦從乎積若朝食暮吐暮食朝吐病在下焦從乎寒其在上者水飲可行食物難入名曰噎膈其在下者食雖可入良久復出名曰反胃反胃則陽虛不化可補可溫噎膈則氣結不行開助兩難故反胃輕而噎膈重按諸方書或作熱結或作寒結然欲健脾理痰則燥妨津液欲生津養血則潤礙中州唯視脈大有力作熱治脈小無力作寒治色黃枯者為虛寒色紅澤者為實熱庶乎無誤景嶽謂脾主運化而大絡布於胸膈腎主津液其氣化主乎二陰故上焦之噎責在脾治從溫養下焦之結責在腎治宜滋潤古方治噎膈以參耆補氣竹瀝清痰薑汁去穢牛乳羊乳當歸蜜汁潤燥皆良法也然其中有情郁氣鬱挾蟲挾血挾痰挾食為患均當按法施治普明子曰噎膈屬胃脘乾稿不宜投燥半夏二陳皆為禁劑宜用啓膈散以開關佐以四君子調中散挾郁者逍遙散雖然藥雖逍遙而人不逍遙無益也石頑治噎膈以多飲牛羊乳為上策或宰生鵝血乘熱飲之亦佳凡吐沫嘈痛及糞如羊屎者不治筆花氏曰噎膈一症胃液枯涸七情病也治宜養中安胃生津潤燥為主痰則消之火則降之瓜蔞貝母實為的劑而尤在病家靜心善養張雞峰曰此症乃神思間病當內觀靜養斯言深中病情道家謂欲求長生先學短死每午黑甜一覺亦忘憂之法也噎膈湯頭啓膈散沙參丹苓貝鬱金砂殼同荷蒂杵頭粳五分四君子湯中和義參朮茯苓甘草比調中散治胃關通陳米沙參三兩同二兩丹參餘一兩荷貝苓陳五穀蟲逍遙散用柴歸芍苓朮陳甘煨薑薄反胃按反胃症王太僕曰食不得入是有火也食入反出是無火也經云脾脈微急為膈中食飲入而還出後沃沫仲景謂無氣則營虛而血不足故胸中冷其脈多浮而澀若浮變為緊則上下脘俱亡血為難治暴病吐谷不得下者小半夏湯主之胃反吐而渴欲飲水者茯苓澤瀉湯主之胃反嘔吐者大半夏湯主之脈弱小便利身有微熱見厥者難治四逆湯主之景嶽曰反胃當辨其新久酒食情郁無非內傷初起者胃氣未壞猶可標本兼治若病既久則當專用溫補若寒在上焦則噁心欲吐此胃脘之陽虛也唯薑湯最佳橘皮湯亦可寒在中焦則食入不化半日復出此胃中之陽虛也宜理中湯溫胃飲有痰則用金水六君煎寒在下焦而朝食暮吐或入久而出者此丙火不能傳化蓋命門之陽虛也非六味回陽飲及理陰煎不可其有大便祕結者真陰枯稿也陰虛兼寒者以補陽為主而大加當歸肉蓯蓉韭汁薑汁之屬陰虛兼熱者以補陰為主而加乳汁童便蜂蜜豕膏之屬若因酒濕者葛花解酲湯胃火上衝者半夏瀉心湯鬱悒者逍遙散古方用甘蔗汁二分薑汁一分和勻日三服若倦怠垂死者以人參一二兩濃煎加薑汁頓服有用貓胞炙脆陳酒調服如有寒痰用狗寶為末陳酒服之或陳香櫞去瓤入薑附末焙燥以獨參湯送之反胃初愈切忌粥飲但以獨參湯少加炒陳米不時煎服旬日後方可小試稀粥其有咽喉阻塞心膈滿悶暫用香砂枳朴以開其結如冷涎不已心腹覺痛用六君子湯加丁藿若飲熱湯及椒薑等輒作厄者瘀血阻滯氣道也代抵當丸如芥子大細細咽之筆花氏曰反胃之症寒症居多非若噎膈之胃脘枯燥也但久吐則中州氣弱肝木上乘胃液亦能枯涸不難轉而為噎治此者切勿輕用苦寒傷其脾胃醫家好用瀉心湯極宜斟酌反胃湯頭小半夏湯加一生薑茯苓澤瀉湯苓澤生薑甘草桂枝術大半夏湯用人參半夏白蜜三味成四逆湯須冷服附子乾薑甘草足橘皮湯治乾嘔噦橘皮生薑煮服美理中湯用術參薑炙草還加制附剛溫胃飲用參朮陳扁豆乾薑歸草能金水六君虛實到熟地夏陳歸苓草六味回陽參附歸熟地乾薑甘草炙理陰煎用炙草歸熟地乾薑附肉桂豕膏用豬脂白蜜同煉淨當歸或先煎薑汁或相併葛花解酲湯葛花砂蔻香青陳參苓朮神麯瀉豬薑半夏瀉心湯芩連人參乾薑半棗甘逍遙散用柴歸芍苓朮陳甘煨薑薄代抵當丸大黃主歸桃山甲桂玄明𩞄雜經云飲食入胃遊溢精氣上輸於脾脾氣散精上歸於肺脾與胃以膜相連耳而脾屬陰主乎血胃屬陽主乎氣故胃易燥全恃脾之陰以和脾易濕全恃胃之陽以運此後天生化之源也若脾陰一虛則胃家飲食遊溢之精氣全輸於脾不復稍留以自潤斯胃過於燥而有火欲得食以自資稍遲則𩞄雜愈甚得食則可暫止久之則三消噎隔諸症作矣治宜養營血補脾陰兼補胃陰甘涼潤濡稍佐微酸此良法也𩞄雜一症腹中空空似飢非飢似辣非辣似痛非痛而胸膈懊憹莫可名狀或得食暫止或食已復𩞄或兼噁心而見胃痛大抵食已即飢雖食不飽者火𩞄也痰多氣滯似飢非飢不喜食者痰𩞄也酸水浸心而𩞄者戚戚膨膨食少無味此脾氣虛寒水穀不化也火𩞄者宜清火而兼養陰用二陰煎四陰煎之類痰𩞄者宜降痰二陳湯及大和中飲之類若中焦痰火相兼而𩞄者三聖丸軟石膏丸之類若脾胃虛寒停痰滯食吞酸嘔惡而𩞄者和胃飲二陳湯溫胃飲六君子湯之類筆花氏曰𩞄雜之症有火𩞄痰𩞄之別愚謂痰滯胸膈或噯滿或心悸則有之何能作𩞄其𩞄者亦為火所迫耳夫痰為火迫則其痰必燥故胸中似辣非辣宜以二冬二母等潤之方能降火而清痰古方用二陳湯𩞄非愈增其燥而𩞄愈甚乎況此症明屬脾陰不足胃液枯燥所致惟有滋陰合甘涼之法治之庶不變生他患若芳燥不宜用也𩞄雜湯頭二陰煎用生地冬玄參苓棗草連通四陰煎用生地麥沙參苓甘百合芍二陳湯半陳甘草與茯苓大和中飲陳實砂麥芽厚朴澤瀉查三聖丸治痰火𩞄白朮橘紅黃連炒軟石膏丸痰火重香附半南梔子共和胃飲治霍亂陳朴乾薑炙草驗溫胃飲用參朮陳扁豆乾薑歸草能六君子湯治虛痰四君又加陳半添三消經云二陽之病發心脾其傳為風消又曰心移寒於肺為肺消飲一溲二死不治心移熱於肺為膈消又曰五臟脆者皆善病消痹胃中熱則消穀令人懸心善飢胃中熱腸中寒則疾飢小腹痛脹又曰口甘者五氣之溢五味之津液在脾此肥美之所發也名曰脾疸肥者令人內熱甘者令人中滿其氣上溢轉為消渴治之以蘭除陳氣也水泉不止膀胱不藏失守者死按三消症三焦受病也上消者肺病也凡心脾陽明之火皆能薰炙故又名膈消其症大渴引飲隨飲隨渴津液枯涸也人參白虎湯主之中消者脾胃病也又名消中其症多食善飢日加瘦削古方以調胃承氣湯及三黃丸主之下消者腎病也故名腎消其症煩躁引飲耳輪焦溺如膏腎水虧極之症也六味地黃丸主之丹溪治消渴以養肺降火生血為主俱用四物湯上消加五味人參麥冬花粉藕汁生地汁人乳之屬中消加知母石膏滑石以降胃火下消加黃柏知母熟地五味以滋腎水常飲澡絲湯代茶石頑謂能食而渴者人參白虎湯不能食而渴者錢氏白朮散去木香倍加乾葛丹溪曰腎水屬陰而本寒虛則為熱心火屬陽而本熱虛則為寒普明子曰治上消宜用二冬湯以潤肺而清胃治中消宜用生地八物湯以清胃而滋腎治下消宜用地黃湯合生脈散以滋腎而補肺筆花氏曰三消之症皆燥熱結聚古方人參白虎湯及丹溪用養肺降火生血之法已臻美備故後世治上消者清肺治中消者清胃治下消者滋腎而惟普明子之治法更極周密其治上消而兼清胃者使胃火不得傷肺也中消而兼滋腎者使相火不得攻胃也下消而兼補肺者滋土源以生水也蓋三消之治不必專執本經而滋其化源則病易痊矣然此症有水虧亦有火虧更宜斟酌若尋常消渴惟天花粉為神藥其外蘭香葉白葵花亦可合知柏用也三消湯頭白虎湯治陽明熱知母石膏糯甘得加人參即名人參白虎湯調胃承氣湯芒硝甘大黃三黃丸治積熱芩連大黃等分末六味地黃湯山山熟地黃丹苓兼澤瀉八味附桂相錢氏白朮散四君藿香木香乾葛成四物湯治血歸芎熟地芍二冬湯用天麥參花粉知母甘草芩荷葉一錢煎生地八物湯知柏芩連山藥丹皮麥荷葉一錢煎生脈散治熱傷氣人參麥冬北五味關格經云人迎一盛病在少陽二盛病在太陽三盛病在陽明四盛已上為格陽寸口一盛病在厥陰二盛病在少陰三盛病在太陰四盛已上為關陰人迎與寸口俱盛四倍已上為關格又曰邪在腑則陽脈不和氣留之而陽氣太盛陰氣弗能榮也故曰格且陰脈不利血留之而陰氣太盛陽氣弗能榮也故曰關陰陽俱盛不得相榮故曰關格仲景謂關則不得小便格則吐逆丹溪謂寒在上熱在下兩寸俱盛四倍法當提吐不必在出痰也景嶽謂人迎察六腑之陽寸口察五臟之陰人迎盛至四倍此孤陽獨見水不濟火也名曰溢陽為外格言陰格於陽也寸口盛至四倍此元陰無主氣不歸經也名曰溢陰為內關言陽關於陰也若人迎寸口俱盛至四倍已上且大且數此其陽氣不藏故陰中無陽陰氣不升故陽中無陰陰陽相離故曰關格總由酒色情欲以致真陰敗竭元海無根所為亢龍有悔之象也其脈則如弦如革洪大異常其症則脈動身亦動凡乳下臍旁無不舂舂然振振然與脈相應其形氣則上有微喘而動作則喘甚肢體無力而寤寐多慌張謂其為虛損則無勞嗽等症謂其為痰火又無邪熱等象此關格之所以異也治此者宜以峻補真陰為主凡兼陽臟者必多熱一陰煎兼陰臟者必多寒宜大營煎右歸飲之屬若不熱不寒宜五福飲大補元煎之類治之普明子曰小便不通因而吐食名曰關格假蘇散治之有宗丹溪之説者以為陽氣結於上陰液衰於下用半夏瀉心湯及進退黃連湯之屬姑存其説筆花氏曰陽極盛則陰消剛決柔也於卦為夬於病為格陰極盛則陽消柔變剛也於卦為剝於病為關若剝盡不能生復夬盡不能生姤則陰陽隔絶合為未濟之卦而成關格夫病至關格月令所謂陰陽爭死生蕩之時矣然而窮極反本思鴻濛甫闢先有坎水故腎為天一之元治此者唯有大滋腎陰一法必審其實有氣結脘閉或痰涎凝遏方可佐以開痞通陽然亦不可過劑也關格湯頭一陰煎用生熟地丹參冬芍牛甘記大營煎用地杞桂歸杜牛膝炙草配右歸熟地萸杞好附桂杜仲山藥草氣虛參朮乾薑找五福飲用參熟地當歸白朮炙草記大補元煎參熟山萸杞當歸杜仲甘假蘇散用通苓陳麥芽瞿麥香附荊半夏瀉心湯芩連人參乾薑半棗甘進退黃連湯乾薑桂枝參夏甘棗相嘔吐經云諸逆衝上皆屬於火諸嘔吐酸暴注下迫皆屬於熱又云足太陰病舌本強食則嘔胃脘痛腹脹善噫足厥陰肝所病胸滿嘔逆脅痛邪在膽逆在胃膽液泄則口苦胃氣逆則嘔苦又曰寒氣客於腸胃厥逆上出故痛而嘔也嘔逆之症嘔者聲與物俱出吐者有物無聲噦者有聲無物王太僕曰食不得入是有火也食入反出是無火也金匱云嘔而胸滿者吳茱萸湯主之嘔而腸鳴心下痞者半夏瀉心湯主之噦逆者橘皮竹茹湯乾嘔吐沫者半夏乾薑散徐東皋云胃虛者嘔吐惡食兼寒者惡寒或食久還吐脈遲而澀此皆虛寒也宜藿香安胃散理中湯甚者用丁香煮散溫補胃中鬱熱及飲食積滯而嘔者則喜涼而渴或惡食煩滿脈洪大而數此皆實熱也竹茹湯麥門冬湯清之食積則二陳及保和之類消之景嶽曰實邪在胃作嘔寒滯者必多疼痛食滯者必多脹滿氣逆者必多脅肋痛脹火鬱者必多煩熱燥渴脈洪而滑外感者必多頭身發熱脈數而緊舍此以外則皆胃虛所致宜六君子等和之寒甚者溫胃飲有痰飲者苓朮二陳煎惟有暑用香薷飲有火用二陳加生薑芩蓮至瘧邪作嘔則表邪內陷但解表邪而嘔自止若吐蛔者胃熱甚則蛔無所容宜清其火抽薪飲胃寒甚則蛔不能存宜溫其胃烏梅丸至胃氣虛無食而吐蛔者此倉廩空虛蛔求食而上出也速用理中湯聖朮煎等以補之有因大便祕結而嘔者須加血藥潤之不愈用蜜煎導之下竅開則上竅受也其火衰不能生土者八味丸凡點滴不入者薑米炒川連亦效筆花氏曰嘔吐症寒者居其七八熱者不過二三凡鬱郁作悶唇舌淡白食久而出泛泛欲嘔或吐物酸臭寒也若直衝而出嘔亦連聲唇紅舌赤熱也凡暑吐必兼煩渴其勢與熱吐同發痧嘔吐膈必脹滿頭旋眼花肝擾嘔吐脅下有氣上衝嘔聲不絶亦有酸味如醋病雖不同然而脾虛則嘔胃虛則吐孫真人曰嘔家聖藥是生薑至言哉嘔吐湯頭吳茱萸湯治嘔吐人參生薑大棗助半夏瀉心湯芩連人參乾薑半棗甘橘皮竹茹湯參草棗生薑半夏乾薑散等分為末咽藿香安胃藿丁香人參陳皮並生薑理中湯用參朮薑炙草還加制附剛丁香煮散黃秫米石蓮薑棗煮粥糜竹茹湯治胃熱吐半夏乾葛甘草做麥門冬湯天麥地桑苑貝梗甘竹味二陳湯半陳甘草與茯苓保和丸用曲楂苓連翹萊蔔半夏陳六君子湯治虛痰四君又加陳半添溫胃散用參朮陳扁豆乾薑歸草能苓朮二陳煎合方四苓二陳加乾薑香薷飲用扁豆厚朴香薷甘草湊抽薪飲用芩柏梔澤枳甘通石斛宜烏梅丸用桂枝辛連柏薑椒歸附參聖朮煎用好冬朮乾薑肉桂陳皮得八味地黃丸六味附桂添霍亂經云清氣在陰濁氣在陽營氣順行衛氣逆行清濁相干亂於腸胃則為霍亂又云足太陰厥氣上逆則霍亂仲景曰霍亂頭痛身疼熱多欲飲水者五苓散主之寒多不欲水者理中丸主之按霍亂一症上吐下瀉揮霍撩亂此寒濕傷脾之症也有因貪受風涼露坐濕地有因嗜食生冷油麵雜進脾胃既傷則不能容受從上則吐從下則瀉且易受邪者中土素虛既吐既瀉則更虛矣治此者唯有和胃健脾一法先以淡薑鹽湯徐徐飲之而吐察其胃口未清或脹或痛者以和胃飲平胃散等酌用邪甚於下者五苓散苓朮二陳煎之類若無脹無痛者虛寒也用六君子溫胃飲等生冷寒勝者加肉桂炮薑吳萸若霍亂後身熱不退脈數無汗者有表邪也前治法中酌加柴胡桂枝甚者宜用麻黃萬勿以苦寒之品雜之其有霍亂而轉筋者俗名吊腳痧足腹之筋拘攣急痛甚至牽縮陰丸痛迫小腹最為急候此足陽明厥陰氣血俱傷之症也內經言經筋之病寒則反折筋急即此意也仲景謂吐利汗出發熱惡寒四肢拘急厥冷者四逆湯主之陳無擇曰陽明主潤宗筋今吐下頓亡津液諸脈枯削宗筋失養必至攣縮甚則卵縮舌捲為難治景嶽曰轉筋腹痛因胃氣暴傷致陽明厥陰血燥而然法當養血溫經乃為正治若邪滯未清和胃飲加肉桂木瓜氣虛者四君子加當歸厚朴肉桂木瓜之類陰虛少血者理陰煎加肉桂木瓜寒甚者木瓜湯酌加附桂乾薑張路玉謂吐瀉者濕土之變也轉筋者風木之變也此症風木行脾宜平胃散加木瓜脈將絶者以鹽納臍中用艾火炙之千金法治轉筋男子以手挽其陽女子以手揪兩乳甚效更有乾霍亂症欲吐不得欲瀉不得攪腸大痛脹急悶亂變在須臾此因內停飲食外閉寒邪陰陽格拒氣道不通不速治多致暴死急以炒鹽湯探而吐之先去其滯隔而通其清氣然後以排氣飲神香散等降其濁氣二日內切勿進粒米粥飲得食必復發也若但覺小腹先疼或心腹俱痛脹痞不能屈伸名為絞腸痧此因暑火流注臟腑宜正氣散或二陳加厚朴炒梔或六和湯及四苓加蘇薷瓜夏之屬然此等症總先以炒鹽湯探吐痰涎為最筆花氏曰嘔吐霍亂之症果有暑邪熱毒蘊於脾胃即用白虎及芩連清降其火亦屬正治若並無火脈火症則即胃氣虛寒自宜以和中安胃為主一切苦寒皆仇藥也乃時醫一見吐症輒泥於諸逆上衝皆屬於火之説又疑為肝陽犯胃疑為痰滯中焦妄用黃連竹茹之屬且習用仲景開痞之瀉心湯俾芩連與薑夏參枳並用從此溫燥無功胃陽愈困然僅在嘔吐猶可挽回至若霍亂轉筋之候大吐大瀉之餘脾胃垂脫陽氣衰微斯即純用溫補回陽猶虞不逮一見芩連入口即敗而亦用此瀉心湯左金丸等寒熱雜投試問此時此狀是誠何心而可作腳進腳出之地耶近因習醫者不能作案日捧臨症指南以為祕本見里症諸方不論有無痞氣瀉心居多從此成為風氣貽害蒼生有志者誠可痛恨也霍亂湯頭五苓散本四苓豬赤瀉術加桂成理中丸用參朮薑炙草還加制附剛和胃飲治霍亂陳朴乾薑炙草驗平胃散製蒼朮炙草陳皮同厚朴苓朮二陳煎合方四苓二陳加乾薑六君子湯治虛痰四君又加陳半添溫胃飲用參朮陳扁豆乾薑歸草能四逆湯須冷服附子乾薑甘草足理陰煎用炙草歸熟地乾薑附肉桂木瓜湯用茴香吳茱紫蘇炙草薑排氣飲用木藿香附澤枳陳烏朴神香散治氣痛丁香白蔻研末共藿香正氣芷腹苓半朴蒼蘇桔草陳二陳湯半陳甘草與茯苓六和湯人參扁朴甘半苓香薷木瓜藿薑棗杏砂仁泄瀉經云清氣在下則生飧泄濁氣在上則生䐜脹又曰脾病者虛則腹滿腸鳴飧泄食不化肝所生病胸滿嘔逆飧泄胃中寒腸中熱則脹而且泄寒氣客於小腸不得成聚故後泄腹痛肺脈小甚為泄腎脈小甚為洞泄又曰長夏善病洞泄寒中濕勝則濡泄久風為飧泄泄而脈大為難治泄而腹滿甚者死按泄瀉無不本於脾胃胃為水穀之海而脾主運化使脾健胃和則水穀腐熟而化氣化血以行營衛矣若脾胃受傷則水反為濕谷反為滯氣不輸化而泄利作矣瀉多必亡陰故瀉久則自太陰傳於少陰而為腸澼丹溪云瀉多因濕惟分利小水為上策按泄瀉每多小水不利如因濕勝者一時水土相亂並歸大腸也因熱勝者火乘陰分水道閉澀也因寒者小腸之火受傷氣化無權也因脾虛者土不制水清濁不分也因命門火衰者真陰虧損元精枯涸也諸症唯濕熱者可利治瀉之法濕熱則口渴溺赤或利如蟹渤宜清利四苓加條芩寒濕則下利清穀宜燥脾異功散加穀芽木香食積則滿悶噯腐瀉下臭穢宜行滯平胃保和等合用脾虛則面色㿠白食少便頻宜補土香砂六君子湯腎虛則五更天明依時作瀉宜固命門四神丸加減七神丸更有酒泄之症多留濕熱丹溪治傷酒晨瀉者理中湯加葛根或吞酒蒸黃連丸氣虛者六君子有氣泄症遇怒則泄此肝木克脾也先用胃苓湯脾虛則繼服溫胃飲聖朮煎有風泄症因風寒在胃脾土受傷經所謂春傷於風夏生飧泄之屬若因風熱而泄即傷寒外感熱利之屬寒者溫胃飲熱者四苓散筆花氏曰泄瀉者土病也無論飧泄洞泄氣泄風泄食泄無不本於脾虛唯暑濕及傷寒熱結旁流宜用清利不便驟補耳其他則雖導滯攻邪總宜以四君子湯為主而加減之然暑症泄利過多往往有一晝夜而驟脫者察其暑邪漸清速宜大補脾陽繼以顧腎而兼止澀蓋脾病之變甚速切須留意貧家無力服參全恃白朮臨症指南矯而罕用真異端之見也泄瀉湯頭四苓散用豬赤苓瀉術加桂即五苓異功散最宜四君加陳皮平胃散製蒼朮炙草陳皮同厚朴保和丸用曲楂苓連翹萊蔔半夏陳香砂六君治胃寒六君又加香砂添四神丸用補骨脂肉蔻五味又吳茱加減七神丸補骨木香全吳茱苓肉蔻白朮叉車前理中湯用參朮薑炙草還加制附剛酒蒸黃連丸黃連酒浸蒸曬研胃苓湯用五苓再加平胃合而成溫胃飲用參朮陳扁豆乾薑歸草能聖朮煎用好冬朮乾薑肉桂陳皮得痢經云腎所生病為腸澼飲食不節起居不時陰受之五臟䐜塞下為飧泄久為腸澼又曰陽絡傷則血外溢而衄血陰絡傷則血內溢而後血又曰腸澼便血身熱則死寒則生腸澼下白沫脈沉則生浮則死腸澼下膿血脈懸絶則死滑大者生素問曰大熱內結注泄不止熱宜寒療結腹須除以寒下之結散利止則通因通用也如有表邪內縮當散表邪而愈痢症即內經之腸澼也方書因其閉滯不利又謂之滯下仲景用建中湯治痢不分赤白新久腹大痛者神效其虛坐努責此為亡血症倍加生地歸身白芍桃仁佐之又以陳皮和之血生乃安東垣云濕熱腸澼甚者涼血地黃湯如小便赤臍下悶痛後重加木香檳榔末各五分若大便閉塞裡急後重數至圊而不能出或少有血有白膿切勿利之利則反鬱結不通宜以升陽除濕防風湯舉其陽則陰自降矣戴元禮曰滯下之症氣滯成積當順氣開胃為先初起不問赤白凡裡急後重者宜藿香正氣散加丁香五分若赤痢及有鮮血者前方加黑豆三十粒或黃連阿膠湯熱甚則白頭翁湯外發熱者敗毒散若色黯如瘀服涼藥而所下愈多者作冷痢治理中湯或四君子加肉果木香陶節庵曰陽症內熱而下鮮血陰症內寒而下紫黑血或成塊如豬肝狀景嶽曰因熱貪涼過吞生冷逮大火西流陽消陰長之時則伏陰內動乘機而起故寒濕脾病多在七八月之間其夏月犯之即病者脾胃本虛也詎得概以寒涼治之喻氏曰夏秋暑濕熱三氣交蒸而成痢必從外出之首用辛涼以解表次用苦寒以清裡一二劑愈矣失於表者外邪但從里縮不死不休故百日之遠仍用逆流挽舟法引其邪而出之則死症可活惟新受暑毒大渴大下應從內經通因通用之法大黃黃連甘草三味連進以緩其勢不可發汗若久痢當從少陽半表半裡之法逆挽其下陷之清氣此亦是和法也金匱云下痢脈反弦身熱自汗者可愈即此意也李士材曰赤為熱白為寒亦非確論須以色脈辨之如煩渴喜冷脈數者熱也脹滿拒按脈弦而實者實也外此則皆虛寒矣然口渴亦有因亡津腹痛亦有喜按而不脹小便短赤亦有液涸而色變後重亦有因氣陷總在求其何邪致病何臟受傷濕熱者去之積滯者消之因於氣者調之因於血者和之新感而實可以用通久病而虛可以用塞且久痢必損腎設非桂附大補命門之火以復腎中之陽以救脾家之母則飲食何由進門戶何由閉真元何由復程鍾齡治痢初起用治痢散神效腹脹痛佐以朴黃丸若日久脾虛食少者異功散加白芍黃連木香清而補之若邪熱穢氣塞於胃脘嘔逆不食者開噤散啓之氣虛下陷者補中益氣湯升提之久痢變為虛寒肢冷脈微者附子理中湯加桂溫之蓋久痢必傷腎也諸痢證治痢有因外感風邪由三陽而內縮者小柴胡湯神術湯症也有三陰自痢而脈微肢冷者桂枝湯理中湯症也有素稟陰虛感寒而痢體薄脈微宜八味加故紙肉果阿膠兼用理中合升麻桂附間服此症為痢藥害者不少若寒濕痢身痛頭疼亦有三陽症五苓散宜之濕火痢肛墜後重濕勝腹不痛熱勝腹大痛亦有三陽症河間黃連湯宜之燥火痢煩渴口燥肛門熱痛膿血稠黏當歸大黃湯合益元散宜之其瀉痢之症並無虛坐努責但覺倦怠赤白兼下應利應補應溫臨症審酌更有瘧痢之症症邪內陷元氣不升為瘧後痢補中益氣湯提之喻氏從少陽治用小柴胡湯若痢久亡陰陰陽兩虛惡寒發熱似作瘧狀為痢後瘧亦用補中益氣生生子云瘧痢發燒過吞生冷則變為痢痢不愈復繼以瘧宜用十味六和湯或內縮煎下痢純血者風也宜涼血祛風歸防芩桃之屬有濕熱兼清利有紫塊是死血桃仁滑石行之血痢不愈屬陽虛陰脫八珍湯加升提甚則陳陳自下厥冷脈縮元氣欲絶也附子理中湯下痢白膿者臟腑之脂膏氣受病也大約寒多而熱少宜調氣養臟若凍膠鼻涕者為冷痢非薑桂香砂莫效若色如豆汁者脾經受濕也宜分利之有五色痢者白者浮近脂膏赤者切於膚絡紫紅紫白則離位稍久陰凝血敗而然至黃黑色深而膿厚穢臭為火症色淡不甚臭為寒症若青黑而腥薄者此肝腎腐敗之色不治或糟粕不實者痢久而腸胃虛弱也異功散積滯未淨者稍加厚朴下痢裡急後重病在廣腸以下之處不在脾與腎也中焦有熱則熱邪下迫有寒則寒邪下迫氣虛則氣陷下迫當以治痢為主白頭翁湯補中益氣加訶子皮等隨症治之下痢腹痛懼按為實喜按為虛欲飲冰水為熱喜暖手尉為寒寒在中者治宜溫脾寒在下者治宜溫腎氣滯則順氣血虛則和血挾熱則清脾若下血四散如篩腹中大痛此陽明熱毒氣衝當升陽去濕和血湯其有脈遲數不勻或時歇止者此痧痢腹痛也刮其痧而痛自止下痢繞臍痛者濕毒與食停在下脘糟粕欲行不得行乃逼迫臟腑脂膏由小腸刮下故痛在繞臍而下且小腸為邪迫不能分利故小便短縮大孔腫痛濕熱下流也實者芩連以清之虛寒久病者參術以溫之痢止則痛止亦如後重之法痢而口渴者火甚竹葉石膏湯然此症下多亡陰津涸而渴者多宜滋其陰更宜補氣古人謂氣之升即為水氣為水母氣充則渴自止也下痢不食莫作噤口積滯失運居多保和丸最穩心下堅痛者下之痢而作嘔噁心欲吐此胃氣不和也生薑陳皮白朮湯因火上逆者必有煩熱脹滿加薑汁炒黃連虛者加參朮若積滯毒氣上攻者木香導滯丸下痢厄逆丹溪以氣從上衝屬火古方多以胃弱言之久痢每多此症下多亡陰也火則橘皮竹茹湯虛則參朮煎湯調益元散亦有導滯而愈者下痢譫語內有燥屎也內經云痢而譫語下之乃安噤口痢者胃中濕熱之毒薰蒸清道胃口閉塞也開噤散啓之亦有誤用兜澀苦寒而成者亦有宿食痰火挾熱因下焦不通從上而嘔者此其胸膈必脹宜消導不宜苦寒若暑邪拒格三焦氣機逆閉半夏瀉心去甘草為允當毒氣上攻者敗毒散脾胃虛寒者仍宜溫補按此症有用參苓白朮者有用人參石蓮者大都因胃虛故也休息痢者或餘邪未淨或飲食勞欲以致止而復發邪則清之虛者補之升之小便不利者邪熱迫奔於大腸必鬱結於膀胱故氣不能化也宜清膀胱之熱以分消其勢喻氏所謂開支河也下痢身重喻氏謂脾腎大虛將傳水腫用腎氣丸東垣用升陽益胃湯局方用羌活勝濕湯使濕從汗解而邪自散痢後浮腫乃脾虛有濕五苓散加白朮肉桂升麻立效下痢脫肛虛寒症居多訶子皮散補中益氣湯皆驗痢後枯細此濕熱惡血流入經絡留滯隧道而成兩腿肉消膝蓋腫痛不治則成鶴膝用蒼朮黃柏白芍龜板為丸以四物湯加牛膝桃仁紅花陳皮煎湯送下氣虛加參術痢後風者或勞役或房勞風邪乘虛內侵致腿軟痠腫麻痹不仁宜防風湯加續斷虎骨陰虛者更補命門筆花氏曰痢為險惡之症生死所關故博引衆説分症論治不憚詳明所以備臨症之酌用也時醫不問病源但以檳朴香連概治一切之痢在暑痢則偶爾幸中設遇風邪內縮之症則邪何從而出設遇虛寒之痢則元氣愈迫其傷此書之不能不多讀也末後一條引程鍾齡之治痢散方以葛根為君不論風暑寒濕先開出邪之路善哉此方乎余屢用而屢驗矣其實有濁陰內結噤口不食或大痢不止者則惟鴉片煙能止之亦良方也痢症湯頭建中湯用芍桂枝甘草飴糖薑棗施涼血地黃湯知柏青皮槐角當歸葉升陽除濕防風湯白朮茯苓白芍蒼藿香正氣芷腹苓半朴蒼蘇桔草陳黃連阿膠湯再用茯苓幫白頭翁湯用黃連秦皮黃柏共水煎敗毒散用參苓草羌獨柴前枳殼好川芎桔梗共牛蒡荊防薄荷就是了理中湯用參朮薑炙草還加制附剛四君子湯中和義參朮茯苓甘草比治痢散用葛根查麥茶陳芍苦參朴黃丸用大黃厚朴陳皮與木香異功散最宜四君加陳皮小柴胡湯赤芍芩棗薑甘草夏人參神術湯用蒼朮防風甘草加蔥白桂枝湯治太陽風赤芍桂甘薑棗從八味地黃丸六味附桂添五苓散本四苓豬赤澤術加桂成河間黃連湯當歸甘草三味良當歸大黃湯二味燥血方益元散用朱甘滑除卻硃砂名六一補中益氣耆朮陳參草升柴當歸身十味六和參扁朴甘半苓香薷木瓜藿薑棗杏砂仁內縮煎用羌柴參枳桔芎甘薄荷苓八珍補陰陽四君四物相和血湯歸芎升麻生地同青皮槐米術荊芥共研沖竹葉石膏湯最涼夏麥參甘粳米將保和丸用曲楂苓連翹萊蔔半夏陳生薑陳皮白朮湯三味和胃定嘔良木香導滯丸白芍厚朴連當歸大黃茯芒硝神麯丸橘皮竹茹湯茯苓半夏相開噤散參連丹參與石蓮苓陳冬瓜子菖蒲米蒂煎半夏瀉心湯芩連人參乾薑半棗甘金匱腎氣丸六味附桂牛車前升陽益胃參朮耆黃連半夏草陳皮白芍柴胡羌獨活防風澤瀉棗薑宜羌活勝濕湯防風羌獨藁本蔓草芎訶子皮散訶粟殼乾薑廣皮固腸脫四物湯治血歸芎熟地芍防風湯加四君牛杜附子羌活靈
