body:
  text: 卷二陽屬傷寒難經曰傷寒有五有中風有傷寒有濕溫有熱病有溫病其所苦各不同按此則上古之世一切風濕溫熱皆歸於傷寒自仲景著傷寒之論分而析之而諸症始不得混於正傷寒之列矣厥功偉矣哉傷寒疑似辨正傷寒之症冬令天氣嚴寒人感之而即病其症發熱惡寒頭項痛腰脊強身痛但脈浮緊無汗為傷寒脈浮緩有汗為傷風寒用麻黃湯風用桂枝湯或用加味香蘇散代之隨手可愈其有非傷寒而類傷寒者如感邪內伏至春而發曰溫病至夏而發曰熱病其症頭痛發熱與傷寒同但不惡寒而口渴不可發表宜柴葛解肌湯若頭痛發熱而身重但欲眠鼻鼾不語者風溫也不可發汗加減萎蕤湯主之若發熱惡寒而脈細身重不能轉側頭汗自出者風濕也不嘔不渴桂枝加附子湯主之有因冬暖而衣被單薄受寒者此表寒內熱冬溫也香蘇散加清藥主之有夏秋暴寒感冒而頭痛發熱者時行寒疫也香蘇散主之夏月頭痛發熱而自汗煩渴者傷暑也加減香薷飲主之有夏月頭痛發熱身重腹滿譫語自汗兩脛逆冷者濕溫也切忌發汗宜蒼朮白虎湯若不頭痛發熱卒然惡寒厥冷吐瀉面青脈遲者中寒也姜附湯主之其有身熱面赤項強頭搖口噤者痙也加減小續命湯主之有惡寒發熱頭痛腹痛吐利者霍亂也藿香正氣散主之若發熱脈緊身不痛而脘悶噯腐吞酸者傷食也保和丸主之若煩熱頭疼而脈軟體倦語言懶怯者虛煩也補中益氣湯主之或惡寒發熱而病起自腳兩脛腫滿者腳氣也檳榔散主之如兩足忽枯細名乾腳氣四物湯加牛膝木瓜主之以上諸症皆似傷寒而實非正傷寒臨症審之傷寒綱領傷寒之證不外乎傳經直中二者而已傳經者由太陽傳陽明由陽明傳少陽由少陽傳太陰由太陰傳少陰由少陰傳厥陰此循經傳也亦有越經傳者如寒邪初客太陽有不傳陽明而徑傳少陽者有不傳陽明經而徑入陽明腑者亦有由陽明不傳少陽而徑入本腑者亦有少陽不傳三陰而徑入胃腑者亦有傳一二經而止者亦有始終只在一經者雖所傳不同其為傳經則一也此皆由表入里寒化為火熱邪傳經之症也直中者不由三陽經傳入而徑中三陰者也中太陰則病淺中少陰則病深中厥陰則愈深矣此寒邪直中之症也夫傳經之邪在表為寒在裡為熱直中之邪則但寒而無熱也且傳經之症初病必發熱頭痛無汗以漸而深愈深愈熱雖入陰經脈必沉實症必煩熱此宜攻裡或清或下隨宜而用直中之症初起本無發熱頭痛但或厥冷或嘔吐腹痛泄利或畏寒不渴脈沉弱不足此皆元陽不足陰症也經腑論經者徑也行於皮之內肉之中者也腑者器也所以盛水穀者也太陽之經陽明之經為表少陽之經為半表半裡是謂三陽太陰之經少陰之經厥陰之經為里是謂三陰三陽有經又有腑三陰有傳更有中如有太陽之經即有太陽之腑膀胱是也有陽明之經即有陽明之腑胃是也有少陽之經即有少陽之腑膽是也然膽為清淨之腑無出入之路故治法如經至三陰有傳經者由三陽而入此熱邪也有直中者不由陽經傳入此寒邪也凡三陽三陰之邪未入腑者可汗而已若邪初入胃腑表裡皆熱邪未結聚熱勢散漫而無胃實不大便之症則宜用白虎湯表裡和解若邪已結聚如太陰之大實痛少陰之咽乾口燥下利清黃水及心下硬厥陰之煩滿囊縮則惟下之而已矣蓋三陽三陰之邪一入胃腑則無可出之路故不能復傳他經而惟有通其大便令邪從內出此大小承氣調胃承氣所由設也且三陽三陰之邪環繞胃腑處處可入大法若由太陽入腑而太陽症不解必從太陽解表為主若由少陽入腑而少陽症具者仍從和解若由陽明入腑者用白虎湯如邪已結聚者下之此邪入陽明腑之治也若太陽亦自有膀胱之腑太陽病甚則當遺邪於本腑而為口渴溺赤之症外顯太陽經病而兼有此腑症名曰太陽傳本宜用五苓散以桂枝解邪以苓澤通小便而愈此太陽之邪自傳本腑也唯少陽之腑則不傳論傷寒脈仲景曰尺寸俱浮者太陽受病也當一二日發尺寸俱長者陽明受病也當二三日發尺寸俱弦者少陽受病也當三四日發此三陽皆受病未入於腑者可汗而已尺寸俱沉細者太陰受病也當四五日發尺寸俱沉者少陰受病也當五六日發尺寸俱微緩者厥陰受病也當六七日發此三陰俱受病已入於腑者可下而已仲景曰傷寒一日太陽受之脈若靜者為不傳頗欲吐若煩躁脈數急者為傳也傷寒六七日無大熱其人煩躁者此為陽去入陰故也傷寒二三日陽明少陽症不見者為不傳也傷寒三日三陽當盡三陰當受邪其人反能食而不嘔此為三陰不受邪也傳經辨傷寒傳經不可以日數拘亦不可以次序拘如內經言一日太陽二日陽明三日少陽四日太陰五日少陰六日厥陰之說蓋言傳經之大概非謂凡患傷寒者必如此也夫寒邪中人本無定體陶節庵云風寒之初中人也無常或入於陰或入於陽非必始太陽終厥陰也或自太陽始日傳一經六日至厥陰邪氣衰不傳而愈者亦有不罷再傳者或有間經而傳者亦有傳至二三經而止者或有終始只在一經者或有自少陽陽明而入者或有初入太陽不作鬱熱便入少陰而成陰症者所以治傷寒不可拘泥但見太陽症便治太陽見少陰症便治少陰依類而推此活法也仲景曰日數雖多但見表症而脈浮緊者猶宜汗之日數雖少但見里症而脈沉實者猶宜下之誠為不易之論合病並病論數經並見為合病數經遞見以次相棄為並病傳經有幻境或兩經同病或三經同病名為合病若一經病未已復連及一經名為並病有合於陽者即有合於陰者有並於陽者即有並於陰者仲景謂三陽合病閉目則汗面垢譫語遺尿治宜白虎湯此外合三陽之經內合陽明之腑故用辛涼和解之大約治法不論三陽三陰凡兩經合病則用兩經藥同治之三經合病則用三經藥同治之若一經病未瘥復並一經則相其先後輕重緩急而藥之斯無弊耳景嶽曰三陽若與三陰合病即是兩感所以三陰無合併病也兩感論傷寒兩感者表裡雙傳也一日太陽與少陰同病二日陽明與太陰同病三日少陽與厥陰同病是也太陽症本發熱頭痛惡寒若兼少陰則又咽干口燥矣五苓散主之渴加知柏頭痛加羌防陽明症本身熱目痛鼻乾不眠若兼太陰則又腹滿不欲食而自利矣大柴胡湯主之少陽症本耳聾脅痛寒熱往來而嘔若兼厥陰則又煩滿囊縮而厥水漿不入矣大承氣湯加川芎柴胡主之凡兩感者表裡俱傳為禍最速或三日六日營衛不行臟腑不通昏不知人乃死此症無一定之方治不過邪在表者解於外邪在裡者清於中古人用大羌活湯若邪自外入而外甚於里者必以外為主先用葛根麻黃解表後用調胃承氣湯攻裡若邪因虛襲而元氣不支者速宜專顧根本先用四逆湯救里後以桂枝解表但使元陽不敗則強敵亦將自解又仲景謂少陰症反發熱用麻黃附子細辛湯者此論直中之兩感也傳經兩感以解表為主而清裡佐之直中兩感以溫中為主而發表次之此治兩感之大法也陰症有三說有傳經之陰症陰中之熱症也有直中之陰症陰中之寒症也有房室之陰症陰中之虛症也既犯房勞而得熱症則灼熱極甚犯房勞而得寒症則陰寒極甚熱之甚清劑宜輕寒之甚溫劑宜重三陰症亦用表法論傷寒論曰太陰病脈浮者可發汗宜桂枝湯此論太陽傷風為醫誤下而傳太陰者也太陰脈當沉今反浮是症在太陰脈在太陽則太陽之邪未盡入於陰而太陰之邪大有還陽向汗之勢故用桂枝湯以徹其表令其從太陽來者仍從太陽出也推而論之若傷寒太陰症而得太陽脈可用麻黃仲景麻黃石膏湯之意也得陽明脈可用葛根仲景葛根芩連湯之意也得少陽脈可用柴胡是以大柴胡湯為少陽傳太陰之方也然必腹中實痛始用大黃下之否則本方加芍藥以和之而已太陰如此少陰厥陰何獨不然大抵治傷寒急以解表而緩於攻裡非惟三陽務表即三陰未結之邪猶冀其還陽而走表必俟邪氣結實乃用承氣湯下之傷寒表裡寒熱辨要之陽邪在表則表熱陰邪在表則表寒陽邪在裡則裡熱陰邪在裡則裡寒邪在半表半裡之間而無定處則往來寒熱且邪在表則心腹不滿能食而不煩嘔邪在裡則心腹脹痛而煩嘔筆花傷寒三法歌曰可汗頭身痛肢項腰脊強惡寒無汗熱浮緊脈堪將不可汗脈弱沉遲咽閉咽乾下利俱亡血衄淋諸動氣陽虛痞悸厥非宜可吐邪依上膈留懊煩胸痛唾涎稠莫吐脈虛兼厥逆更防寒飲發乾嘔可下邪傳胃腑深腹疼脈實熱潮蒸汗多譫語繞臍硬利水色青心下疼熱結膀胱兼畜血如狂便黑結胸成不可下因表有邪脈浮大弱喘虛家溺清咽閉諸動氣脹減陽明面赤偕便鞕後溏不潮熱心胸鞕滿滑胎遮嘔多忌食寒猶惡煩躁陰虛下便差太陽經症太陽經病頭痛發熱項脊強身體痛鼻鳴乾嘔惡風自汗脈浮緩者名曰中風宜解肌桂枝湯主之若前症悉具而惡寒無汗脈浮緊或喘嗽者名曰傷寒宜發表麻黃湯主之有汗不得服麻黃無汗不得服桂枝普明子並以加味香蘇散代之太陽之頭痛頭腦痛而連項脊與陽明症之頭額痛而連面目少陽症之耳前後痛而上連頭角不同也太陽之項脊強強在項後與結胸症之強在項前不同也此症或有脈伏者由寒氣閉塞外顯太陽症而脈伏實將汗之機也陽明經症陽明經病目痛鼻乾唇焦嗽水不欲咽脈長此陽明本經症其去太陽不遠亦有頭痛發熱宜用葛根湯解肌不可誤認為陽明腑病而用清涼攻下之法漱水不欲咽者其本腑無熱是表病而里和也少陽經症少陽經病目眩口苦耳聾胸滿脅痛寒熱往來嘔吐頭汗盜汗舌滑脈弦此少陽經受病宜用小柴胡湯和解之仲景曰少陽症但見一二症即是不必悉具此經有三禁吐汗下是也然少陽有兼表兼里者務在隨時變通不得以三禁之說而拘泥也胸滿者胸半以上乃清陽之分正在半表半裡邪至此將入里而未深入於裡故胸滿而腹未滿是邪氣而非有物也寒熱往來者人身外陽內陰膽經正陰陽交界之所邪傳至此陰陽相爭也嘔吐者邪將入里裡氣上衝邪正分爭故嘔吐此邪氣入陰之機也若三陰不受邪反能食而不嘔舌苔滑者舌司寒熱之變在表則津液如常在裡則苔燥黃黑今尚有津液但不如常是邪將入腑而未深入也太陽脈浮陽明脈長少陽脈弦此三陽診候之法也此症三陽既盡邪未入於陰者故可汗而已太陰經症太陰經病有三法焉有傳經之熱邪有直中之寒邪有誤下內陷之邪如經所謂腹滿嗌乾者此傳經之熱邪也宜用小柴胡湯去人參加芍藥以和之不已則下之又經所謂腹滿而吐食不下自利益甚時腹自痛者此直中之寒邪也宜理中湯以溫之又經所謂太陽症醫反下之因而腹滿時痛者此誤下內之邪也當用桂枝湯加芍藥大實痛者桂枝湯加大黃今先舉熱邪傳入太陰經者言之其症腹滿痛嗌乾脈沉實大柴胡湯主之若自下利去大黃加黃連以清之腹滿痛者少陽之邪傳入肝木乘脾也但其症必嗌乾口燥若誤下內陷無嗌乾之症直中腹痛驟至而脈細氣冷自下利者熱灼腸胃故下利腸垢少陰經症少陰經病有傳有中今先舉傳經者其症口燥咽乾而渴或咽痛或下利清水色純青心下硬或下利腸垢目不明大小承氣湯並主之咽痛甚合甘桔湯口燥咽乾而渴者邪爍腎水故乾燥異常須即下之以救腎家將涸之水下利清水者結糞在內從旁流出按其腹必硬痛宜急下之厥陰經症厥陰經病亦有傳有中今先舉傳經者言之其症少腹滿舌踡囊縮煩躁厥逆消渴大承氣湯主之少腹滿者乃濁陰凝聚實為有物也宜急下之舌踡囊縮者肝主筋津枯不能榮養此症舌必焦厥逆者熱深厥亦深與直中之初時即厥不同也消渴者飲水多而小便少不知消歸何有若神昏不知渴者更危太陽腑症太陽腑者足太陽膀胱也太陽有經有腑邪在於經則頭痛發熱邪在於腑則口渴溺赤外顯太陽經病而兼口渴溺赤者此溺澀不通乃太陽腑病與他臟無涉也五苓散主之若表症未除可與散劑同用此由太陽經之邪自傳本腑也口渴溺赤者膀胱有水而受邪熱則溺不通且濁水不去津液不生故渴陽明腑症足陽明胃有經有腑邪在經不過目痛鼻乾唇焦漱水而已邪既入腑則潮熱譫語狂亂不得眠燥渴自汗便閉轉矢氣手足心腋有汗諸症生焉白虎湯調胃承氣湯並主之但陽明腑病有由本經而入者有由太陽少陽而入者有由三陰經而入者來路不同見症則一陽明之腑無可出之路邪傳至此不復傳矣狂亂者陽熱亢極發狂之甚與下焦畜血之如狂劫汗亡陽之驚狂不同宜下之轉矢氣者燥糞內結則氣常下失仲景云欲行大承氣先與小承氣腹中轉矢氣方與大承氣直中三陰諸症直中者初起不由陽經而徑中三陰者也其症腹中冷痛嘔吐清涎沫下利清穀但欲寐踡臥四肢厥冷身痛如被杖囊縮舌黑而潤脈沉細無力吐蛔諸症作焉中太陰宜用理中湯中少陰宜用四逆湯中厥陰宜用白通加豬膽汁湯大抵臟受寒侵不溫則殆急投辛熱不可遲緩直中之症寒邪未經化熱直入陰分故與傳經諸症相反一投寒涼立即氣脫慎之吐蛔用理中安蛔散傷寒湯頭麻黃湯治太陽寒杏仁甘草桂枝煎桂枝湯治太陽風赤芍甘桂薑棗從加味香蘇香附防荊秦陳草蔓芎姜柴葛解肌湯芩丹知貝生地赤芍甘加減萎蕤湯羌葛石芎防杏薇木香草加減審宜將桂枝加附子湯即桂枝湯加附子香蘇散用蘇葉香附甘陳薑棗啜加減香薷飲香薷扁豆厚朴炙草施蒼朮白虎湯即白虎湯加蒼朮姜附湯治中寒熟附乾薑各三錢加減小續命防己參桂麻黃防附子黃芩芍藥及杏仁甘草川芎同姜煮藿香正氣芷腹苓半朴蒼蘇桔草陳保和丸用曲查苓連翹萊蔔半夏陳補中益氣耆朮陳參草升柴當歸身檳榔散防己歸芍秦艽膝天麻青木香獨活桑枝矣四物湯治血歸芎熟地芍白虎湯治陽明熱知母石膏糯甘得大承氣湯用芒硝枳實大黃厚朴饒小承氣湯即大承氣湯去芒硝調胃承氣湯芒硝甘大黃五苓散本四苓豬赤瀉術加桂成大柴胡湯治太陰大黃枳實半芍芩大羌活湯方羌活細辛防芩連防己術芎地母甘蒼四逆湯治少陰寒附子乾薑與炙甘麻黃附子細辛湯三味同煎加生薑麻黃石膏湯炙草杏仁相葛根芩連湯加入炙甘良葛根湯陽明升麻赤芍荊秦蘇甘白芷加減視寒溫小柴胡湯赤芍芩棗姜甘草夏人參理中湯用參朮姜炙草還加制附剛加附子即名附子理中湯甘桔湯甘草與桔梗白通加豬膽汁湯方療陰盛格其陽姜附五錢配蔥白人尿膽汁共煎嘗理中安蛔散參苓乾薑術川椒共烏梅足冷附子入傷寒兼症傷寒兼症者傷寒中所恆有之症有因於誤治者有調攝失宜者有病氣相傳染而變症者按法治之而已咳嗽者脈寒也止嗽散加荊防蘇子或二陳湯咽痛有表裡寒熱之分邪在表甘桔湯加薄荷牛蒡若少陰里症凡傳經而燥渴者甘桔湯加黃連元參牛蒡如直中而腎氣虛寒逼其無根之火上浮者姜附湯加桔梗主之汗多亡陽者補正氣吐血者熱迫血而上行也如失表而邪蘊於經者加味香蘇散散之若邪入里而醞釀成熱者犀角地黃湯清之若大便閉結邪熱上攻者生地四物湯加大黃下之衄血者寒邪將散榮血周流古人所謂紅汗是也此病當解也若寒邪在經頭痛發熱而衄者表也加味香蘇散汗之若邪氣在裡燥渴煩心而衄者犀角地黃湯清之便膿血者熱迫血而下行也宜清之若瘀血凝聚少腹痛拒按小便自利者下之亦有下焦虛寒腸胃不固者附子理中湯加歸芍蓄血者瘀蓄下焦也仲景云太陽症不解熱結膀胱其人如狂血自下者愈表邪不解者宜表表後而少腹急結者乃可攻之桃核承氣湯此瘀始積其輕者也若表盡而裡熱深乃其重者抵當湯攻之凡傷寒少腹脹滿不痛小便不利者溺澀也按之繞臍硬痛小便短澀大便不通燥屎也惟按之小腹硬痛小便自利或大便黑色喜怒如狂者畜血也動陰血者傳經至手足厥冷是謂熱極反厥誤投熱藥迫血妄行或從耳目或從口鼻一擁而出名曰動陰血又名下厥上竭為難治鼻鼾者鼻中發聲如鼾睡也為風熱壅閉鼻鳴者鼻氣不清言響如甕中出此屬風寒壅塞須按症治不能言及語言難出者有表裡之分太陽症發汗後身熱者名曰風溫其症脈浮自汗身重多眠而語言難出者此表邪蘊其內熱萎蕤湯去麻黃加秦艽主之又少陰症咽中傷生瘡而不能言者古方治以苦酒湯宜用甘桔湯加牛蒡薄荷元參白前之屬以清之復有風寒客於肺中聲啞不能言者用半夏生薑荊防等辛溫以散之更有中寒之症口鼻氣冷口噤難言者當用溫熱之劑大抵唇焦口舌乾口渴者熱也唇淡口和氣冷者寒也溫瘧者傷寒邪熱未除復感風邪變為溫瘧其寒熱依時而作與少陽症無定時者不同大抵熱多寒少或先熱後寒每致神昏譫語用小柴胡湯去半夏加黃連知母貝母身重難轉側者大都屬寒然亦有熱者風濕相搏骨節煩疼不嘔不渴者桂枝附子湯此表寒也少陰症腹痛四肢沉重下利者真武湯此裡寒也若風溫症脈浮汗出身重者萎蕤湯又三陽合病腹滿身重譫語遺尿者白虎湯又陰陽易亦有身重少氣者附子理中湯發黃者寒濕如熏黃色暗而不明茵陳五苓散茵陳姜附湯濕熱則黃如橘色染衣如檗梔子檗皮湯茵陳大黃湯又有瘀血發黃亦濕熱所致痙者項脊強頭動搖口噤背反張是也有三陽病而發者有因胃腑實熱者有三陰中寒而發者有因內傷氣血者如頭搖口噤背反者太陽痙也加減小續命湯若頭低視下手足牽引者陽明痙也前方加升麻葛根若眼目斜視手足搐搦者少陽痙也小柴胡湯加桂枝勾藤如口噤胸滿腳攣急大便閉必齘齒者胃腑實熱痙也三乙承氣湯下之如發熱脈沉細肢冷自汗者為陰痙風寒中臟也附子理中湯加防風肉桂主之亦有內傷發痙者肝血不足血燥生風目斜手搐逍遙散加人參桑寄生主之若大病後産後氣血大虛者用十全大補湯加釣藤寄生如不應急加附子斑疹者一曰傷寒二曰溫毒三曰時氣四曰陰症傷寒失治熱毒蘊結發斑紅赤者胃熱紫赤者熱甚紫黑者胃爛三黃解毒湯或犀角大青湯清之此證脈有力者為順沉小者為逆如譫語便閉調胃承氣湯下之大抵解胃熱之毒必用黃連大青犀角元參升麻青黛石膏知母芩柏山梔之類溫毒發癍者冬令感寒至春夏發犀角大青湯主之時氣發癍者人感天時不正之氣憎寒壯熱大紅點見於膚表為癍小紅點行於皮中為疹疹發於肺升麻葛根湯加大力子以散之癍出於胃犀角大青湯清之更有陰症發癍者寒伏於下逼其無根之火上熏於肺發癍點如蚊蚤咬痕用調中溫胃之劑其點自退然亦有涼滋而愈者須審寒熱治之結胸痞氣者經云病發於陽而反下之因作結胸病發於陰而反下之因作痞結胸重而痞輕也傷寒邪在三陽下之而成結胸其症胸腹滿痛手不可近先用小陷胸湯如結實難解更用大陷胸湯攻之若邪入三陰而未結聚猶宜清解之下之太早則成痞氣其證胸前痞滿半夏瀉心湯主之又有水結胸者水飲停蓄也小半夏加茯苓湯復有寒實結胸症乃寒氣結聚誤用下藥而成須用白散主之凡一切結胸痞氣藥不效者乃濁氣結聚枳實理中丸甚效臟結者病人素有宿積連於臍旁新邪又痛引陰筋此邪氣結實難治也振戰栗者聳動為振戰搖為戰心跳為栗虛症多有之而邪正交爭亦發戰栗察症治之筋惕肉瞤者經云陽氣者精則養神柔則養筋今發汗多津液枯少陽氣大虛筋肉失養故惕惕而跳瞤瞤而動也急宜溫經益陽真武湯主之叉手冒心者發汗過多心下悸欲得按也桂枝甘草湯驚悸者心惕惕然跳動也有氣虛者有汗下損津液者有水氣者按症治之小便不利有數種因汗下者津液不足也黃疸熱病者鬱熱內蓄也風濕相搏與陽明中風皆寒氣所乘也更有氣虛者宜詳辨之遺溺者傷寒中危急之候下焦虛寒不能攝水理中四逆等主之三陽合病亦有之此熱甚而陰挺失職也白虎湯主之大約熱甚者可治虛寒者難治若雜症遺尿多屬氣虛補中益氣湯主之厄逆者即𩜺也氣自臍下直衝胸也傷寒失下胃火上衝而厄者其症燥渴閉結大柴胡湯下之便不結瀉心湯主之若三陰中寒胃氣欲絶而厄者其症厥冷下利附子理中湯合丁香散溫之厄不止則死懊憹者即懊惱心中鬱郁不舒由表邪乘虛內陷結伏心胸間梔子豉湯吐之鬱冒者昏冒而神不清也經云諸虛乘寒則為厥鬱冒不仁此寒氣上逆也當溫補又陽明症澀閉喘熱者有燥屎也下之又傷寒傳之五六日漸變神昏不語形貌如醉或睡中獨語與水則咽不與則不思此熱傳心胞絡也宜導赤散合黃連解毒湯以清之奔豚者氣從少腹上衝心而痛如江豚之上竄此下焦陰冷之氣宜用姜附湯加吳萸肉桂茯苓或佐橘核小茴川楝尤效身熱惡寒身寒惡熱者身大熱反欲近衣此熱在皮膚寒在骨髓傷寒外感之屬也身大寒反不欲近衣此寒在皮膚熱在骨髓熱邪內郁之候也風溫者傷寒汗後感風其症灼熱脈浮身重多眠鼻息鼾語言難出萎蕤湯主之濕溫者本傷於濕因而中暑其症兩脛逆冷胸滿頭目痛妄言多汗脈陽浮而陰小切忌發汗蒼朮白虎湯主之風濕相搏傷寒八九日身體煩疼不能轉側不嘔不渴脈虛浮而澀者桂枝附子湯主之若口渴者不可用勞復食復女勞復者大病後勞倦傷氣名勞復補中益氣湯主之若飲食傷脾名食復宜調胃氣以消食枳實梔子豉湯主之若犯房事致病復名女勞復頭重目眩腰背疼小腹絞痛人參三白湯主之陰陽易者病後交接男遺於女女遺於男症與女勞復同人參三白湯治之若吐舌者大危也狐惑者狐疑不決之狀內熱生蟲也蟲蝕肺則上唇生瘡名曰惑蝕肛則下唇生瘡名曰狐用雄黃丸陽毒陰毒者熱之極寒之甚也陽毒則斑黃狂亂梔子湯加人中黃陰毒則厥逆清穀身痛如被杖四逆湯加蔥白二症或兼咽痛百合病者行住坐臥若有神靈默默意趣不樂百合知母湯主之壞病本太陽症汗吐下仍不解須察何藥所誤見某症用某藥救之熱入血室者婦人傷寒經水適來邪氣乘虛陷於血海之中晝則明瞭夜則譫語如見鬼狀者治法無犯胃氣小柴胡湯去半夏加桃仁紅花生地丹皮陰躁似陽躁者陰極反躁也脈沉遲無力口燥渴而不能飲欲坐臥泥水宜用溫劑設誤認為陽躁即敗陽厥似陰厥者熱極而發厥所謂熱深厥亦深也寒厥初病即見熱厥以漸而來腫有三症太陽風濕相搏身微腫者宜疏風祛濕陽明風熱耳前後腫者宜刺或用普濟消毒飲大病瘥後腰以下腫者宜利小便除中者傷寒六七日脈遲為寒誤投涼藥而反能食名曰除中言食下即除去也為難治氣上衝心者腹裡氣時時上衝也傷寒傳至厥陰消渴而沖者熱症也經云諸逆上衝皆屬於火也如太陽傷風症頭不痛項不強寸脈浮胸中痞鞕氣衝咽喉不得息者胸有寒也瓜蒂散吐之筆花氏曰仲景傷寒數卷其精妙無以復加一切病症悉得資為法竅直可以參天地立民命與古帝王精一執中之訓萬世常昭矣後世取法者各抒議論簡帙繁多恐有滋惑概不採入特是傳經之症變幻無常全在臨疹時靈心妙悟因事制宜勿致拘執不通始免泥古戾今之咎慎哉慎哉傷寒兼症湯頭止嗽散用桔白前百部橘紅紫苑甘二陳湯半陳甘草與茯苓犀角地黃湯赤芍丹皮麥冬相生地四物湯養陰芎歸芍藥地用生桃核承氣湯大黃桃仁甘草桂枝芒抵當湯用虻蟲桃仁水蛭大黃攻萎蕤湯芎防萎蕤乾葛羌石膏杏仁草白薇青木香真武湯用附子術茯苓生薑與白芍茵陳五苓治發黃五苓茵陳加棗姜茵陳姜附用乾薑附桂茵陳術草良梔子檗皮湯甘柏治陽黃茵陳大黃湯再加梔子相三乙承氣大黃靈枳實厚朴草玄明逍遙散加味柴苓白朮甘丹皮歸白芍山梔薄荷煎十全大補八珍齊再添肉桂與黃耆三黃解毒用黃連芩柏山梔一併煎犀角大青湯玄參梔草良升麻芩連柏大渴石膏將升麻葛根湯即陽明症之葛根湯小陷胸湯結胸求黃連半夏並瓜蔞大陷胸湯生大黃芒硝甘遂共成方半夏瀉心用連芩乾薑棗草與人參小半夏加茯苓湯茯苓三兩夏甘姜白散三錢貝母桔一分巴豆去皮心炒研共為末白飲和勻作二服枳實理中丸乾薑四君全桂枝甘草湯即前桂枝湯倍甘草丁香散共柿蒂五炙草乾姜相為佐梔子豉湯梔香豉服後隨手探吐之加枳實名枳實梔子豉湯導赤散用木通赤苓生地燈心沖黃連解毒湯即前三黃解毒湯人參三白湯補好四君附子白芍棗雄黃丸研當歸檳榔麝香並蘆薈梔子湯梔芩升麻草杏仁石膏柴母芍豆豉大青成加入中黃尤效百合知母湯二味共成方普濟消毒治大頭芩連大力橘紅求翹桔玄參柴馬勃升麻甘草薄荷稠瓜蒂散赤小豆香豉煎湯探吐奏二味為末用豉湯服之探吐
