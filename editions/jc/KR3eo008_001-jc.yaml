body:
  text: 卷一陰屬諸郁郁之為病陰極之象也內經六元正紀云五運之氣鬱極乃發待時而作太過則暴不及者徐暴者為病甚徐者為病持治之奈何木鬱達之火鬱發之土鬱奪之金鬱泄之水鬱折之然調其氣過者折之以其畏也所謂泄之內經又云東方生風在志為怒怒傷肝以悲勝之南方生熱在志為喜喜傷心以恐勝之中央生濕在志為思思傷脾以怒勝之西方生燥在志為憂憂傷肺以喜勝之北方生寒在志為恐恐傷腎以思勝之又曰心怵惕思慮則傷神脾憂愁不解則傷意肝悲哀動中則傷魂肺喜樂無極則傷魄腎盛怒不止則傷志恐懼不解則傷精憂愁恐懼則傷心形寒冷飲則傷肺悲哀太甚則胞絡絕五臟六腑皆搖經又云嘗貴後賤雖不中邪病從內生名曰脫營嘗富後貧名曰失精暴怒傷陰暴喜傷陽厥逆上行脈滿去形趙養葵曰郁者抑而不通之義內經五法因五氣所乘而致郁非專言憂鬱也景岳曰凡人血氣一有不調而致病皆得謂之郁亦無非五氣所化耳如木應肝膽主風邪鬱則滯抑故宜達或表或里但使經絡通行則木鬱自達矣火應心與小腸主熱邪鬱則陷伏故宜發或虛或實但使氣得升揚則火鬱自發矣土應脾胃主濕邪鬱則壅淤故宜奪或上或下但使濁穢得淨而土鬱自奪矣金應肺與大腸主燥邪鬱則秘塞故宜泄或清或濁但使氣液得行而金鬱自泄矣水應腎與膀胱主寒邪鬱則凝溢故宜折或陰或陽但使精從氣化而水鬱自折矣雖然五法之中各有圓通之妙如木鬱之治宜於達若氣陷則發即達也氣壅則奪即達也氣秘則泄即達也氣亂則折即達也又火鬱之治宜於發若元陽抑則以達為發臟腑結則以奪為發膚竅閉則以泄為發津液不化則以折為發至於奪者挽回之謂大實非大攻不足以蕩邪大虛亦非大補不足以奪命是攻補皆奪也折者折中之謂火實則陽亢陰虛火虛則氣不化水是制水益火皆折也石頑曰丹溪制六郁之論立越鞠丸以治郁謂氣鬱則濕滯而成熱熱鬱則痰滯而血不行食不化六者相因為病此說與內經之旨未合蓋東方生木生生之氣火氣即附於木中故木鬱則火鬱土鬱而金亦郁水亦郁五行相因自然之理也治木鬱而諸郁皆開矣逍遙散是也甚者加左金丸郁有六氣之郁風寒暑濕燥火是也有七情之郁喜怒憂思悲恐驚是也有人事失養之郁氣血痰食是也當分治之論六氣之郁風鬱之症由皮毛而入經云賊風邪氣乘虛傷人淺者止犯皮毛深者遍傳經絡其症鼻塞身重或頭痛寒熱咳嗽痰喘失治則風鬱藏於皮膚之間內不得通外不得泄善行而數變腠理開則灑然寒閉則熱而悶寒則衰飲食熱則消肌肉且內舍於肺則發咳上氣傳之肝則厥脅痛出食傳之脾腹中熱煩心出黃傳之腎為疝瘕少腹冤熱而痛傳之心筋脈相引為瘛其入深者內搏於骨為痹搏於筋為攣搏於脈中血閉不通為癰搏於皮膚衛氣不行為不仁治宜六安煎及參蘇飲若化熱局方羌活散冬月桂枝湯酌用此治風鬱之法也寒鬱之症有由外而入者有由飲食而致者有由內而成者宜分治之其由外入者風寒之感也初起發熱惡寒失治則外寒鬱而傷形輕者頭痛身重嘔惡脹滯筋骨痠疼治宜香蘇散神朮散五積散等主之重者或傳經化火或直中三陰症狀治方具詳後卷傷寒門中其由飲食致者生冷之傷也初起吞酸噯腐失治則內寒鬱而傷脾為霍亂轉筋為泄痢為久瘧為痞積為厥脫治宜溫胃飲理中湯四逆湯加肉桂木香之類其由內而成者或勞欲火竭或稟賦陽虛此根本之虧也初起時眩暈倦怠畏冷惡風失治則虛寒鬱而氣血日損為厥逆不食氣喘陽痿脈沉濡五更泄瀉治宜八味丸理陰煎理中湯右歸飲大補元煎之屬此寒鬱之治也暑郁之症由口鼻而入輕者為傷暑重者為閉暑其煩熱口渴面垢小水不利脈虛自汗失治則暑郁入心肺為煩悶昏暈為喘為痿入脾胃為泄痢為久瘧治宜四味香薷飲合四苓益元散生脈散之類甚則人參白虎湯暑邪瀰漫三焦者杏翹清肺飲至寶丹若兼風襲者六和湯加羌活紫蘇因貪涼及生冷受寒者非暑病也藿香正氣散及溫胃理中等酌用此暑郁之治也濕鬱之症身半已下受者居多雨露之濕本於天泥潮之濕本於地酒漿水果汗液之濕本於人初起在肌表但發熱惡寒自汗身重脈滑舌膩失治則濕鬱入經絡為痹為痿為筋骨四肢痠痛腰痛不能轉側入肌肉為麻木為胕腫腳氣為黃疸入臟腑為嘔惡咳嗽為脹滿為溺澀黃赤為濡瀉腹痛水腫㿗疝治法宜分寒熱治濕熱宜清宜利熱去濕亦去也用四苓益元大小分清飲等加芩連之屬治寒濕宜燥宜溫非溫不能燥也用神術湯胃苓湯平胃散羌活勝濕湯加薑桂之屬此濕鬱之治也燥郁之症由時令亦由內涸有臟腑之燥有血脈之燥其症咽鼻生干煩渴咳逆溺少便難手足痿弱失治則燥郁在肺為咽痛為乾咳吐血稠痰為胸痹在肝為脅痛氣逆目幹不明在腸胃為噎膈三消便秘便血腹痛在腎為消渴在血脈為風生抽掣易曰燥萬物者莫熯乎火非清火不能去燥治用潤燥湯麥門冬湯潤腸丸生地黃煎火甚石膏大黃酌用血虛者甘露飲地黃丸加當歸蓯蓉麻仁蔞仁牛乳蜂蜜之類此燥郁之治也火鬱之症有賊火有子火賊可驅而不可留子可養而不可害賊火由六氣飲食暖坑窯灶而得郁之則薰灼臟腑煩渴肌消必至陰涸而後已子火即命門之真陽生生之橐鑰郁之則元陽不升穀食不化水火不相為用為不食為腎瀉為水腫陰結虛寒症百出矣治法宜用表清攻三法以驅賊如升陽散火湯白虎湯黃連解毒湯承氣湯等是也用溫補法以養子如八味丸右歸飲等是也此火鬱之治也論七情之郁喜郁之症志得意滿之病也經云喜則氣和志達營衛通利故氣緩何病之有然或在君父尊長之前同人失意之際遇喜不便形容如謝安之對奕報捷故示從容旋折屐齒之類皆喜郁也喜而鬱則神散而不藏其發也狂為喜笑不休口流涎目黃皮革焦毛悴色夭治宜天王補心丹若心熱多笑黃連解毒湯加半夏薑汁竹瀝且以恐勝之此喜郁之治也怒郁之症經云血有餘則怒怒則氣逆甚則嘔血及飧泄怒而鬱則氣逆上而不下即傷肝其症脅脹疼痛頭疼目不明昏冒厥逆婦女經閉乳疾治用越鞠丸四磨飲化肝煎柴胡疏肝散之類生痰者二陳湯然久郁忿忿不解必大傷其陰而成勞損噎膈痞結諸症宜逍遙散歸脾湯等以調養之更用訪勝尋樂之事以散其悶或以悲勝之血逆者通瘀煎人參清肺散酌用此怒郁之治也憂鬱之症全屬大虛多因衣食之累利害之牽及悲憂驚恐所致蓋悲則氣消憂則氣沉必傷脾肺驚則氣亂恐則氣下必傷肝腎憂至於郁此其慼慼悠悠精氣消索已非一日經云憂愁者氣閉塞而不行將見噎膈勞損便血瘡瘍虛症滋起古人琴書以消憂出遊以寫憂皆良法也治宜培養真元用七福飲四君異功六君大補元煎等治之此憂鬱之治也思郁之症惟曠女釐婦及螢窗困厄積疑任怨者有之經云思則心有所存神有所歸正氣留而不行故氣結而傷於脾郁之久則上連肺胃而為喘咳為失血為噎膈嘔吐下連肝腎為帶濁崩淋不月為勞損初病者宜順宜開久病而損及中氣者宜修宜補然以情病者非情不解即以怒勝思亦暫時之計耳俗諺云心病還須心藥醫可謂一語破的治用逍遙散二陳湯六君七福之屬酌用此思郁之治也悲鬱之症經云心氣虛則悲悲則氣消悲而鬱則心系急肺布葉舉而上焦不通營衛不散熱氣在中故氣消其症則心下崩數溲血悲痛苦惱者心神煩熱躁亂而非清淨也悲哭而五液俱出者火熱亢極而反兼水化制之也甘麥大棗湯主之大約悲因於有所失唯用亡羊補牢之計使其失不足惜則前事自忘而悲可愈治法潤肺中兼順其氣此悲鬱之治也恐郁之症經云肝氣虛則恐精氣並於腎則恐心怵惕思慮則傷神神傷則恐懼自失膽病者心下憺憺若人將捕之此症本無所驚心自動而不寧自由元虛陰弱心神不足而然失治而鬱則精卻上焦閉下焦脹故氣不行治法若腎傷者宜補精髓六味丸加枸杞遠志若肝虛者宜養陰血六味丸加棗仁龍齒治陽明者壯其氣四君子加木香治心包者鎮其神七福飲秘旨安神丸加硃砂琥珀犀角膽虛者補膽防風湯勞心過度夢寐不安者一味鹿角膠酒溶多服此恐郁之治也驚郁之症經云驚則氣亂心無所倚神無所歸慮無所定故氣亂惡人與火聞木音則惕然失治而鬱則生火生涎涎與氣搏變生諸症或短氣自汗異夢驚魘或怔忡心悸癲癇神呆妄言妄見大抵驚症本因內氣先虛猝聞異響見異物及遇險臨危而驚其肝膽則神魂失守且驚則神出於舍而舍空痰飲乘虛襲入其神不得歸又肝藏魂肝虛遇驚則風氣水飲乘虛襲入其魂飛揚若離體狀治法用溫膽湯加炒棗仁送下遠志丸或平補鎮心丹秘旨安神丸俱可若氣鬱生痰而驚悸者四七湯加茯神遠志石菖蒲至神魂不歸魂夢飛揚者此木盛生風木槁生火不可概作心血虛治先用獨活湯數劑後用珍珠母丸神效此驚郁之治也論人事失養之郁氣不可以郁也經云人本於陰陽九竅五臟十二節皆通於天氣此壽命之本也故肺氣通於鼻心氣通於舌肝氣通於目脾氣通於口腎氣通於耳衛氣之行一日一夜五十周於身晝行於陽二十五周夜行於陰二十五周是以平旦陰盡陽氣出於目目張則氣上行於頭正以氣之為用無所不至一有不調則氣鬱矣鬱則內閉九竅外壅肌肉在外有六氣之侵在內有九氣之亂而凡病之為虛為實為熱為寒其變態莫可名狀治此者惟有調之一法然自河間相傳咸謂木香檳榔可以調氣陋矣夫調者調其不調之謂也如邪氣在表散即調也邪氣在裡行即調也實邪壅滯瀉即調也虛羸困憊補即調也此外如按摩針熨可以調經絡之氣勝憂勝怒可以調情志之氣穀食果畜可以調化育之氣凡一切溫清升降潤燥緩峻之治莫非調之之法不獨越鞠丸逍遙散神祐承氣諸方為能治氣之郁也此氣鬱之治也血亦不可郁也經云營衛者精氣也血者神氣也精藏於腎所蘊無多血富於沖所至皆是蓋其生化於脾總統於心藏受於肝宣布於肺施泄於腎灌溉一身無所不及凡為七竅之靈四肢之用筋骨之和柔肌肉之豐盛以至滋臟腑安神魂潤顏色充營衛津液得以通行二陰得以調暢皆血之用也然血屬陰氣屬陽陰靜陽動故血每隨氣而流行一失其和則血鬱矣凝於膚者為痹凝於脈者為泣凝於足者為厥壅瘀於經絡則發為癰疽膿血鬱結於腸臟則留為血塊血癥或乘風熱則為癍為疹或滯陰寒則為痛為痹亦有留滯中焦痛悶不散吐出紫黑成塊者此其間宜散宜利宜溫宜通宜消宜攻宜和宜養全在臨症施行俾血脈和則精神乃居此血鬱之治也痰鬱之症有風痰有寒痰有熱痰有燥痰有濕痰有老痰有食積痰皆能為郁其症咳嗽食減面黃目下胞黑甚者為支飲為流注為癱瘓為中風昏冒厥逆為妄見鬼神治法風寒者散之熱者清之燥者潤之濕者辛以開之老痰食痰非攻不去飲成窠囊非蒼朮不能傾痰在皮裡膜外非白芥竹瀝不能達此痰鬱之治也食鬱之症其初不過停留可消可化迨郁之久則成積矣有食則惡食噯滿痞塞便秘不通一經血裹則為癥結為九蟲為食癇為瘦削成癆宜用治積之法以所惡者攻之以所喜者誘之如神麯麥芽治麵食酒積者也楂炭烏梅皮硝五穀蟲治肉積者也穀芽陳皮萊菔子治米食者也肉桂木香治水果者也枳實厚朴檳榔大黃治堅硬之物者也附桂乾薑治菌菇之寒毒者也蒜頭蘿蔔治薰燒之火毒者也蒼朮半夏治水濕之成飲者也蘆薈蕪荑治食滯之成蟲者也去其積而鬱開矣此食鬱之治也筆花氏曰郁之為義有否象焉有畜象焉凡天之六氣人之七情感之者一失其暢順之機即病而為郁前明劉基謂蓄極者泄閟極者達熱極則風壅極則冬可見鬱於中者未有不發於外但所發之症全視其人氣血之強弱以為吉凶禍福之判能勝者郁解則復不能勝者抱郁以終矣大約六氣之郁外邪多實七情之郁內傷多虛世之治郁者不問何因但以鬱金香附烏藥枳殼之類而曰吾開其鬱此特坐井之見耳余思人身一小天地通則泰塞則否而天地之所以致此否者恆暘恆雨恆燠恆寒咎徵之來巳非一致人之郁亦猶是也故曰郁者萬病之源也易曰小人道長君子道消內陰將盛之候也因屬於陰以為卷首諸郁湯頭越鞠丸須香附芎蒼朮山梔神麯從逍遙散用柴歸芍苓朮陳甘煨姜薄有方去姜加山梔左金丸治肝經熱黃連吳茱共為末六安煎用夏甘苓白芥陳皮共杏仁參蘇飲用木香葛前夏苓陳甘枳桔局方羌活散麻防細蔓菁前胡芎枳菊苓草石膏芩桂枝湯治太陽風芍藥桂甘薑棗同香蘇散用蘇葉香附甘陳薑棗啜神術湯用蒼朮防風甘草加蔥白五積參苓夏陳甘枳樸蒼麻黃歸芍桂芎芷桔乾薑溫胃飲用參朮陳扁豆乾姜歸草能理中湯用術參姜炙草還加制附剛四逆湯須冷服附子乾薑甘草足六味地黃湯山山熟地黃丹苓兼澤瀉八味附桂相理陰煎用炙草歸熟地乾薑附肉桂右歸熟地萸杞好附桂杜仲山藥草氣虛參朮乾薑找大補元煎參熟山萸杞當歸杜仲甘四味香薷用扁豆厚朴香薷甘草湊四苓散用豬赤苓瀉術加桂即五苓益元散用朱甘滑除卻硃砂名六一生脈散治熱傷氣人參麥冬北五味人參白虎湯知石糯甘相杏翹清肺飲通草貝蔞薷豉滑梔絲竹玄荷蔻苡蘆至寶丹用牛黃犀角硃砂安息香玳瑁琥珀金銀箔龍腦雄黃共麝香藿香正氣芷腹苓半樸蒼蘇桔草陳大分清飲二苓通車澤山梔枳殼從小分清次用二苓枳樸澤瀉並苡仁胃苓湯用五苓再加平胃合而成平胃散製蒼朮炙草陳皮同厚朴羌活勝濕湯防風羌獨藁本蔓草芎潤燥湯用通幽桃紅生熟地黃儔升麻歸草磨檳汁麻仁合共大黃投本方去麻仁大黃名通幽湯麥門冬湯桑根皮紫苑桔梗生地宜五味竹茹姜甘草酌加半夏麻黃齊石頑曰大病後餘邪釀火蘊肺咳血非麻黃不能開痰凝氣結非半夏不能祛此二味究宜慎之潤腸丸用麻仁桃羌歸大黃皂秦艽生地黃煎鮮地骨知母葳蕤蔞根茯生地麥冬生薑汁石膏白蜜加竹瀝甘露須天麥生熟地黃芩枳甘枇杷葉石斛共茵陳地黃丸一名六味丸即前六味地黃湯升陽散火湯升葛羌獨防人參柴芍藥生炙草加姜黃連解毒湯芩柏山梔相大承氣湯用芒硝枳實大黃厚朴饒去芒硝即小承氣天王補心丹參苓味遠玄棗仁天麥梗柏子地歸丹四磨飲用沉香烏藥枳實與檳榔化肝煎用青陳芍丹梔澤貝加白芥柴胡疏肝香附芎枳殼陳甘赤芍從二陳湯半陳甘草與茯苓歸脾湯用四君遠耆歸木香棗仁眼通瘀煎瀉香附查烏青歸尾木紅花人參清肺桑白皮杏仁阿膠粟殼隨炙甘知母烏梅肉一棗還須地骨皮七福飲用棗仁歸遠志參甘地術為四君子湯中和義參朮茯苓甘草比益以夏陳名六君祛痰補氣陽虛餌除卻半夏名異功或加香砂胃寒使甘麥大棗治悲哀甘草小麥大棗煨秘旨安神參棗仁半夏當歸芍茯神橘紅炙草五味子生薑湯下鎮神魂補膽防風參薑棗細獨前芎茯神草溫膽湯用二陳枳實竹茹紅棗並遠志丸用茯神苓菖蒲龍齒硃砂參平補鎮心丹苓神熟麥天山參龍齒遠朱棗味車前四七湯中有茯神遠志菖蒲配二陳獨活湯用羌活柴胡細辛姜草合參苓半夏共沙參五味棗仁烏梅肉珍珠母即石決明龍齒沉香柏子仁參苓棗仁兼熟地硃砂犀角與歸身神祐丸攻積牽牛與大黃青陳芫戟遂輕粉共檳香諸瘧附三陰瘧論治經云夏傷於暑秋必痎瘧夏暑汗不出者秋成風瘧又曰瘧之始發也陽氣並於陰此時陽虛而陰盛故先寒迨陰氣逆極則復出之陽陽與陰復並於外則陰虛而陽實故復熱而渴夫並於陰則陰勝並於陽則陽勝陰勝則寒陽勝則熱工不能治其已發為其氣逆也其日作者邪氣與衛氣並居衛氣晝行於陽夜行於陰邪氣得陽則外出得陰則內薄內外相薄是以日作其間日作者邪氣內薄於臟橫連募原其道遠其氣深其行遲不能與衛氣俱行而出故間日乃作其間數日發者陰氣多而陽氣少則其發日遠陽氣多而陰氣少則其發日近勝復之氣會遇之時有多少也其作日有晏與早者邪氣客於風府循膂而下日下一節故作也晏久則其氣上行氣日益高故作日益早又曰先寒而後熱者曰寒瘧先熱而後寒者此先傷風而後傷寒曰溫瘧其但熱而不寒者此陰氣先絕陽氣獨發少氣煩冤手足熱而欲嘔曰癉瘧金匱云癉瘧者肺素有熱氣盛於身消爍肌肉可用白虎意溫瘧者脈如平人多熱少寒骨節疼時嘔白虎加桂枝主之牝瘧者多寒無熱此邪伏於腎氣不外行蜀漆散主之瘧病發渴者小柴胡去半夏加栝蔞石膏若寒多熱微或但寒不熱柴胡桂薑湯一劑如神機要曰瘧有中三陽者各顯三陽經症在太陽則汗之加味香蘇散等在陽明則清之下之白虎湯承氣湯等在少陽則和之小柴胡湯及景岳諸柴胡飲在陰經則不分三陰總謂之濕瘧當從太陰經治胃苓湯加羌活柴蘇傷之淺者在處暑前重者在處暑後張玉父謂牝瘧邪伏於腎濕瘧邪伏太陰皆但寒不熱濕則身重骨疼脹滿善嘔並宜柴胡桂薑湯食瘧則中脘生痰外乘於風必脹滿少食作嘔宜柴陳煎加枳殼草果陳無擇謂瘧有外因風寒暑濕成之有內因則心肝脾肺腎一有不和則痰飲鬱結皆能為瘧有不內外因如胃瘧飢飽失度勞瘧經年不瘥微勞不任是也當各隨症治之薛氏曰日久虛瘧微熱而無寒者胃氣虛也四君子加升麻當歸若中氣下陷補中益氣加茯苓半夏景岳曰若陰虛血液不充而邪不解者病在肝腎宜補陰益氣煎而惟休瘧飲尤妙何人飲亦佳瘧勢正熾一二髮間不可遽截胃弱者勿用寒涼止截截瘧之法小柴胡湯加常山二錢截瘧如神血氣虛者用何人飲休瘧飲止之氣血強壯者方可用常山飲若胃有伏痰鬱結草果飲瘧母系頑痰挾血食入絡而結為癥瘕宜通其絡鱉甲煎丸或小柴胡加鱉甲蓬朮桃仁俱用醋製虛人瘧母必用補益中加鱉甲筆花氏曰瘧為陰暑為陽內經夏暑秋瘧之說豈有伏熱而反化寒之理皆因暑月貪涼暑邪為風寒所襲至秋月暑退涼生伏氣內動其受病淺者瘧亦輕受病深者瘧亦重且邪伏何輕即現本經之症治法宜依傷寒六經之法調治方為對症非獨少陽一經用小柴胡而已也瘧發既多汗出自透伏邪亦必漸清而正氣為瘧所擾必無不虛故一見唇舌淡白即宜用六君子以養正加歸芍首烏炙甲以和陰則瘧止而正自復矣其氣陷者補中益氣升提之烏梅生鱉甲以截之此不易之法也如實有大寒則加桂附有伏火則加芩連又在臨機觀變不能執一若邪未透而遽截之邪既清而過表之勢必變劇二者均所宜慎也瘧症湯頭蜀漆散即常山苗雲母龍骨漿水調小柴胡湯赤芍芩棗姜甘草夏人參柴胡桂薑湯此治牝瘧方桂枝蔞根牡芩芍草乾姜加味香蘇香附防荊秦陳草蔓芎姜正柴胡飲防風陳芍藥姜甘六味平一柴胡飲陳生地黃芩芍藥甘草記二柴胡飲夏細辛陳樸生薑甘草增三柴胡飲用柴陳芍藥歸甘生薑成四柴胡飲用參歸柴胡生薑甘草為柴陳煎治傷寒嗽姜甘苓夏消痰奏補中益氣耆朮陳參草升柴當歸身補陰益氣參地山升柴陳歸生薑甘休瘧飲用人參術當歸首烏甘草得何人飲用陳歸首烏人參生薑煨常山飲兼草果山甲檳梅甘知母草果飲須芎白芷青陳蘇葉草良薑鱉甲煎丸參乾薑䗪蟲鼠婦共蜣螂桂枝柴芍黃芩夏烏扇丹桃樸大黃葶藶阿膠硝石葦紫葳瞿麥又蜂房白虎湯治陽明熱知母石膏糯甘得小承氣湯無芒硝枳實大黃厚朴饒胃苓湯用五苓再加平胃合而成四君子湯中和義參朮茯苓甘草比附三陰瘧論治三陰瘧者三日一發丹溪名為痎瘧發於子午卯酉日者少陰瘧也發於寅申巳亥日者厥陰瘧也發於辰戌丑未日者太陰瘧也然也不可拘執大約此症陰氣多而陽氣少其發日遠內經云時有間二日而發者邪氣與衛氣客於六腑而有時相失不能相得故休數日而作也其初起發於夏秋者宜用二陳去陳皮加生朮檳榔常山逐痰為要稍加穿山甲以透經絡若暑結營分又當以香薷鱉甲苓夏歸甘薑棗祛暑而前藥無益也若元氣大虛止用六君子加草果烏梅如元氣下陷而發漸晏者用補中益氣湯大劑參朮薑棗為治石頑用人參一兩生薑一兩加桂枝少許冬月無汗稍加麻黃五更時服必止甚者連進三日無不愈者貧家人參減半合白朮五錢代之夜發加首烏當歸此方不特治三日瘧即虛人久瘧更效如不愈俟仲冬用之加桂枝立止
