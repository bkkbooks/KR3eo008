body:
  text: 卷三木屬中風附厥逆中風一症前賢異論紛如河間謂熱氣召風東垣謂氣衰召風丹溪謂濕痰召風喻嘉言謂三者人身兼有之風邪乘虛挾其素有之邪為患諸説迄無定準究應以內經及仲景之言為的內經曰風邪客於身半其入深營衛衰則真氣去邪氣內留發為偏枯又曰風者百病之長至其變化乃為他病又曰風從外入令人振寒汗出頭痛身重惡寒風寒客於人使人毫毛畢直皮膚閉而為熱是時可汗而發又曰虛邪中人始於皮膚腠理開則從毛髮入故皮膚痛不去則傳舍於絡脈不去傳舍於經不去傳舍於輸於伏沖於腸胃於募原又云邪中於面則下陽明中於項則下太陽中於頰則下少陽中於肩背兩脅亦中其經內經論中風如此並無猝倒昏瞶之症也仲景曰太陽病發熱汗出惡風脈緩者名曰中風桂枝湯主之金匱要略云風之為病當半身不遂或但臂不遂者此為痹脈微而數中風使然絡脈空虛賊邪不瀉或左或右正氣引邪喎僻不遂邪在絡肌膚不仁在經即重不勝入腑即不識人入臟舌即難言口吐涎仲景之論亦謂中風失治以漸而傳並無猝倒昏瞶諸症也自唐宋以後諸家因此經絡臟腑之論而遂分中經中血脈中腑中臟之殊致後人凡遇內傷氣脫猝倒厥逆等症悉混認為風之中臟矣今姑擇其可酌取者採列於左如李中梓云風邪中腑其病在表多著四肢故肢節廢脈浮惡風拘急不仁外有六經之形症以小續命湯及疏風湯汗之中臟者其病在裡多滯九竅二便閉唇緩不能言耳聾鼻塞目瞀以三化湯及麻仁丸下之中血脈者病在半表半裡外無六經之症內無二便之閉但口眼喎斜半身作痛唯當養血順氣以大秦艽湯或羌活愈風湯和之若中風昏倒無須順氣然後治風用竹瀝薑汁調蘇合丸灌之如口噤不開急用牙皂生半夏細辛為末吹入鼻內有嚏則生無嚏則死治法須分閉與脫症如牙關緊閉兩手握固閉症也三生飲開之若口開心絶手撒脾絶眼合肝絶遺尿腎絶聲鼾肺絶脫症也大劑理中湯救之或有得生者此以昏倒指中風而另在中腑中臟中血脈之外是一説也又程鍾齡曰中腑者中在表也外有六經之形症中太陽用桂枝湯中陽明用葛根湯加桂枝中少陽用小柴胡湯加桂枝中臟者中在裡也其人眩僕昏冒或痰聲如鋸宜分寒熱治之如素有積熱則風乘火勢牙緊握固是熱風閉症用牛黃丸開之大便祕三化湯攻之如素挾虛寒則眼合遺尿症見五絶是寒風脫症大劑理中湯救之若介乎閉與脫之間者用半夏橘紅各一兩濃煎生薑汁對衝灌之即蘇中血脈者中在經絡也其症口眼歪斜半身不遂大秦艽湯主之左用四物右用四君佐之此以昏冒眩僕指中臟而因其素挾之寒熱以分為閉與脫者也是又一説也惟張景嶽之論則不然言風寒之中於外者為風邪是外感之表症其不由外感而亦名風者為肝邪是內傷之裡症外感者病由乎經或寒熱走注腫痛偏枯即風寒濕三氣之外侵也內傷者病出乎臟精虛則氣去而神去所以眩暈昏瞶也今先論真中風之治凡治中風之法宜察淺深虛實中經者邪在三陽其病猶淺中臟者邪入三陰其病實深在淺不治則漸入於深在經不治則漸入於臟此淺深之謂也正勝邪者乃可攻其邪正不勝邪者必先顧其本此虛實之謂也大風大寒直中三陰致危者必用金匱續命湯去石膏治之若風寒在經頭痛身痛惡寒拘急者宜麻黃湯麻桂飲加減甚者亦宜續命湯若頭疼有汗惡風者宜桂枝湯或五積散若風邪在經熱多寒少而為偏枯疼痛發熱宜秦艽湯甚者愈風湯亦可此外如輕淺在肺者為傷風在表裡之間者為瘧疾遍傳六經者為傷寒瘟疫入筋骨者為風痹上壅頭面者為大頭時毒凡此皆外感風邪之病舍此以外別無表症者均不得為風若於寂然無風飲食嚴密之地忽然暈僕偏廢此內奪厥逆之症非風也因連類而及論厥逆之治附厥逆厥逆之症危症也厥者盡也逆者亂也氣血敗亂之謂也內經云志不足則厥腎氣虛則厥又曰內奪而厥則為瘖俳河間曰將息失宜陰虛陽實故心神昏冒而猝倒無知也東垣曰人年逾四旬則氣衰而七情六欲傷其氣多有此症若壯盛肥人或有之亦是形盛氣衰耳丹溪謂南方濕土生痰病在左屬血虛挾瘀病在右屬氣虛挾痰景嶽謂此症是陽氣暴脫之候汗出者營衛之氣脫遺尿者命門之氣脫口開不合陽明經氣之脫流涎者太陰臟氣之脫癱軟者肝脾之氣敗昏倦無知語言不出者神敗於心精敗於腎也若無痰氣阻塞必先以大劑參附峻補元氣隨用地黃歸杞等填補真陰以培其本若僅口眼歪邪半身不遂及四肢無力掉搖拘攣瘛瘲者皆筋骨之病也肝主筋腎主骨肝藏血腎藏精精血虧損不能滋養百骸當養血以除燥經所謂足得血而能步掌得血而能握也然血非氣不行氣非血不化血中無氣則病為縱緩氣中無血則病為拘攣宜小營煎大營煎十全大補湯之類若麻木不仁亦因血氣不至只宜培養氣血如猝倒不醒無痰氣者但扶定掐其人中以薑湯徐徐灌之若無痰而息微脈弱急以獨參湯或淡薑湯灌之如有痰而不甚用白湯送抱龍一丸俟痰氣稍開便當除其病本若痰甚者用淡薑鹽湯灌之以鵝翎代指探吐或以膽星一錢薑湯調下即蘇其久之不醒牙關不開者以生半夏牙皂細辛末吹鼻有嚏則生如死症已具而痰聲漉漉於喉間者吐亦無益且形氣大虛者亦不可吐若氣壅喘滿者淡薑湯送下蘇合丸有寒厥證一名陰厥其症肢冷脈沉語澀拘急急用蔥白一握搗炒尉臍下冷則更替寒微者宜溫胃飲八味地黃丸寒甚者宜右歸飲回陽飲理中湯其脈舉指弱按指大者生舉按俱絶者死身冷額汗者亦死陰厥過三日不治有熱厥症一名陽厥即酒厥煎厥之類必先多熱症脈必滑數手足揚掉或便祕昏冒火甚者用抽薪飲白虎湯火微者宜兼養陰一陰煎二陰煎之屬若夏月猝倒抽搐或煩渴者暑風也香薷飲氣虛者宜生脈散或竹葉石膏湯加人參又有氣厥症宜分虛實氣虛猝倒者形氣索然身冷脈微或遺尿自汗即氣脫症也宜大補元煎甚者以河間地黃飲子及回陽飲救之氣實而厥者其形氣憤然勃然胸膈喘滿此氣逆症也即肝厥薄厥之類經云大怒則形氣絶而血菀於上治宜蘇合丸化肝煎排氣飲四磨飲等先順其氣而調理之若元氣本虛者勿過行氣開滯又有血厥症亦宜分虛實血虛而厥者如大崩大吐或縱情竭欲産血大去等此血脫症也血既脫則氣亦隨之急用人參一二兩煎湯灌之氣復則蘇所謂血脫益氣也若兼用血藥則氣散而無所主矣蘇後宜大補氣血血實而厥者經所謂大怒傷肝血之與氣並走於上也此血逆症也應與氣逆參看夫血因氣逆必先理其氣宜用通瘀煎或化肝煎主之如血因欲火內熾或乘酒而升甚至汗喘衄咳此皆陰火上衝必先制火以抑其勢宜清化飲四陰煎一陰煎之屬若陰竭於下火不歸源別無煩熱脈症者非鎮陰煎不可更有食後發厥口不能言肢不能舉痛連胸膈尺脈全無此因抑遏肝膽之氣不得上升陽氣不舒下焦隔絶急用燒鹽沖滾水調飲以指探吐名燒鹽探吐法或炒鹽絹包乘熱尉痛處冷則更換或將麩皮生薑搗爛並炒亦佳痛定服保和丸此外有猝中外邪不正之氣名曰尸厥忽然面目青黑口噤妄言或痰湧昏迷察其實則蘇合丸虛則參附回陽散又有蛔厥者唇紅吐沫心腹大痛蟲長一尺貫胃則危衝心則死急以花椒湯止其痛再服烏梅丸筆花氏曰內經之言中風本甚詳明即仲景經絡臟腑之説亦謂風邪由漸而入自屬切中病情奈後世以厥逆猝倒混入中風則內傷諸症竟可以風邪中臟治之所誤誠非淺鮮幸景嶽以外感內傷分晰明確且以在淺不治漸入於深等句疏解其義獨得內經變化乃為他病及不去則傳舍於某某之旨而與仲景在絡在經入腑入臟字字具有著落真幽室中一明燈也愚按風性善入而動受之淺者不過頭痛咳嗽深者由皮毛而入經絡變症百出何必如河間東垣丹溪之言因火因氣因痰而後為患耶且仲景言中風用桂枝湯祗有太陽一經若果有直中三陰何不與傷寒並列則中臟之説亦難取信至閉脫二症尤有可疑風屬陽而性善竄方將多淚流涕發瀉豈肯自閉其門戶若風能脫人唯肝木乘脾吐瀉氣脫者有之然此係內風並非外感況所治之方一三化湯攻實熱者也一理中湯救虛寒者也均與風病無涉則閉與脫仍屬火症虛症何必牽言中風中臟耶鄙意痹症言在皮膚者輕在筋骨者重入臟腑者尤重多熱方是陽症無熱便是陰症數語足盡中風之義故病淺者宜驅風深者搜風中兼顧氣血至於猝倒昏瞶並無外感則竟從厥逆中論治余嘗屢用屢驗矣中風厥逆湯頭桂枝湯治太陽風赤芍桂甘薑棗從千金小續命湯芩防己官桂麻黃防附子人參芍藥及杏仁甘草川芎同薑煮疏風湯用麻黃杏仁益智升麻當三化湯用厚朴大黃枳實加羌活麻仁丸用朴杏仁枳實大黃芍藥成大秦艽湯用生熟歸芍芎防芩羌獨石膏炙草共細辛白芷秦艽苓白朮羌活愈風四物防參耆苓草桂辛蒼黃芩地骨柴胡殼杜仲前胡菊薄將夏朴石膏生地杞秦艽獨芷蔓麻黃蘇合丸用麝檀沉薰陸木香香附丁蓽術訶犀朱龍腦蘇合油共安息成三生飲用南星薑生附川烏共木香理中湯用參朮薑炙草還加制附剛葛根湯陽明升麻赤芍荊秦蘇甘白芷加減視寒溫小柴胡湯赤芍芩棗薑甘草夏人參牛黃丸用麝腦雄芎歸白斂芍防風犀羚杏麥柴芩桔黃卷阿膠神麯從肉桂蒲黃山藥棗乾薑金箔四君同四物湯治血芎歸熟地芍四君子湯中和義參朮茯苓甘草比麻黃湯治太陽寒杏仁甘草桂枝煎麻桂飲用麻黃桂當歸炙草陳皮配五積散參苓夏陳甘枳朴蒼麻黃歸芍桂芎芷桔乾薑小營煎用歸熟地芍藥山藥炙草杞大營煎用地歸杞杜仲肉桂甘牛膝十全大補八珍齊再添肉桂與黃耆抱龍丸用膽星麝天竺雄黃辰砂配溫胃飲用參朮陳扁豆乾薑歸草能地黃丸即六味地黃湯右歸飲地萸杞好附桂杜仲山藥草氣虛參朮乾薑找回陽飲用參附歸熟地乾薑甘草炙抽薪飲用芩柏梔澤枳甘通石斛宜白虎湯治陽明熱知母石膏糯甘得一陰煎用生熟地丹參冬芍牛甘記二陰煎用生地冬玄參苓棗草連通香薷飲用扁豆厚朴香薷甘草湊生脈散治熱傷氣人參麥冬北五味竹葉石膏湯最涼夏麥參甘粳米將大補元煎參熟山萸杞當歸杜仲甘地黃飲子熟巴萸附桂蓯蓉苓遠俱五味麥冬菖蒲斛少加薑棗薄荷齊化肝煎用青陳芍丹梔澤貝添白芥排氣飲用木藿香附澤枳陳烏朴四磨飲用沉香烏藥枳實與檳榔通瘀煎瀉香附查烏青歸尾木紅花清化飲用冬芍丹苓芩生地石斛煎四陰煎用生地麥沙參苓草百合芍鎮陰煎熟地膝附桂澤瀉炙草的保和丸用曲楂苓連翹萊蔔半夏陳烏梅丸內桂枝辛連柏薑椒歸附參痙附瘛瘲顫振拘攣經云諸痙項強皆屬於濕諸暴強直皆屬於風又云邪客於足太陽之絡令人拘攣背急引脅而痛又云督脈為病脊強反折仲景謂太陽病發熱無汗反惡寒者為剛痙太陽病發熱汗出不惡寒者為柔痙太陽病發汗太多則痙風病下之則痙瘡家發汗則痙太陽痙身強脈沉遲者用栝蔞桂枝湯取微汗治剛痙無汗者葛根湯治胸滿口噤臥不著席腳攣齘齒者大承氣湯仲景只出此太陽陽明實邪三方而不及治三陰虛症者此痙脈皆弦徑伏匿症多反張厥逆攻發之方難而溫散之方易也王海藏治剛痙用神術湯加羌獨麻黃治柔痙用白朮湯加桂心黃耆陳無擇謂痙症多由亡血筋無所營故邪得而襲之凡汗下過多及大病後多致斯疾景嶽曰足太陽之筋病脊反折項筋急足少陰之筋病主癇瘛及痙陽病者腰反折不能俯陰病者不能仰故痙乃太陽少陰之病也蓋腎與膀胱相表裡膀胱為津液之腑而腎為藏精之臟病在二經水虧可知治此者當以真陰為本凡痙症脈洪滑有火者一陰煎火甚陰涸者玉女煎痰甚者清膈煎有表邪者三柴胡飲多汗者小建中湯加人參泄瀉者溫胃飲瀉止而痙者五福飲若大虛脈沉細者大補元煎附瘛瘲瘛者筋脈拘急也瘲者筋脈弛縱也俗謂之搐暴病得之為風痰及肝火襲於經脈久病得之亦屬痰火乘虛肆虐治新病脈滿實者搜滌風痰為主治久病必補中寓搜總之脈虛緩者可治脈弦急者難愈附顫振經云諸風掉眩皆屬於肝若寒氣客於皮膚陰氣盛陽氣虛則為顫振有頭動而手不動者木盛則生風生火上衝於頭也若散於四末則手足動而頭不動矣肝經實熱者瀉青丸虛熱者六味丸肝木虛弱者逍遙散加參朮鉤藤挾痰者加竹瀝脾胃虛者六君子加芎歸鉤藤多汗加耆附心血虛者平補鎮心丹心經虛熱者導赤散附拘攣拘攣屬肝肝主筋也人但知攣為寒症而不知亦有血枯而熱者蓋寒則脛逆而痛桂枝湯熱則脛逆而枯六味加牛膝當歸若濕熱下注則疼腫便祕羌活勝濕湯至虛風襲於經脈手足短縮爪甲唇青腹痛轉筋者木瓜散循衣撮空循衣撮空摸床多是大虛之候不問雜病傷寒以大補投之多有得生者古人謂肝熱風淫末疾故手為之循撮其人必譫語妄言經云肺入火為譫妄也若婦人脫血枯燥揚手擲足者生地黃連湯主之熱極神昏便閉喘滿者涼膈承氣等下之若氣虛而熱乘肺金者升陽散火湯筆花氏曰痙症之病在筋脈其原由於血液陳氏謂亡血筋無所營一語足以破的惟其間有寒有熱有痰有火自當於養陰中隨症加減又考內經因於濕首如裹諸痙項強皆屬於濕之論因悟瘡家發汗則痙之旨瘡家本濕毒內蘊又膿出陰枯經絡素空一發其汗則濕氣乘虛入絡關節不利變而成痙則痙亦有因濕誤汗而成者不必定屬瘡家也凡濕溫之忌發汗亦此意也其在大病後泄後産後者半屬氣血垂脫非峻補不能救古方用附子白朮桂心歸耆通治三陰似不若加杞菟鹿膠補骨之屬兼填督脈其並非大病後者宜養營潤燥柔肝為主景嶽謂此症所急在元氣元氣復則血脈行審其別無外邪更宜益氣如人參養營十全大補皆一定之治也痙症湯頭栝蔞桂枝湯薑棗桂枝芍藥栝蔞草葛根湯用葛麻黃桂芍甘草棗生薑大承氣湯用芒硝枳實大黃厚朴饒神術湯用蒼朮防風甘草加蔥白白朮湯中用防風白朮甘草生薑同一陰煎用生熟地丹參冬芍牛甘記玉女煎用熟地石膏麥冬知母膝清膈煎用陳貝木膽星海石白芥錯三柴胡飲用柴陳芍藥歸甘生薑成小建中湯芍桂枝甘草飴糖薑棗施溫胃飲用參朮陳扁豆乾薑歸草能五福飲用參熟地當歸白朮炙草記大補元煎參熟山萸杞當歸杜仲甘瀉青丸用羌梔芎大黃龍膽歸防風六味地黃湯山山熟地黃丹苓兼澤瀉八味附桂相逍遙散用柴歸芍苓朮陳甘煨薑薄六君子湯治虛痰四君又加陳半添平補鎮心丹苓神熟麥天山參龍齒遠朱棗味車前導赤散用麥木通生地甘草竹葉同桂枝湯治太陽風赤芍桂甘薑棗從羌活勝濕湯防風羌獨藁本蔓草芎木瓜散用虎脛參草當歸桑寄生酸棗五加薑五片木瓜黃耆柏子仁生地黃連湯赤芍歸芎芩梔防涼膈散用翹芩實山梔前甘大黃薄升陽散火湯升葛羌獨防人參柴芍藥生炙草加薑人參養營苓朮草耆歸陳地桂心好五味白芍遠志薑再加三枚黑大棗十全大補八珍齊再添肉桂與黃耆眩運經云上氣不足腦為之不滿耳為之鳴頭為之傾目為之眩又曰上虛則眩上盛則熱痛髓海不足則腦轉耳鳴脛痠眩冒目無所見懈怠多臥又曰督脈虛則頭重高搖之又曰精脫者耳聾氣脫者目不明可見眩運一症虛者居其八九而兼痰兼火者不過十中之一二耳惟河間謂諸風掉眩皆屬肝木金衰不能制木而木復生火故風火為之旋轉也丹溪謂痰在上火在下無痰不能作眩雖因風因氣虛亦宜兼治其痰然頭痛為上實症頭眩為上虛症而上虛不能無涉於下上虛者陽中之陽虛也宜補其氣四君六君歸脾湯之屬下虛者陰中之陽虛也宜補其精五福七福右歸四物之屬若實有火者宜清痰者宜降氣者宜順濕者宜滲治法備矣筆花氏曰眩暈有陽虛有陰虛有痰火有濕熱有風邪有七情鬱結然無論外感內傷無不挾痰火而作丹溪以大黃酒炒三次為末茶送治其實也若氣血虛者則唯鹿茸五錢酒煎去滓少加麝香沖服必效若早起眩暈是胃中老痰以黑錫丹下之因房勞過度氣不歸元六味加沉香鹿茸大約肥人以清痰降火而兼補氣瘦人以滋陰降火而帶抑肝無有不應者眩暈湯頭四君子湯中和義參朮茯苓甘草比益以夏陳名六君卻痰補氣陽虛餌除卻半夏名異功或加香砂胃寒使歸脾湯用四君遠耆歸木香棗仁眼五福飲用參熟地當歸白朮炙草記七福飲用棗仁歸遠志參甘地術為右歸熟地萸杞好附桂杜仲山藥草氣虛參朮乾薑找四物湯治血芎歸熟地芍黑錫丹並杵硫黃附桂補骨木沉香葫蘆巴同陽起石金鈴肉果共茴香六味地黃湯山山熟地黃丹苓兼澤瀉八味附桂相怔忡驚恐怔忡之病經曰胃之大絡名曰虛里貫鬲絡肺出於左乳下其動應衣宗氣泄也其症心胸築築振動惶惶惕惕無時得寧是也自仲景始有動氣在上下左右之辨謂皆不可汗下良由陰虛於下宗氣無根而氣不歸原故在上則浮撼於胸臆在下則振動於臍旁患此者速宜養氣養精滋培根本若誤認為痰火則速其危矣治宜七福飲及大補元煎理陰煎之類若心虛挾痰則定志丸加半夏橘紅水停心悸者外臺茯苓飲寒痰停蓄者薑朮湯驚恐之症經云肝虛則目䀮䀮無所見耳無所聞善恐如人將捕之又曰陽明厥惡人與火聞木音則惕然而驚者陽氣與陰氣相薄水火相惡故惕然而驚驚則心無所倚神無所歸慮無所定故氣亂恐則精卻上焦閉氣還下焦脹則氣不行此症雖有感自外邪然非肝膽之氣不足則亦不易驚也宜安養心神為主安神丸十全大補湯心氣稍熱者硃砂安神丸此治法也然而驚則氣亂恐則氣下驚出於暫猶易於復恐積於漸甚不可解且心怯則神傷精卻則陽痿日消月縮不亡何待徒資藥力無益也惟恃大勇大斷者壯其膽方能拔其病根筆花氏曰怔忡虛症也古無是名自內經有其動應衣一語而仲景始有不可汗下之論總由陰虛勞損氣不歸原所致宜節欲節勞以養精氣治法或先氣而後精或先精而後氣且兼熱者宜清兼寒者宜暖又當因情酌用也至於驚恐亦全屬虛症有觸而怯者為驚無觸而怯者為恐症雖由肝總歸心病天王補心丹酸棗仁湯皆要藥也怔忡驚恐湯頭七福飲用棗仁歸遠志參甘地術為大補元煎參熟山萸杞當歸杜仲甘理陰煎用炙草歸熟地乾薑附肉桂定志丸用參朮菖硃砂茯遠麥牛黃外臺茯苓飲參朮生薑陳皮又枳實薑朮湯治寒飲桂夏苓甘大棗等祕旨安神參棗仁半夏當歸與茯神橘紅炙草五味子生薑湯下鎮神魂硃砂安神能治心生地歸甘黃連真十全大補八珍齊再添肉桂與黃耆天王補心丹參苓味遠玄棗仁天麥梗柏子地歸丹酸棗仁湯遠苓神參耆蓮肉草歸陳不寐經云衛氣晝行於陽夜行於陰今衛氣不得入於陰而常留於陽使陽氣滿則陽蹻盛而陰氣虛故目不瞑矣飲以半夏湯而臥又曰不得臥而息有音者是陽明之逆也故胃不和則臥不安又曰肺者臟之蓋也肺氣盛則脈大不得偃臥又曰壯者肌肉滑氣道通營衛之行不失其常故晝精而夜瞑老者肌肉枯氣道澀營氣衰少而衛氣內伐故晝不精夜不瞑其飲濃茶而不寐心有事而不寐者以心氣之被伐也蓋心藏神衛主氣衛氣入陰則靜而寐正以陽有所歸故神安而寐也而濃茶以陰寒之性制其元陽則神索不安心為事擾則神動而不靜故不得寐也大凡寐主乎神神安則寐神不安則不寐其所以不安者一由邪氣之擾一由營氣之不足耳如風寒瘧疾之不寐外邪之擾也痰火水氣食積忿怒之不寐內邪之擾也舍此則凡思慮勞倦驚恐憂疑及年老體弱之不寐者總屬真陰精血之不足陰陽不交而神不安其宅耳邪者去之虛者養之治法無餘蘊矣筆花氏曰經云胃不和則臥不安又云犯賊風虛邪者陽受之則入六腑身熱不時臥上為喘呼可見外而風寒邪熱暑氣乘心內而飲食濕痰水飲滯胃皆使不寐宜各去其病因而神自定矣更有思慮太過心血空虛怵惕為常夢魂驚悸此因水火失濟神不能藏惟宜大養元陰兼培正氣庶幾神安其室而一覺黑甜飄飄乎不知所止矣不寐湯頭半夏湯用長流水秫米半夏同煮美癲狂經云邪入於陽則狂邪入於陰則痹搏陽則癲搏陰則瘖本神篇云肝悲哀動中則傷魂狂忘不精肺喜樂無極則傷魄狂而意不存人又云足陽明之脈病甚則棄衣而走登高而呼妄言罵詈不避親疏不欲食又云重陽者狂重陰者癲癲即癇也與狂不同癲疾始生先不樂頭重痛目赤心煩忽然僵仆常昏多倦而靜狂病始生先自悲少臥不飢笑歌詈詈妄見妄聞常醒多怒而暴此陰陽寒熱之辨也癲病多由痰氣壅閉心竅倏病修已若氣滯宜四磨飲牛黃丸蘇合丸等痰甚用清膈煎抱龍丸硃砂安神丸等狂病多因肝火邪乘於心則神魂不守乘於胃則橫暴剛強宜抽薪飲服蠻煎白虎湯涼膈散等或鐵落飲亦佳其有癡呆症平素無痰因鬱結不遂而言辭顛倒舉動不經皆心與肝膽氣有不清而然若壯實者以服蠻煎治之丹溪治癲狂以行痰為主用黃連南星瓜蔞半夏等隨症而治有熱以涼藥清其心有痰必用吐法狂邪太甚研苦參為丸治之癇症眩僕喎斜作五畜聲定癇丸治之愈後河車丸筆花氏曰癲者神呆狂則躁妄而癇則昏暈吐涎總不外乎痰迷心絡然癲屬陰靜不免神志之虛狂屬陽動必挾升陽之火宜清宜補未可混施若癇則顯屬痰鬱發為五畜之聲古人聽其聲以別五臟亦不過取其意耳全在初發時及早開痰扶正加意圖治收功若延日久痰固結而病沉錮不可為己脈要精微論云衣被不斂言語善惡不避親疏者此神明之亂也門人韓之畿識癲狂湯頭四磨飲用沉香烏藥枳實與檳榔牛黃丸用膽全蠍麻附蠶防麝蟬蛻蘇合丸用麝檀沉薰陸木香香附丁蓽術訶犀朱龍腦蘇合油共安息成清膈煎用陳貝木膽星海石白芥錯抱龍丸用膽星麝天竺雄黃辰砂配硃砂安神能治心生地歸甘黃連真抽薪飲用芩柏梔澤枳甘通石斛宜服蠻煎用地芍茯菖母丹陳通麥斛白虎湯治陽明熱知母石膏糯甘得涼膈散用翹芩實山梔前甘大黃薄鐵落飲苓神玄丹貝膽星蒲翹天麥橘朱遠共鉤藤定癇丸半陳天麻貝苓神膽麥蒲蟲遠砂蠍珀丹參河車丸用人參丹參遠志兼苓神疝經云任脈為病男子內結七疝女子帶下瘕聚又云督脈生病從少腹上衝心而痛不得前後為沖疝又云足厥陰之別循脛上睪結於莖其氣逆則睪腫卒疝實則挺長虛則暴癢又云足厥陰之筋病陰器不用傷於內則不起傷於寒則陰縮入傷於熱則縱挺不收又曰小腸病者小腹痛腰脊控睪而痛時窘之後凡小腹睪丸為腫為痛止作無時者皆為疝七疝者寒水筋血氣狐㿗也雖諸經各有致病之由而總不離乎厥陰因其筋聚於陰器也寒疝者囊硬如石陰莖不舉控睪丸而痛寒也宜溫之水疝者囊腫陰汗或狀如水晶癢而出水風濕也宜逐水筋疝者莖腫脹痛癢或潰膿筋縮挺縱或精隨溲下房勞也宜清心血疝者狀如黃瓜在少腹兩旁橫骨之中俗云便癰因燠氣流溢結成癰腫也宜和血氣疝者狀連腎區下及陰囊因悲怒氣鬱而脹也宜散氣狐疝者狀如瓦臥入小腹行立則出小腹入囊中宜逐氣流經㿗疝者囊腫如升斗不癢不痛受濕也宜去濕疝症有寒有熱然必先受寒濕郁久而化熱初受之邪當以溫經散寒行氣除濕為主切勿早用寒涼且治疝必兼治氣如暴痛及痛甚者荔香散天台烏藥散暖肝煎皆可酌用若火邪聚於陰分必有熱症熱脈而為熱疝作痛宜用大分清飲又濕疝必重墜脹滿宜治濕理氣用五苓四苓等若血結少腹則為血疝痛處必硬而有形大便黑色宜桃仁煎主之更有因色欲而發者陰虛也六味八味加茴香枸杞之屬此外有雖痛而不引睪丸者皆非疝也如腸中走氣作聲而痛盤腸氣也少腹陰囊手按作響痛小便澀者膀胱氣也臍旁一梗升上釣痛失氣則快者小腸氣也小腹下注上奔心腹急痛者腎氣也陰子偏大小者偏墜也陰子硬大不痛者木腎氣也俱因熱鬱於中寒束於外並宜神效湯筆花氏曰疝症痛引睪丸總不離乎陰厥治法宜分氣血氣則遊走不定血則凝聚不散通以橘核丸為主而加減之疝症湯頭荔香散用荔茴好酒調服二錢灰天台烏藥散良薑巴楝青檳茴木香暖肝煎用桂沉香歸杞茴苓烏藥薑大分清飲二苓通車澤山梔枳殼從五苓散本四苓豬赤瀉術加桂成桃仁煎共為末大黃虻蟲朴硝得治血瘕最妙六味地黃湯山山熟地黃丹苓兼澤瀉八味附桂相神效湯用大茴延胡益智木香歸香附黑梔薑蒼朮川烏砂草酒吳萸瘀脹桃紅共乳沒腎氣上衝陳殼該橘核丸用木茴香香附桃楂楝紅良
