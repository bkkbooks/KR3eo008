body:
  text: 卷六金屬勞瘵經云五穀之精液和合而為膏者內滲於骨空補益腦髓而下流於陰股陰陽不和則使液溢而下流於陰髓液皆減而下下過度則虛故腰背痛而脛痠又曰五臟主藏精者也不可傷傷則失守而陰虛心怵惕思慮則傷神神傷則肉脫毛悴有所勞倦則胃氣熱而內熱勞則喘汗內外皆越故氣耗至於心眈欲念君火動於上相火應於下涸澤燎原未有不傷及於腎者可見虛癆之症氣血兼傷古人治此唯有救脾救腎二法蓋土為萬物之母水為萬物之元脾安則金安而水安腎安則木安而火安也然而陰虛則火浮於肺潤肺必礙乎脾陽虛則寒動於脾理脾又礙乎肺惟能察其緩急但以純甘壯水之劑降虛火而復真陰一切寒涼辛燥勿使偏勝則自以漸而愈如實有火甚用甘涼醇靜之品為佳普明子曰虛勞由於吐血吐血由於咳嗽本於風寒故有外感先用止嗽散加荊防蘇梗散後肺虛異功散補脾土以生肺金虛中挾邪團魚丸解之咳嗽虛損漸成乃用紫苑散月華丸清而補之若吐血而脈數內熱口燥者用四生丸吐止後則用生地黃湯六味丸等補之如脈遲口潤體質虛寒四君子湯及理中湯主之吐血成升斗者先用花蕊石散隨用獨參湯貧者以歸脾湯代之若咳嗽吐紅漸成勞瘵察其內熱甚者清骨散陰虛脾弱者逍遙散八珍湯如元氣大虛變症百出者人參養榮湯若水泛為痰謂之白血難治也若久咳時吐白沫此肺痿也保和湯治之吐膿血而胸痛者此肺癰也加味桔梗湯治之如咽痛音啞喉瘡勞病至此陰涸陽浮多屬難起百藥煎及通音煎治之柳華散吹之服六味丸其外如夢遺精滑者秘精丸或十補丸女人經水不調及室女經閉成損者用澤蘭湯益母勝金丹等傳屍勞瘵者驅蟲丸五臟虛損者補天大造丸若痰多而濁及不得左右眠者不治筆花氏曰虛勞之症唯房勞者十居八九他如芸窗苦志家計憂思及力小而舉重肝弱而行遠勞傷氣血間亦有之然房勞則精氣既竭相火又熾更難為治內經論陰虛內熱歸於氣虛後人宗東垣則論補氣宗丹溪則論補血皆有至理然經言損及脾胃者不可治吐瀉是也善治癆者補正而不燥保肺而不寒滋水而不膩斯為良工嘗考景岳之論虛邪之至害必歸陰五臟之傷窮必及腎故虛損之虛在陰在陽其病未深猶可溫補若勞瘵之虛深在陰中之陰分多有不宜溫補者故難治即以其咳嗽論肺為金臟所畏者火所化者燥惟腎水不能制火則剋金陰精不能化氣故病燥燥則必癢癢則必嗽而從此喘促咽痛喉瘡聲啞等症滋起治法惟以甘涼至靜滋養金水如四陰煎一陰煎六味丸貝母丸之類更在病家憂怒胥捐飲食自慎靜心調理庶可迴天徒求速效無益也勞瘵湯頭止嗽散用桔白前百部橘紅紫苑甘異功散最宜四君加陳皮團魚丸剖大團魚納入知貝杏前柴紫菀散用知貝參桔梗阿膠味草苓月華丸沙部天麥熟生山三七阿膠貝苓桑菊獺肝四生丸用生地好側柏荷艾俱生搗生地黃湯麥丹丹漆芍元山梔三七郁荷葉墨童便六味地黃湯山山熟地黃丹苓兼澤瀉八味附桂相四君子湯中和義參朮茯苓甘草比理中湯用參朮姜炙草還加制附剛花蕊石散加硫黃瓦罐曬煉便酒嘗歸脾湯用四君遠耆歸木香棗仁眼清骨散柴秦胡連地骨芩芍丹蒿鱉甲知母草童增逍遙散用柴歸芍苓朮陳甘煨姜薄八珍補陰陽四君四物相人參養營苓朮草耆歸陳地桂心好五味白芍遠志姜再加三枚黑大棗保和湯百合知貝馬兜鈴天麥阿膠味甘荷梗苡仁加味桔梗湯白芨貝苡葶銀陳草節百藥煎治咽痛硼砂甘草為末共通音煎治音啞款冬胡桃蜜貝母柳華散冰黛硼人中白與柏蒲黃秘精丸白朮苓神藥芡實蓮子牡蓮鬚車柏櫻膏抉十補丸參耆歸芍地杜萸術苓山棗遠續味牡龍齊澤蘭湯調經脈柏子茺牛地歸芍益母勝金丹四物香附茺牛丹參術驅蟲丸用雄蕪雷鬼箭丹參獺肝麝補天大造丸耆朮棗遠參地杞歸芍藥河車龜鹿苓四陰煎用生地麥沙參苓草百合芍一陰煎用生熟地丹參冬芍牛甘記貝母丸研末大丸和用蜜咳嗽經云邪在肺則病皮膚痛寒熱上氣喘汗出咳動肩背又云五臟六腑皆令人咳非獨肺也皮毛者肺之合也皮毛先受邪氣邪氣以從其合也五臟各以其時受病非其時各傳以與之肺咳者喘息有音甚則唾血肝咳者兩脅痛不能轉側心咳者喉中如梗狀甚則咽痛喉痹脾咳者右脅痛陰引肩背甚則不可動動則咳劇腎咳者腰背引痛甚則咳涎五臟久咳不已移於六腑其脾移於胃咳而嘔甚則長蟲出肝移於膽咳嘔膽汁肺移於大腸咳而遺失心移於小腸咳而失氣腎移於膀胱咳而遺溺久咳不已三焦受之咳而腹滿不食多涕唾面浮腫氣逆治臟者治其俞治腑者治其合浮腫者治其經河間曰咳則無痰而有聲肺氣傷而不清也嗽則無聲而有痰脾濕動而為痰也因咳而動痰者咳為重主治在肺因痰而致嗽者痰為重主治在脾惟食積成痰痰氣上升致咳只宜治痰消積不必用肺藥丹溪曰咳嗽有風有寒有痰有火有虛有勞有郁有肺脹楊仁齋曰肺出氣也腎納氣也肺為氣之主腎為氣之本凡咳嗽引動百骸自覺氣從臍下奔上此腎虛不能收氣歸原當以地黃丸安腎丸等主之此虛則補子之義也立齋曰咳嗽症春月風寒傷肺頭痛身重金沸草散主之夏月暑火傷肺喘嗽面赤用麥門冬湯甚則竹葉石膏湯秋月濕熱傷肺咳熱自汗口乾便赤白虎湯若氣短痞滿倦怠者香薷飲邪去後補中益氣湯經云秋脈不及則令人喘呼吸少氣而咳上氣見血下聞病音是也冬月風寒外感形氣俱實用麻黃湯之屬虛者參蘇飲金水六君煎若日久或誤服表劑致元虛而邪實者急宜補脾則肺有所養而病自愈景岳曰咳嗽之要一曰外感二曰內傷盡之矣外感由於皮毛陽邪也故治以辛溫而邪自散內傷起於陰分陰病也故養以甘平而氣始復治外感之嗽風寒居多其症鼻塞聲重惟有六安煎加生薑為妙若肺脘燥澀加當歸二錢寒氣太盛則細辛麻黃桂枝俱可加用血氣漸弱者悉宜金水六君煎若外感兼火者必內熱喜冷六安煎內可加黃芩瓜蔞知母山梔石膏之屬治內傷之嗽不宜燥藥惟宜甘潤養陰如百合阿膠地黃麥冬胡桃乳蜜之類凡水虧於下火炎於上消爍肺金肺燥則癢咳不能已甚至乾渴煩熱喉痛口瘡宜四陰煎一陰煎地黃丸之屬更有元陽下虧生氣不布脾肺兩困則喘促痞滿用大補元煎主之若水泛於上血化為痰謂之白血經云咳不止而白血出者死四陰煎地黃丸等酌用之又有勞風症經云勞風法在肺下使人強上冥視唾出若涕惡風振寒此因勞力傷風以外感之法治之自愈其勞之甚者變為乾咳則肺液枯涸為難治若咳嗽聲啞蓋肺體屬金金實則不鳴由風寒濕火之邪也金破亦不鳴由精氣內傷之損也治邪則易治損則難若外邪而誤認為勞傷見其發熱遂認為火率用滋陰降火等劑俾寒邪不散表裡合邪而延綿成勞醫之咎也程鍾齡曰肺體屬金畏火者也過熱則咳金性剛燥惡冷者也過寒亦咳且肺為嬌臟不受攻擊而外主皮毛又易受邪不行表散則邪氣留連而不解矣治初嗽用止嗽散加荊防蘇姜以散邪或兼用人參胡桃湯以潤之最效暑氣傷肺加黃連芩粉濕氣主痰加苓夏桑姜燥氣乾咳加蔞貝知柏治內十二經見症按本經加藥治虛勞之嗽用異功散補土生金虛中挾邪用團魚丸解之虛損漸成乃用紫苑散清而補之筆花氏曰咳嗽一症凡風寒暑濕燥火及氣血虛損皆能為患受之者肺而病又不獨在肺善治者當察其外感內傷之實而速去其致病之由則咳嗽自止而肺體亦寧否則留連不解必至虛損而後已雖然此症有難盡責之醫者藥以發散彼則冒風藥以辛溫彼則生冷藥以滌痰彼則油膩藥以平肺彼則魚蟹之鮮藥以調氣彼則晝夜之悶又將如之何哉余為制一口歌曰要止嗽坐定候要消痰口勿饞咳嗽湯頭地黃丸即六味地黃丸安腎丸用桂術苓川烏蓯蓉巴戟增山藥蒺藜破故紙石斛萆薢共桃仁金沸草散旋覆花荊前半芍草姜麻麥門冬湯天麥地桑菀貝梗甘竹味竹葉石膏湯最涼夏麥參甘粳米將白虎湯治陽明熱知母石膏糯甘得香薷飲內用扁豆厚朴香薷甘草湊補中益氣耆朮陳參草升柴當歸身麻黃湯治太陽寒杏仁甘草桂枝煎參蘇飲用木香葛前夏苓陳甘枳桔金水六君虛實到熟地夏陳歸苓草六安煎用夏甘苓白芥陳皮共杏仁四陰煎用生地麥沙參苓草百合芍一陰煎用生熟地丹參冬芍牛甘記大補元煎參熟山萸杞當歸杜仲甘止嗽散用桔白前百部橘紅紫菀甘人參胡桃湯參桃三片姜異功散最宜四君加陳皮團魚丸剖大團魚納入知貝杏前柴紫菀散用知貝參桔梗阿膠味草苓傷風發熱經云風者百病之始也風從外入令人振寒汗出頭痛身重惡寒治在風府調其陰陽不足則補有餘則瀉又曰賊風邪氣乘虛傷人若用力汗出腠理開逢虛風其中人也微故莫知其情莫見其形又曰傷於風者上先受之身之中於風也不必動臟故邪入於陰經其臟氣實邪氣入而不能客還之於腑故中陽則溜於經中陰則溜於府風氣藏於皮膚之間內不得通外不得泄善行而數變腠理開則灑然寒閉則熱而悶其寒也則衰飲食其熱也則消肌肉故使人怢慄而不能食名曰寒熱又曰上焦不通利則皮膚緻密腠理閉塞玄府不通衛氣不得泄越故外熱景岳曰傷風由於外感邪甚而深者遍傳經絡即為傷寒邪輕而淺者止犯皮毛即為傷風皮毛為肺之合而上通於鼻故在外則鼻塞聲重甚者連少陽陽明之經而或為頭痛為憎寒發熱在內則咳嗽甚者為痰為喘其寒勝而受風者身必無汗而咳嗽以陰邪閉郁皮毛也其熱勝而受風者身必多汗惡風而咳嗽以陽邪開泄肌腠也氣強者勿藥可愈弱者邪不易解必宜辛散衰老者病更難痊凡風邪傷人必在肩後頸根風門肺俞之間由此達肺最近最捷按而痠處即其逕也晝坐夜臥常令微暖或以衣帛密護之此慎養之道治法凡傷風咳嗽多痰或喘嘔者六安煎加減為最妙兼發熱者柴陳煎寒熱痰多胸膈不快者參蘇飲頭痛鼻塞聲重者用神朮散若風寒外閉肢節疼痛內有伏火者局方羌活散若時行風邪陰寒氣甚者小青龍湯衰弱陰虛者金水六君煎入太陽經見症者桂枝湯或加味香蘇散亦可筆花氏曰傷風一症即傷寒中風之類也特感之輕者耳然留連不去久嗽久熱傷其肺臟加以起居不慎即為虛癆之根非細故也其症有寒熱二種熱傷風者肺蘊燥熱其痰必厚大忌薑夏之燥宜辛涼以潤之如荊防薄荷杏貝花粉麥冬竹茹之屬熱甚者加黃芩虛者沙參阿膠玉竹寒傷風者其痰必薄宜辛溫以散之如二陳香蘇神術六安之屬頭痛必加羌活寒甚兼用桂枝此大法也更有勞風症唾出若涕清黃如膿惡風振寒此風鬱傷肺成癆難治也此外成瘧成痹等各在專門不贅傷風發熱湯頭六安煎用夏甘苓白芥陳皮共杏仁柴陳煎治傷寒嗽姜甘苓夏消痰奏參蘇飲用木香葛前夏苓陳甘枳桔神朮散用蒼朮防風甘草加蔥白局方羌活散麻防細蔓菁前胡芎枳菊苓草石膏芩小青龍湯桂麻黃辛夏味芍草乾姜金水六君虛實到熟地夏陳歸苓草桂枝湯見卷一諸郁湯頭加味香蘇散見卷一諸瘧湯頭二陳湯見諸郁湯頭喘促經曰諸氣膹郁皆屬於肺諸病喘滿皆屬於熱又曰犯賊風虛邪者陽受之則入六腑身熱不時臥上為喘寒氣客則脈不通氣因之喘又曰勞則喘息汗出有所驚恐喘出於肺度水跌僕喘出於腎又曰手太陰動則肺脹滿膨膨而喘咳足少陰動則飢不欲食咳唾有血喝喝而喘少陰所謂嘔咳上氣喘者陰氣在下陽氣在上諸陽氣浮無所依從也腎病者腹大脛腫喘咳身重不得臥臥而喘者水氣之客也脈要論曰肝脈若搏因血在脅下令人喘逆氣喘亦惟二症一曰實喘一曰虛喘不可混也實喘者氣長而有餘胸脹氣粗邪氣實也其責在肺虛喘者氣短而不續慌張聲低元氣虛也其責在腎實喘則風寒火邪痰水肝氣壅滯上焦隨症治之虛喘則脾肺氣虛土不生金猶可調治若肝腎氣虛則陽孤陰竭去死不遠矣速以貞元飲救之程鍾齡曰定喘之法苟非外感之邪當於腎經責其真水真火之不足如脾氣大虛以參術為主參術補土生金金旺則能生水乃隔二隔三之治也更有哮症此表寒束其內熱加味甘桔湯主之景岳治風寒及痰盛作喘用六安煎加細辛蘇葉冬加麻黃治寒包火喘黃芩半夏湯治氣實喘蘿蔔子湯蘇子降氣湯治老弱人虛喘用人參當歸薑桂耆術之屬陽勝者加阿膠五味牛乳治哮喘未發時扶正既發時攻邪發久則消散中加以溫補筆花氏曰喘危症也風火寒邪壅閉竅絡氣能上而不能下已成天地不交之否其變症不可勝言若水腫痰逆而喘此屬有形之物寇凌宮禁則驅逐安可遲疑乎至於陰虧陽竭氣浮於上譬諸樹根不固不待風而自偃矣速宜培灌庶可扶持外有哮喘之症逢時而發人盡知為寒痰固結假令終身不食油膩生冷而長服六君子湯加薑桂則新痰無自而生舊痰日漸以去又何物足以為患哉喘促湯頭貞元飲用地歸甘喘急參姜隨症添加味甘桔湯苓部旋覆白前橘貝母六安煎用夏甘苓白芥陳皮共杏仁黃芩半夏湯蘇甘枳桔杏麻黃蘿蔔子湯用一合研碎水煎治喘實蘇子降氣湯半前陳樸歸甘薑桂煎六君子湯治虛痰四君又加陳半添呃逆經云胃為氣逆為噦又曰寒氣與穀氣相攻氣並相逆復出於胃故為噦又曰諸逆衝上皆屬於火病深者其聲噦又云噦以草刺鼻嚏而已無息而疾迎引之立已大驚之亦可已呃逆一症內經本名為噦令人以其呃呃連聲故名為呃呃症因胃火最多或胸膈有滯大便不行火不能降而上衝宜降其火安胃飲主之若寒滯於胃及痰飲氣鬱者扁鵲丁香散主之兼火者橘皮竹茹湯食滯則二陳加白芥烏藥木香之屬凡大病之後見呃者最危之候大補元煎或有可救若傷寒症發呃胃中虛冷居多也張子和用吐法治胸滿痰實之症以伸上焦之鬱氣亦頗效或用生薑搗汁一合加蜜一匙溫熱服尤佳筆花氏曰呃逆一症吳俗稱為冷呃余謂此症寒少而熱多蓋寒屬陰而主靜火屬陽而主動寒鬱於中不過吞酸作瀉而已惟寒遏其氣則氣以屈而求伸譬之地氣上騰而凍欲解氣為之非冰為之也若火之性本炎上一有所郁則迫切升浮而作呃譬之雷出地奮而蟄咸動非蟲為之實雷火為之也故火有呃氣有呃而寒無呃其偶而氣不調暢者原不必治若大病中見呃則寒熱異如冰炭不可執以為冷呃也余聞吳醫八人治一獨子時疫發斑喉爛議用蘆根丁藿問其故答曰有冷呃余不禁大笑此症疫毒遏郁宜大劑升葛石膏犀角桔梗以解肌而透邪則呃自止見丁香則胃爛矣或曰此吳俗也如公言彼亦不服籲尚何言哉呃逆湯頭安胃飲用楂麥陳石斛木通澤瀉苓丁香散共柿蒂炙草良薑為末劑橘皮竹茹湯茯苓半夏相二陳湯半陳甘草與茯苓大補元煎參熟山萸杞當歸杜仲甘聲瘖經云陽盛已衰故為瘖內奪而厥則為瘖俳此腎虛也少陰不至者厥也又曰手少陰循經入於心中系舌本實則支膈虛則不能言足陽明下絡喉嗌其病氣逆則喉痹瘁瘖又云五邪所亂搏陰則為瘖寒氣客於厭則厭不能發其開闔不致故無音心脈澀甚則為瘖五臟不利則七竅不通又云痱之為病也身無痛者四肢不收智亂不甚其言微知可治甚則不能言不可治也瘖之一症五臟皆能致之蓋聲音出於臟氣臟實則弘臟虛則怯也然舌為心之苗心病則舌不能轉此心為聲音之主也聲由氣而發肺病則氣奪此肺為聲音之戶也腎藏精精化氣陰虛則無氣此腎為聲音之根也故瘖之標在心肺瘖之本則尤在腎治標之法由於竅閉有風寒之閉外感症也宜散之參蘇飲二陳湯之屬有火邪之閉熱乘肺也宜清之四陰煎竹葉石膏湯之屬有風逆之閉肝氣塞也宜順之七氣湯化肝煎之屬有痰逆之閉宜開之宜分虛實潤燥隨症酌治治本之法由於內奪如色欲所傷則傷在腎宜滋水養金用六味右歸人參平肺湯大補元煎之屬或兼肺火則一陰煎及四陰煎等參用大驚大恐猝然致瘖則傷在肝膽宜養血安神七福飲平補鎮心丹之屬若飢餒疲勞則損中氣憂思抑鬱則損心脾並宜歸脾湯七福飲補中益氣湯之屬若病人久嗽聲啞必由元氣大傷肺腎將敗但宜補肺氣滋腎水養金潤燥其聲自出或略加百藥煎之類若虛勞咽痛音啞乃陰涸陽亢之危症多屬難起筆花氏曰外感初起音啞而瘖此風寒客於會厭宜散風利肺有寒則用杏仁半夏白芥薑汁有火則用菖蒲竹茹蔞皮俱用桔梗以開之若無故而瘖脈不浮數此內損之病其精氣潛削暗宜大滋肺腎或可延年勿以治外感之藥沾唇也聲瘖湯頭參蘇飲用木香葛前夏苓陳甘枳桔二陳湯半陳甘草與茯苓四陰煎用生地麥沙參苓草百合芍竹葉石膏湯最涼夏麥參甘粳米將七氣湯治氣結苓蘇夏樸姜煎啜化肝煎用青陳芍丹梔澤貝加白芥六味地黃湯山山熟地黃丹苓兼澤瀉八味附桂相右歸熟地萸杞好附桂杜仲山藥草氣虛參朮乾薑找人參平肺湯八珍菟杜味破戟葫巴膝陳半菖蒲智大補元煎參熟山萸杞當歸杜仲甘一陰煎用生熟地丹參冬芍牛甘記七福飲用棗仁歸遠志參甘地術為平補鎮心丹見諸郁湯頭百藥煎見本卷勞瘵湯頭歸脾湯用四君遠耆歸術香棗仁眼補中益氣耆朮陳參草升柴當歸身吐血經云肝藏血起居不節用力過度則絡脈傷陽絡傷則血外溢而吐衄陰絡傷則血內溢而後血血之與氣並走於上則為大厥暴死氣復反則生不反則死又曰肝脈若搏因血在脅下令人喘逆怒則氣逆甚則嘔血又曰血泄者脈急血無所行也不遠熱則熱至血溢血泄之病生矣咳不止而白血出者死吐血之症嘔咯而出者由於咽必出於胃咳而出者由於喉必出於肺其血動之由惟火與氣耳要當察其虛實然咯而出者其來近不過在經絡之間故無發熱骨蒸氣喘等症咳而出者其來遠必內傷而出於臟故難治凡火盛迫血妄行必有火症火脈清其火而血自安宜芩連知柏犀角生地玄參花粉梔子芍藥之屬而童便為尤宜陽明火盛者加石膏三焦熱極便秘者加大黃若熱壅於上而火不能降加木通澤瀉山梔等以導之若怒動肝火載血上行則氣亂血逆肝火盛必多煩熱用生地芍藥丹皮山梔芩連以降之肝氣逆必胸膈痛滿宜化肝煎等加生地芍藥瓜蔞以平之若暑毒通心刑肺亦能嘔血生脈散人參白虎湯犀角地黃湯等酌用若傷於酒者清化飲或葛花解酲湯其有陰虛火甚吐血咯血而兼煩渴咽痛喜冷便實脈滑溺赤者此症水不濟火大忌辛溫宜清涼滋陰之法二陰煎四陰煎天門冬丸之類若非火症氣逆脈靜神安而血有妄行此其真陰內損絡脈受傷不宜寒涼以伐生氣不宜辛燥以動陽氣但宜純甘至靜之品培養真陰如六味五福大補元煎等為宜有憂思損傷心脾而吐血者胸懷鬱抑食損形憔以五福飲及歸脾湯等速救其本丹溪曰凡吐血須用四君子等以收功若所吐之血色黑而黯必停積失位之血由脾腎氣虛不能攝血而然非火逼也大忌涼血氣虛宜理中湯陰虛宜理陰煎若紫黑成塊或痛或悶結聚不散者此留滯之瘀血也惟宜行散必吐出方好四物加香附肉桂蘇木紅花或韭汁更妙其暴吐暴衄如湧面白肢冷危在傾刻速即濃煎獨參湯救其元氣所謂血脫益氣也著色欲勞傷過度真陽失守無根之火浮泛而為格陽失血之症面紅喘促肢冷脈微速用鎮陰煎引火歸原尚有生望石頑曰氣有餘便是火血隨氣上補水即血自降順氣則血不逆阿膠牛膝丹皮補水之品也蘇子橘紅沉香順氣之品也童便引血有行瘀之能藕汁達血無止澀之弊繆仲淳曰吐血有三訣宜行血不宜止血宜補肝不宜伐肝宜降氣不宜降火然亦有嘔血唾血咳血咯血之不同嘔血者從腹脅而上乃肝旺鼓激胃血上湧也宜治肝唾血者唾中有血如絲或浮散者由思慮傷脾不能統血也宜歸脾咳血者或嗽或乾咳痰中見紅絲血點氣急喘促此肺燥而為火迫也宜潤肺咯血者不嗽而咯出小塊血點其症最重此房勞傷腎陰火載血上行或兼水泛為痰宜滋其陰凡潮湧不止者勿與湯藥急用熱童便及藕汁灌之筆花氏曰暴吐血祛瘀而降火宜四生丸十灰散久吐血養陰而理脾宜六味丸四君子然血症有外感內傷之不同風寒者香蘇散傷暑者益元散秋燥者三黃解毒湯此外感治也陰虛者初用四生十灰合生地黃湯繼用六味丸陽虛大吐成升斗者初用花蕊石散隨用獨參湯八珍湯若臟寒而吐猶水凝冰凍理中湯肝火及情郁逍遙散傷力者澤蘭湯此內傷治也吐血湯頭化肝煎用青陳芍丹梔澤貝添白芥生脈散治熱傷氣人參麥冬北五味白虎湯治陽明熱知母石膏糯甘得犀角地黃湯赤芍丹皮麥冬良清化飲用冬芍丹苓芩生地石斛煎葛花解酲湯葛花砂蔻香青陳參苓朮神麯瀉豬姜二陰煎用生地冬玄參苓棗草連通四陰煎用生地麥沙參苓草百合芍天門冬丸用杏仁阿膠貝母甘茯苓六味地黃湯山山熟地黃丹苓兼澤瀉八味附桂相五福飲用參熟地當歸白朮炙草記大補元煎參熟山萸杞當歸杜仲甘歸脾湯用四君遠耆歸木香棗仁眼四君子湯中和義參朮茯苓甘草比理中湯用參朮姜炙草還加制附剛理陰煎用炙草歸熟地乾薑附肉桂四物湯治血芎歸熟地芍鎮陰煎熟地膝附桂澤瀉炙草的四生丸用生地好側柏荷艾俱生搗十灰散用大小薊茅根茜根荷葉蒂蒲黃大黃梔絲瓜亂髮共灰藕湯劑香蘇散用蘇葉香附甘陳薑棗啜益元散用朱甘滑除卻硃砂名六一三黃解毒用黃連芩柏山梔一併煎生地黃湯麥丹丹膝芍玄山梔三七郁荷葉墨童便花蕊石散加硫黃瓦罐曬煉便酒嘗八珍補陰陽四君四物相逍遙散用柴歸芍苓澤陳甘煨姜薄澤蘭湯調經脈柏子茺牛地歸芍肺痿肺痿一症多因勞傷氣血腠理虛而風邪乘之內感於肺風熱相搏蘊結肺經久嗽不已汗出過度重亡津液而成內經云血熱則肉敗營衛不行必將為膿其症便如爛瓜下如豕膏小便數而不渴時吐白沫如米粥者其脈寸口數而虛此火盛金傷肺熱而金化也多不可救保和湯主之若虛癆症患此者更不治其咳引胸中微痛及吐有膿血脈數而實者肺癰也加味桔梗湯主之實則為癰虛則為痿然嘔膿不止者亦不可治此二症初起邪結在肺者惟桔梗杏仁煎為第一方屢效若延至金化膿成則難治矣古方用白芨加入甚效肺痿失音人參蛤蚧散若盜汗發熱痰血食少者劫勞散筆花氏曰肺癰屬有形之血宜驟攻肺痿屬無形之氣宜緩治大法生胃津潤肺燥開積痰止濁唾補真氣以通肺之小管散火熱以復肺之清肅痿本虛燥總不離壯水清金滋補津液消痰止嗽之法古方用人參平肺湯紫苑散知母茯苓湯若火鬱痰滯稍加蜜制生薑以散之凡生地熟地天冬麥冬知母人參玉竹紫苑皆要藥也如痞結去天冬生地加橘紅蘇子泄瀉去天冬生地知母加山藥茯苓丹方治肺痿每日用人參細末一錢入豬肺管內砂鍋中煮爛加蔥酒服神效涎唾多者外臺用炙甘草湯肺痿湯頭保和湯百合知貝馬兜鈴天麥阿膠味甘荷梗苡仁加味桔梗湯白芨貝苡葶銀陳草節桔梗杏仁煎阿膠麥合甘銀枯翹貝枳花粉紅藤煎人參蛤蚧散知貝桑白參苓杏草配劫勞散用歸芍地參耆阿膠半甘味人參平肺湯八珍菟杜味破戟葫巴膝陳半菖蒲知紫菀散用知貝參桔梗阿膠味草苓知母茯苓湯參甘術味姜柴芩款芎麥夏薄桔膠相炙甘草湯用桂枝四錢甘草棗姜施麥冬生地人參共麻仁阿膠肺痿宜汗經云陽之汗以天地之雨名之飲食飽甚汗出於胃驚而奪精汗出於心持重遠行汗出於腎疾走恐懼汗出於肝搖體勞倦汗出於脾又曰內不堅腠理疏則善病風厥漉汗津脫者腠理開汗大泄肺病者肩背痛汗出腎病者寢汗出憎風陽氣有餘為身熱無汗陰氣有餘為多汗身寒陽氣少陰氣盛兩氣相感故汗出而濡汗出一症有自汗者有盜汗者自汗則濈濈然無時而動作益甚盜汗則寐中通身汗出覺來漸收古人謂自汗陽虛盜汗陰虛然自汗亦有陰虛盜汗亦有陽虛者治法自汗症陽虛者四君子湯玉屏風散陰陽俱虛者人參養營湯挾寒者參附湯六味回陽飲或加龍骨牡蠣五味之屬盜汗症陽虛者參苓散玉屏風散人參建中湯陰陽俱虛者大補元煎人參養榮湯挾寒者回陽飲其有自汗盜汗察其脈症有火者或夜熱煩渴喜冷皆陽盛陰虛也宜當歸六黃湯一陰煎之類火甚者黃芩芍藥湯清化飲硃砂安神丸生脈散之屬凡病後若傷寒若瘧疾汗出熱退而汗不止者此表邪初解腠理開泄數日後衛氣漸實汗必自止不足慮也若大驚大恐及大吐大瀉失血產後而汗出不止此其氣血大虧仲景所謂極寒反汗出身必冷如冰非薑桂附子速救元氣必至厥脫至自汗症有因風傷衛者有傷寒熱邪傳裡者有中暑者俱詳本門不贅筆花氏曰汗者心之液也凡勞而汗食而汗驚而汗暑而汗皆熱氣之迫於心者也惟感邪之汗出於腠理則肺主之然太多猶恐其亡陽矧其為自汗盜汗無因而致耶良由心腎不足陰陽偏勝故其人每多體倦氣喘發熱惡寒之象當各隨其陰陽之虛而峻補之若麻黃根浮麥烏梅五味黑豆龍骨牡蠣之屬皆宜擇用如汗多不能收者速用五倍子為末以津唾調填臍中將帛縛定即止或以首烏末填臍亦效汗症湯頭四君子湯中和義參朮茯苓甘草比玉屏風散治虛汗黃耆防風薑朮驗人參養營苓朮草耆歸陳地桂心好五味白芍遠志姜再加三枚黑大棗參附湯用姜水煎人參制附二味專六味回陽參附歸熟地乾薑甘草炙參苓散治盜汗參苓棗仁為末咽人參建中芍桂枝甘草飴糖薑棗施大補元煎參熟山萸杞當歸杜仲甘當歸六黃湯生熟耆連芩柏相一陰煎用生熟地丹參冬芍牛甘記黃芩芍藥湯甘草一錢襄清化飲用冬芍丹芩苓生地石斛煎硃砂安神能治心生地歸甘黃連真生脈散治熱傷氣人參麥冬北五味咽喉經云咽喉者水穀之道也喉嚨者氣之所以上下也會厭者音聲之戶也懸雍者音聲之關也一陰一陽結謂之喉痹足少陰所生病口熱舌乾咽腫上氣嗌乾及痛足陽明病氣逆則喉痹瘁瘖手陽明少陽厥逆發喉痹嗌腫督脈為病嗌乾衝任脈皆起於胞中會於咽喉又少陽司天客勝則丹疹外發喉痹頭痛嗌腫景岳曰喉痹有實火症有虛火症有真寒症少陽厥陰為木火之臟凡情志鬱怒而起者固多熱症陽明為水穀之海肥甘辛熱而起者胃氣直透咽喉故火最盛凡患此者多以實火治若少陰之症則有虛有實凡陰火逆衝於上多為喉痹果見火症火脈自宜作實治若酒色過度真陰虧損此腎中之虛火非壯水不可更有火虛於下格陽於上此無根之火即腎中之真寒症也非溫補命門不可經云寒淫所勝民病嗌痛頷腫其義即此經云驟起非火緩起非寒大約喉症挾熱者十之六七挾寒者十之二三而風寒包火者則十之八九古人開手一方只用甘草桔梗三因方加以荊芥其他蒡子薄荷貝母川連之類皆出後人續補可見古人不輕用涼藥而專主開發升散者所謂結者開之火鬱達之也及火勢極盛則清劑方施熱結下焦而攻法始用非得已也喉痹由心火用甘梗湯由少陰伏寒半夏桂甘湯由火衰四逆湯若驟起而痰在喉響如鼾舌白不腫此因誤投涼藥桂薑湯可救纏喉風腫痛脹塞紅絲纏繞吐涎難食先用黃齏汁調元明粉攪去其痰不效用土牛膝連根搗汁和醋灌之或用解毒雄黃丸醋磨下之內服加味甘桔湯虛寒者桂薑湯走馬喉風暴腫轉大用小刀點血淡鹽湯洗之吹以冰片散服加味甘桔湯牙關緊閉服紫金丹纏舌喉風硬舌根而爛兩傍吹以冰片散急服加味甘桔湯喉疔形如靴釘先吹冰片散服加味甘桔湯多用菊花煎飲之懸癰生於上齶形如紫李脾經蘊熱也吹服如前法喉瘡腎火上衝也用齏汁去痰吹服如前法喉瘤生喉旁形如圓眼肺經蘊熱也不可刺吹麝香散服加味甘桔湯肺絕喉痹者因過投清降痰壅如鋸為難治獨參湯少加橘紅扶之喉閉二三日前氣促肢冷忽然痰壅氣閉命懸頃刻者宜服蘇子前胡等乳蛾如筋頭生於關上者輕生於關下者重左右偏生曰單左右皆有曰雙單者輕雙者重以土牛膝絞汁含以慢嚥喉癬喉中不閉不腫氣出如常微微疼癢此虛火淹纏難愈宜冰梅丸含之喉珠腦門生一紅線懸一黑泡如櫻珠掛在咽門刀點即死宜土牛膝活根汁少醋和勻滴鼻中三四次絲斷珠破吐瘀神效筆花氏曰喉痹多因痰火所致急者速宜吐痰以救脹塞如有餘火再復下之其甚者尤宜先以針刺血及刺少商穴法然後用藥此症瞬息間關人性命遲疑不得經云火鬱發之吐中有發散之義出血亦發散之端也至伏氣之病凡火令寒令濕令而感風寒之邪者但治外邪而喉自愈若天行時疫咽痛項腫有大頭蝦蟆發頤之名此陽明熱毒腫髮夾車兩穴普濟消毒飲治之痰甚脹急者紫雪丹開之然陰虛陽虛俱有此等惡症其應溫清補瀉全在脈之有力無力唇之赤白口之渴否辨之庶不致誤喉咽湯頭甘桔湯甘草和桔梗半夏桂甘湯桂枝半夏甘草姜四逆湯見卷一諸郁湯頭桂薑湯五分桂甘與炮姜解毒雄黃丸鬱金巴豆醋和丸加味甘桔湯見喘促湯頭冰片散雄黃元明銅靛硼雞肫人白柏連草與蒲黃紫金丹用五倍朱千金麝戟雄山茨麝香散麝香黃連共冰片冰梅丸硼膽礬牛雄兒茶山豆傳白梅二個搗冰片普濟消毒湯見時疫湯頭紫雪丹用黃金寒水石膏磁滑成煮好復投犀羚草升丁沉木又玄參遲入芒硝焰硝攪功成朱麝又和勻
