body:
  text: 跋憶自甲申歲先生自粵致仕回藉因慮家居應酬紛繁遂卜宅於吳門之泮環里栽花種竹鑿池養魚朝夕吟詠於其間頗得林泉之樂昔年在粵時與家君為至好畿因得從遊於先生之門始習舉業極承提命第以畿賦性愚魯雖應試十餘次而不獲一襟有負先生之望深以為愧後以岐術見示畿欣然從之復蒙反覆講論臨症數年恨未得先生奧旨而訓言具在亦可有所適從所著醫鏡臨症簡要少懷集最後著奉時旨要而先生已老矣初先生之來吳也兩袖清風家居日用悉賴行醫每歲夏間往嘉禾視症三四月可得千金足供一年之用蓋先生之道盛行於浙當未遇時已有然也先生性端耿介懶於世故而樂於著述所作詩文甚富隨手散失僅存醫書四種唯醫鏡一書已刻粵東其餘尚未刊行畿久欲為先生壽世利濟蒼生而限於力之所不能故有待於異日此書雖集前賢之大成而獨出已見以貫穿之甚有便於來學蓋專為門弟子設法也然而先生之苦心當必傳之後世豈可一己私之乎因欲公之同好而以明授受之始終如此受業韓之畿百拜敬識
