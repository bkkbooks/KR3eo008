body:
  text: 卷四火屬溫病附冬溫溫瘧經云冬傷於寒春必病溫又曰凡傷於寒而成溫者先夏至日為病溫後夏至日為病熱凡伏氣之病雖感於冬將發時或又外感必先頭痛惡寒而後熱壯總之無外感者宜以黃芩湯為主兼外感者必加柴胡及本經藥斷無發汗之理仲景曰太陽病發熱而渴不惡寒者為溫病若發汗已身灼熱者名曰風溫風溫為病脈陰陽俱浮自汗出身重多睡眠鼻息必鼾語言難出太陽與少陽合病自下利者黃芩湯嘔者加半夏生薑若三陽合病脈浮大上關上但欲眠睡目合則汗小柴胡去參薑半夏加芍藥主之少陰病二三日咽痛可與甘草湯不愈桔梗湯少陰病得之二三日已上心煩不得臥黃連阿膠湯周禹載云春溫少陽陽明合病里病多者承氣湯三陽合病大柴胡湯少陽症兩額傍痛寒熱口苦宜小柴胡去參薑半夏加栝蔞根感邪頭痛如破者葛根蔥白湯邪散仍用黃芩湯脈洪數譫語熱在三焦也三黃石膏湯下後復熱再下之若腹滿煩渴脈沉實者三承氣湯合黃連解毒湯選用風溫誤汗者勉用麻黃升麻湯去二麻薑術附冬溫冬令非時而暖即為不正之氣不藏精者受之即發名曰冬溫脈寸洪尺數煩嘔身熱不惡寒或頭疼身重咳嗽陽旦湯加桔梗茯苓若有食滯加厚朴黃芩若誤認傷寒而發汗致發癍毒者升麻葛根湯加犀角玄參躁悶者三黃石膏湯附溫瘧春溫未愈復感作寒熱曰溫瘧其症寒熱交作胸脅滿煩渴而嘔微惡寒小柴胡去參夏加栝蔞根石膏若無寒但熱其脈平骨節煩疼時嘔者黃芩加生薑湯筆花氏曰春溫伏氣之病也寒邪內伏既久已化為火至春而發為溫病至夏而發為熱病故初發時不惡寒者表無邪也即口渴者里有熱也非若傷寒初作邪尚在表惡寒不渴可以表藥發汗也溫症誤發其汗則內火愈熾燔灼津枯多至不救仲景謂一逆尚引日再逆促命期是也仲景用黃芩湯為主心悟用柴葛解肌湯其間生地貝母葛根以生津液黃芩知母以清裡熱赤芍丹皮瀉血中伏火柴胡葛根通內外之路真良法也治溫瘧亦同此意溫病湯頭黃芩湯重黃芩芍藥甘草大棗平甘草湯治咽痛二兩甘草已足供桔梗湯甘草共桔梗黃連阿膠湯黃芩芍藥雞子黃大柴胡湯治太陰大黃芍藥甘草芩葛根蔥白湯芍藥知母川芎姜三黃石膏湯芩連與麻黃石膏梔子柏蔥白香豉姜黃連解毒湯黃連芩柏山梔一併煎麻黃升麻湯桂枝石膏苓天冬歸芍草玉竹母黃芩此方去二麻方可治春溫陽旦湯桂枝芍甘草黃芩薑棗葉升麻葛根湯升葛赤芍荊秦蘇甘白芷加減視寒溫黃芩加生薑湯黃芩芍藥棗甘良小柴胡湯赤芍芩棗姜甘草夏人參柴葛解肌湯芩丹知貝生地赤芍甘承氣湯用芒硝枳實大黃厚朴饒小承氣去芒硝調胃承氣去枳樸時疫經云五疫之至皆相染易正氣存內邪不可干避其毒氣古法謂瘟疫在三陽者多三陰者少吳又可曰疫癘之邪由口鼻而入舍於伏脊之內去表不遠附胃亦近內經所謂橫連膜原也其熱淫之氣浮越於某經即顯某經之症如在太陽則頭項痛腰脊強在陽明則目痛眉稜骨痛鼻乾在少陽則脅痛耳聾寒熱嘔而口苦是也其感之深者中而即發感之淺者或遇飢飽勞役有觸而發其始也格陽於內故先凜凜惡寒甚則四肢厥逆至陽氣漸通則中外皆熱矣此際邪伏膜原縱使有汗熱不得解必俟伏邪漸退表氣潛行於內乃作大戰大汗淋漓脈靜身涼而愈矣若伏邪未盡必復發熱方顯變症或從外解或從內陷外解易治內陷難治溫疫初起先憎寒而後發熱日後但熱而不憎寒初得之二三日頭疼身痛其脈不浮不沉而數日晡益熱宜達原飲感之輕者必從汗解重者舌苔如積粉服達原飲後反從內陷舌變黃色膈滿渴躁此邪毒入胃也前方加大黃下之若熱渴稍減午後復加熱躁而舌變黑刺鼻如煙煤者此邪毒復瘀到胃急投大承氣湯而熱漸退此傳變既速用藥不得不緊緩則不及矣疫症舌上白苔者邪在膜原也若舌根黃至中央乃邪漸入胃設有三陽現症或兼里症用達原三消飲隨症加減若熱邪散漫脈洪數身熱大渴大汗白虎湯主之里症下後脈浮而神思不清者白虎湯浮而空者加人參下後不得汗脈復沉數者復瘀到胃也宜更下之大凡溫疫但見舌黃心腹痞滿便於達原飲加大黃下之蓋邪在膜原已有行動之機得大黃促之而下即使未愈邪亦不能久羈二三日後餘邪入胃仍用小承氣徹其餘毒普明子曰疫邪來路兩條凡天行之邪從經絡而入其症頭痛發熱宜微散以香蘇散普濟消毒飲等散之若病氣傳染從口鼻而入其病嘔惡胸滿宜解穢以神朮散或藿香正氣散等和之若兩路之邪歸併於裡腹脹滿悶譫語發狂唇焦口渴治疫清涼飲清之便閉者加大黃下之其內人中黃一味乃退熱解穢之靈丹也氣虛者更以補法駕馭其間自無不效筆花氏曰吳又可治疫之達原飲專主透邪而力太猛峻實者宜之虛者不免過耗元氣矣他如景岳嘉言之治各有所偏恐其留邪未盡亦防養癰成患唯普明子之論最為精當所分來路兩條及分治合治之方更及補法無餘蘊矣時疫湯頭達原飲用檳草果芩芍厚朴甘知母大承氣湯用芒硝枳實大黃厚朴饒達原三消飲檳果樸大黃柴葛甘知母黃芩白芍姜白虎湯治陽明熱知母石膏糯甘得小承氣湯即大承氣湯除芒硝香蘇散用蘇葉香附甘陳薑棗啜普濟消毒治大頭芩連大力橘紅求翹結玄參紫馬勃升麻甘草薄荷稠神朮散用平胃全藿香砂仁一同研藿香正氣芷腹苓半樸蒼蘇枳草陳治疫清涼飲丹參知貝翹中黃紫赤芍荷葉與秦艽濕溫經云諸濕腫滿皆屬於脾土濕受邪脾病生焉又曰地之濕氣感則害人皮肉筋脈又曰其多汗而濡者此逢濕甚也活人書曰先傷於濕後中於暑名曰濕溫其症兩脛逆冷胸滿頭目痛妄言多汗蓋濕得暑邪遏抑陽氣故脛冷而腹滿暑挾濕邪鬱蒸為熱故頭痛妄言多汗其脈陽濡而弱陰小而急浮為陽沉為陰羅謙甫云濡弱見於陽部濕搏暑也小急見於陰部暑搏濕也濕傷血分則必小急暑傷氣分則必濡弱切不可發汗汗之名重暍死治宜蒼朮白虎湯如有寒熱外邪加辛涼表藥一二味若濕氣勝一身盡痛小便不利大便反快者前方加茵陳香薷若有寒物停滯及中寒宜溫必小便清白然後可用如赤澀而少斷不可用通宜十味香薷飲等酌用凡陰病厥冷兩臂皆冷獨濕溫則脛冷臂不冷則非下厥上行陽微寒厥也宜五苓合白虎等若濕溫之邪阻塞肺衛致頭脹耳聾咽痛嘔逆等症宜清上焦用連翹桔梗湯有穢氣者加鬱金降香以逐之其有陷入心胞神昏肢冷將傳痙厥用犀角翹心玄參菖蒲等煎服送下至寶丹若穢濕之氣瀰漫三焦致脘腹脹悶大便不爽藿香正氣散治之若邪入經絡寒戰熱熾骨節煩疼者用防己山梔苡杏湯甚則加桂枝川烏蒺藜筆花氏曰濕溫由暑濕相搏大忌發汗在上焦則邪蒙心肺胸滿神昏宜用輕靈芳香之味以宣通之在中焦則濁填脾胃脹滿多汗宜白虎湯加蒼朮合正氣散酌用重則俱用至寶丹以開之若連及下焦身痛肢重小水不利兼用清利入經絡者兼通其絡寒邪外束者兼用辛涼此症所重在濕濕行則氣自流通而熱亦解勿混作風溫治也濕溫湯頭蒼朮白虎湯蒼朮知母石膏糯甘得十味香薷參耆朮木瓜苓陳扁甘樸五苓散本四苓豬赤瀉術加桂成連翹桔梗滑牛蒡射干銀豉竹蘆杏至寶丹用牛黃犀角硃砂安息香玳瑁琥珀金銀箔龍腦雄黃共麝香藿香正氣芷腹苓半樸蒼蘇桔草陳防己山梔苡杏湯翹芩滑夏樸通姜暑經云因於暑汗煩則喘滿靜則多言體若燔炭汗出而散又曰陽氣者衛外而為固也炅則氣泄又云氣虛身熱得之傷暑仲景云太陽中暍發熱惡寒身重而疼痛其脈弦細芤遲小便已洒洒然毛聳手足逆冷小有勞身即熱口開前板齒燥若發其汗則惡寒甚加溫針則熱甚數下之則淋甚汗出惡寒身熱而渴白虎加人參湯主之身熱疼重而脈微弱此夏熱傷冷水水行皮中所致一物瓜蒂散主之暑有八症脈虛自汗身熱背寒面垢煩渴手足微冷體重是也劉復真曰暑脈隱弦細芤遲盡有三四部無脈者被火所逼勒而伏耳用辛寒之藥火散則脈起矣張鳳逵曰冒暑蒸毒從口鼻而入直中心胞先煩悶後身熱入肝則眩暈頑麻入脾則昏睡不覺入肺則喘咳痿躄入腎則消渴中暑歸心神昏猝倒傷肉分身如針刺或赤腫入腸胃腹痛惡心嘔瀉久而藏伏三焦腸胃之間變出寒熱不定霍亂臌脹瘧痢下血等症皆以清內火而兼解表平人偶然中暑汗渴煩悶或吐瀉轉筋背寒指冷者四苓散合益元散若氣血虛者受之頭重困倦飽悶喘促如在煙霧宜清暑益氣及清燥湯酌用若伏暑霍亂腹痛正氣散身熱足冷勢危者五苓散下來復丹陽暑者動而受暑如農夫田野及力役之人大渴大汗額痛脈洪者急作地漿水煎蒼朮入白虎湯若遠行勞役熱舍於腎熱渴喘促者為水不勝火補益中兼清解之平昔陰虛多火白虎加人參竹葉凡暑中太陽汗大出微惡寒發熱四苓散加香薷中陽明面赤煩渴喘急甚則脈洪大昏瞶不省人事宜用消暑丸陰暑者避暑深堂起居不時汗出煩垢腠理開則洒洒然寒閉則熱悶此表虛挾暑也清暑益氣湯酌用若涼亭水閣大樹濃陰之下過受寒涼頭疼寒熱或無汗者是感寒之類非暑邪也宜消暑十全散脾弱汗多惡寒者十味香薷飲其過傷飲食吐瀉霍亂者六和湯香薷正氣散若恣啖生冷致脾胃受寒腹痛嘔瀉脈沉緊者宜大順散如吐利兼作脈虛浮欲散者非漿水散不救又暑熱之時恣情房欲兼膏粱水果雜進致陽氣不伸無汗惡寒面垢厥逆或霍亂嘔吐者冷香飲子又有暑風者忽然手足搐攣或角弓反張狂呼浪走如中惡狀宜香薷飲加羌防吐加陳藿瀉加白朮轉筋加木瓜痰加薑夏如腹滿身重口不仁面垢遺溺者此熱兼暍也用白虎湯若風犯汗孔體重肢麻者此風濕相搏益元散加蔥頭若浴起當風或冷水浸澡坐臥濕地而病非暑傷也宜溫散之更有暑毒所中或頭面咽喉赤腫或腿足焮腫長至數寸頭痛發熱者名曰暑瘍用敗毒散加石膏黃連等一劑而赤腫自消或有遍身發泡如碗如杯中含臭水名曰暑瘡此濕熱泛於肌表也用黃連入香薷飲及解毒湯涼膈散外以鮮蓮花瓣貼之更有暑痿者濕熱交蒸膏粱子弟陽事頓痿宜黃連解毒合生脈散秋風起則痊或有不禁辛酒火動心脾上灼肺金咳嗽氣喘驟然吐衄煩渴頭目不清名曰暑瘵宜四物解毒增減方河間謂暑氣之受陰虛者邪歸營分陽虛者邪傷氣分故暑在上焦宜辛涼開鬱杏翹清肺飲暑在中焦宜苦辛宣通法用半夏瀉心湯等暑在下焦宜溫行寒性桂苓甘露飲等然治氣分用寒者益元白虎法用溫者二陳正氣法治營分用清者犀角地黃法用補者三才復脈法若濕熱朦混蒼朮入白虎湯穢濁壅塞牛黃至寶等丸皆良法也筆花氏曰仲景治暑止出二方本屬太略東垣輩推而衍之而有清暑益氣湯十味香薷飲之類然此二方中俱用黃耆其性不免呆滯嘗見有補住暑濕之邪而始則膈滿減食繼則肌削口糜纏綿至秋冬而殞命者不可不慎即五苓散中之桂苟遇暑火內熾豈得輕用余治暑症數十餘年每用四苓正氣四味香薷之屬以收功者居多經所謂必先歲氣毋伐天和也至於肢冷腹痛霍亂吐瀉等症昔人所稱為陰暑者皆貪風涼嗜瓜果恣房欲所傷此寒症本非暑症附桂乾薑在所必用又不得因炎令而禁之蓋夏用薑附冬用膏黃從人事不從天時也暑症湯頭白虎湯治陽明熱知母石膏糯甘得加蒼朮即蒼朮白虎一物瓜蒂湯吐去濕熱方四苓散用豬赤苓瀉術加桂即五苓益元散用朱甘滑除卻硃砂名六一清暑益氣湯參歸耆二術青陳曲瀉甘升葛麥味柏清燥湯用何味清暑益氣去葛青加入二苓柴連地藿香正氣芷腹苓半樸蒼蘇桔草陳來復丹硝石硫黃同炒研靈脂玄精石青橘醋和丸消暑丸薑汁糊半夏茯苓甘草磨消暑十全樸木瓜苓陳藿香薷扁豆甘蘇葉共白朮十味香薷參耆朮木瓜苓陳扁甘樸六和湯人參扁樸甘半苓香薷木瓜藿薑棗杏砂仁大順散用官桂末甘杏乾薑炒研合漿水散用淡醋附桂干良薑草夏冷香飲子生附子生薑橘紅甘草果香薷飲用扁豆厚朴香薷甘草湊敗毒散用參苓草羌獨柴前枳殼好川芎桔梗共牛蒡荊防薄荷就是了黃連解毒湯芩柏山梔相此方又名三黃解毒涼膈散用翹芩實山梔前甘大黃薄生脈散治熱傷氣人參麥冬北五味四物解毒增減方芩連生地麥冬當五味貝母山梔共甘陳梗薄茯苓長杏翹清肺飲通草貝蔞薷滑豉梔絲竹玄荷蔻苡蘆半夏瀉心湯芩連人參乾薑半棗甘桂苓甘露飲白朮二苓桂瀉甘寒滑二陳湯半陳甘草與茯苓犀角地黃湯赤芍丹皮麥冬良三才湯天冬人參熟地黃復脈湯用參麥五味茯神又白芍牛黃丸用麝腦雄芎歸白斂芍防風犀羚杏麥柴芩桔黃卷阿膠神麯從肉桂蒲黃山藥棗乾薑金箔四君同至寶丹用牛黃犀角硃砂安息香玳瑁琥珀金銀箔龍腦雄黃共麝香痧氣痧氣者經書本無其名大約其病與瘴氣相類閩廣之地近山則林菁陰冱之氣近海則蛟蜃咸潮之氣虛人中之即為受瘴古方曾用平胃散正氣散及生薑附子湯蘇合丸等治之江浙之地城市則人煙稠密鄉居則田園平坦何瘴之有所患者穢惡糞臭之氣自口鼻中之頃刻士脘鬱悶眼黑神昏危在呼吸名曰痧氣而肥人尤易受夏月尤易受其何故也蓋痧氣本濕濁之氣肥人內濕素踞一感濕濁則痰濁互滿故見症殊速且夏月陽氣發泄故吸受亦易也辨痧氣者以生礬餂之其舌不澀者為痧經云邪之中人其淫泆不可勝數著於輸之脈者閉塞不通孔竅乾壅又曰夏氣者病在臟又曰腹滿䐜脹支膈胠脅下厥上冒過在足太陰陽明可見痧氣之受直入脾絡故䐜脹迅速也治此者急宜開竅逐穢如蘇合丸平胃散藿香正氣散紫金錠皆妙藥也然而臟腑之滿以藥通之經絡之脹則藥力不能到唯有另用刮痧一法最妙考刮痧之法以滾水一鍾略滴香油數點用光滑磁碗一隻將碗口入湯內浸熱兩手執碗向病者背心輕輕向下刮之由漸加重倘碗口乾冷則再浸再刮久之則背上發出疙瘩其痧氣寒氣即隨血散而外達矣若昏脹危迫者先用針刺少商穴其穴在大指甲根旁一韭葉許亦可暫挨片刻其有先受寒邪而後受痧或先受痧氣而冬月則風寒束之夏月則貪涼與生冷遏之此名冷痧入愈深則出愈難然不離乎芳香辛散之品以撤其蔽而通其中俾寒去則痧亦出萬勿稍用苦寒以增其障凡治痧從無苦寒藥也諸瀉心湯均在禁例俗人但畏用姜殊屬可笑筆花氏曰寒暑相搏陰陽拂逆霍亂不出腹大痛名絞腸痧胸悶眼黑神昏腹脹或面部遍身青紫此穢氣攻心也名烏沙脹又有大吐大瀉腳筋內縮此寒氣也名吊腳痧三者不急治即死更有邪伏陽明悶亂躁渴名曰癍痧寒冷頭暈胸滿泛泛欲嘔名曰冷痧治法總以開竅達邪為主治絞腸痧先以淡鹽湯服後探吐再進神香正氣等烏沙脹必先放血用蘇合紫金等吊腳痧用木瓜湯癍痧宜挑出血服犀角大青湯加石膏葛根之屬冷痧用正氣散痧氣湯頭平胃散製蒼朮炙草陳皮同厚朴藿香正氣芷腹苓半樸蒼蘇桔草陳生薑附子湯一枚附子十片姜蘇合丸用麝檀沉薰陸木香香附丁蓽術訶犀朱龍腦蘇合油共安息成紫金錠用千金子文蛤麝戟同山茨瀉心湯用芩連人參乾薑半棗甘神香散治氣痛丁香白蔻研末共木瓜湯用茴香吳茱紫蘇炙草姜陰寒欲脫再加附桂升麻葛根湯升葛芍甘嘗犀角大青湯玄參梔草良升麻芩連柏大渴石膏將癃閉經曰膀胱不利為癃不約為遺溺又曰胞移熱於膀胱則癃溺血膀胱移熱於小腸膈腸不便上為口糜又曰足少陰實則閉癃厥陰之厥則少腹腫痛腹脹涇溲不利又云腸痹者數飲而出不得中氣喘爭胞痹者少腹膀胱按之內痛若沃以湯澀於小便癃閉之症最危急症也水道不通則上侵脾胃而為脹外侵肌肉而為腫泛及中焦則為嘔及上焦則為喘數日則殆矣此症有四有火邪結聚小腸膀胱者熱閉不通也有熱在肝腎或以敗精槁血阻塞水道而不通也二症必有火症火脈及溺管疼痛宜大分清飲抽薪飲等以通利之惟氣閉之症最為危候有氣實而閉者由肝強氣逆移礙膀胱宜以破氣行氣為主如香附枳殼烏藥沉香茴香等兼四苓散以通之若氣陷者即以此藥服後探吐以提其氣有氣虛而閉者經曰氣化則能出矣今真陽下竭元海無根水火不交陰陽否隔此其氣自氣而氣不化水水自水而水蓄不行唯在救其陰中之陽金匱腎氣丸實要藥也癃閉危急者速尋白菊花根搗爛生白酒沖和溫服無白菊即諸色家菊亦可東垣謂癃閉之症渴者熱在上焦氣分宜四苓散以清利之若大便亦秘加大黃元明粉等或八正散不渴者熱在下焦血分宜滋陰化氣如滋腎丸之類是也若真陰不足用六味以滋其陰真陽不足用腎氣以通其陽氣閉則破之暑伏則利之痰塞則吐之更有關格症小便不通因而吐食用假蘇散治之若孕婦轉胞患此服補中益氣湯而探吐之室女經阻患此用通瘀煎筆花氏曰小便不通唯氣與火然火之閉亦由濕熱濁水之閉其氣耳若下焦蓄血則更凝硬作痛矣治法或清或通或提或攻或溫或補全在臨症時審問病原斟酌而進非導赤四苓所能必效也癃閉湯頭大分清飲二苓通車澤山梔枳殼從抽薪飲用芩柏梔澤枳甘通石斛宜四苓散用豬赤苓澤術加桂即五苓金匱腎氣丸六味附桂牛車前八正散用甘瞿麥大黃通蓄車梔滑滋腎丸治下濕火知母川柏用桂佐六味地黃湯山山熟地黃丹苓兼澤瀉八味附桂相假蘇散用通苓陳麥芽瞿麥香附荊補中益氣耆朮陳參草升柴當歸身通瘀煎瀉香附楂烏青歸尾木紅花導赤散用木通生地甘草竹葉同秘結經云北方黑色入通於腎開竅於二陰腎惡燥燥勝則乾少陰之復隔腸不便又曰小腸病者小腹痛腰脊控睪而痛時窘之後又曰涸流之紀其病痿厥堅下秘結一症古方有虛秘風秘氣秘熱秘寒秘濕秘之目總以陰結陽結二者盡之有火便是陽結無火便是陰結陽明實熱則陽結輕則清之重則攻之腎經血少則陰結熱者涼而滋之寒者溫而滋之虛者補而滋之燥者潤而滋之無餘蘊矣治陽結火重者承氣湯涼膈散等火微者清涼飲玉燭散等火盛水虧者地黃丸加知柏麻仁治陰結宜分陰陽下焦陽虛則氣不能傳送而陰凝於下但益其火則陰自化宜右歸飲大補元煎之屬下焦陰虛則精血枯燥腸臟乾槁但壯其水則涇渭自通宜五福飲地黃丸之屬二者欲其速行各加肉蓯蓉二三錢尤效又豕膏為潤燥之神劑尤宜用之凡元氣虛弱之人遇傷寒雜症而便秘者使別無脹實痞塞者雖半月未解亦自無妨切勿強與疏導以傷其胃若老人虛人或病後燥結者莫非血氣之耗津液之枯勿輕與攻筆花氏曰大便秘結有實熱之秘有虛寒之秘如腹脹膈悶或燥渴譫語舌黃溺赤此陽明胃實名曰陽結宜小承氣及三黃枳朮丸等下之若老弱精血不足新產氣血乾枯及唇淡口和舌白溺清者此腸胃虛冷名曰陰結宜四物湯加枳柏歸杞蓯蓉人乳之類或理中湯加歸芍溫而潤之若便秘而別無所苦頻與潤劑不必速也又有大便前出小便後出名曰交腸陰陽拂逆也五苓散主之又有老人便溺俱自前出乃血液枯涸之候多與大劑八珍湯或可稍延歲月耳秘結湯頭承氣湯用芒硝枳實大黃厚朴饒涼膈散用翹芩實山梔前甘大黃薄清涼飲用當歸芍藥甘草大黃來玉燭散用涼四物大黃芒硝甘草得地黃丸即六味地黃丸右歸飲熟地萸杞好附桂杜仲山藥草氣虛參朮乾薑找大補元煎參熟山萸杞當歸杜仲甘五福飲用參熟地當歸白朮炙草記豕膏用豬脂白蜜同煉淨當歸或先煎薑汁或相併三黃枳朮丸荷葉水為團神麯陳枳朮大黃共苓連四物湯治血芎歸熟地芍理中湯用參朮姜炙草還加制附剛五苓散本四苓豬赤瀉術加桂成八珍補陰陽四君四物相遺精淋濁經云血脈和則精神乃居怵惕思慮則傷神神傷則恐懼流淫而不止恐懼不解則傷精精傷則骨痠痿厥精時自下又云腎者主蟄封藏之本精之處也陰陽不和則使液溢而下流髓液皆減口問篇云中氣不足溲便為之變經云諸轉反戾水液渾濁皆屬於熱又曰思想無窮意淫於外發為筋痿及白淫又曰小便黃者少腹中有熱也按夢遺精滑無不由乎心蓋心為君火腎為相火心動則腎必應之少年多欲妄思則水不能藏而精隨以泄久則精道滑而不能遏矣故有夢無夢皆關心腎先用天王補心丹柏子養心丸威喜丸等收養心氣後用苓朮菟絲丸以固精若值勞倦而遺者此肝脾之氣弱也歸脾湯苓朮菟絲丸思索過度而遺者此心脾之氣陷也治之亦如勞倦法若濕熱下流或相火妄動而遺者此脾腎之火不清也四苓散清之其外有素稟不足及無故而滑或過服冷利藥而遺者宜溫補脾腎為主六君八味隨宜用之淋症小便痛澀欲去不去欲止不止即便濁之類但濁出於暫而淋則久困嚴氏有五淋之目一曰氣淋小便澀常有餘瀝二曰石淋莖中痛溺如砂石不得出三曰膏淋溺出如膏四曰勞淋勞倦即發痛引氣衝五曰血淋遇熱即發甚則溺血鼻頭色黃大約此症多由心腎不交積熱蘊毒或酒後房勞七情鬱結所致其初病無不由於熱丹溪曰治淋宜解熱利水如梔子之類不可發汗徐東皋謂初宜八正散利之久則探吐以升其氣東垣謂淋症宜辨渴與不渴渴者熱在上焦氣分宜淡滲之品如茯苓澤瀉琥珀燈心通草車前瞿麥萹蓄之屬以清肺金不渴者熱在下焦血分宜氣味俱陰之藥如知母黃柏滋腎丸是也除其熱泄其閉塞以滋胱腎之下元若小便澀滯者用五淋散至於便濁之症有白有赤赤濁多由於火或痛或澀者宜用抽薪飲導赤散清心蓮子飲大分清飲之屬若見鮮血則從溺血門治白濁由於濕熱白如泔漿內病於肥甘外傷於炎暑宜導赤散苓朮二陳煎稍虛者萆薢分清飲病久無熱者當求脾腎而固之舉之筆花氏曰遺精淋濁貴在心腎大約遺精不論有夢無夢多屬於虛淋濁不論有痛無痛多由於火虛者宜清心補腎澀精固本而以淡欲戒淫為要火者宜疏通清利而以節勞慎動為功遺精淋濁湯頭天王補心丹參苓味遠玄棗仁天麥梗柏子地歸丹柏子養心丸草地犀茯棗歸辰砂味威喜丸四兩苓豬苓少許黃蠟並去豬苓苓朮菟絲丸蓮肉山藥杜味甘歸脾湯用四君遠耆歸木香棗仁眼四苓散用豬赤苓瀉術加桂即五苓六君子湯治虛痰四君又加陳半添八味地黃丸六味附桂添八正散用甘瞿麥大黃通蓄車梔滑滋腎丸治下濕火知母黃柏用桂佐五淋散用梔赤芍淡竹茵通甘苓滑抽薪飲用芩柏梔澤枳甘通石斛宜導赤散用木通生地甘草竹葉同清心蓮子飲參耆麥石蓮柴芩甘地骨白茯又車前大分清飲二苓通車澤山梔枳殼從苓朮二陳煎合方二陳四苓加乾薑萆薢分清飲益智菖蒲烏藥等便血尿血經云陰絡傷則血內溢而後血脾脈微澀為內㿉多下膿血又曰胞移熱於膀胱則癃溺血悲哀太甚則胞絡絕陽氣內動發則心下崩數溲血又云中氣不足溲便為之變便血一症多由腸胃之火蓋大腸小腸皆屬於胃也血在糞前看其來近或在廣腸在肛門血在糞後者其來遠或在胃或在小腸金匱治近血用赤小豆當歸散治遠血用黃土湯然此症有腸風有臟毒有熱有寒若臟腑有熱風邪乘之則下鮮血腹不痛此名腸風清魂古拜散主之若腸胃不清下如魚腸如豆汁腹痛此名臟毒芍藥湯主之若脈數口燥喜冷畏熱是火也前方加黃芩生地丹皮之屬脈細口和喜熱畏寒或四肢厥冷血色瘀淡是寒也理中湯加歸芎此外有脾虛不能統血者歸脾湯有氣陷而血亦陷者補中益氣湯有滑泄而動血者香梅丸有風邪結於陰分而為便血者平胃地榆湯有血熱多火者約營煎有酒濕之毒畜結者槐角丸解酲湯有七情內傷心脾肝腎者若因怒則化肝煎因鬱則逍遙散氣血虛者十全大補湯尿血之症出路有三蓋二從溺孔出一從精孔出也其從溺孔出者近則來自膀胱其症溺時孔道必澀痛此因酒色欲念相火妄動逆而不通宜清膀胱之火以地芍知柏澤梔通膝龍膽瞿麥之屬及大分清等以導之遠則來自小腸其症溺孔不痛血隨溺出或痛隱於臍腹蓋心與小腸為表裡一切五志口腹之火凡從清道以降者必由小腸以達膀胱也治宜察因以清臟腑致火之源其從精孔出者即血淋之類小腹下精泄處覺有痠痛而出者即是從精孔來此症多因房勞陰虛動火致衝任動血出從精道病在命門澀痛者生地四物湯加紅花丹皮有火兼涼血腎氣虛者宜養血固精心氣外馳者天王補心丹程鍾齡謂心氣移熱膀胱陰血妄行宜清心阿膠散主之又肝主疏泄肝火盛亦令尿血宜平肝加味逍遙散主之久病氣虛者八珍湯凡治尿血勿輕止澀恐積瘀莖中大作痛楚也醫通治溺血用牛膝一味煎膏不時服之若氣虛不攝用參耆等分研末以白蘿蔔切片蜜炙蘸末食之老人溲血六味丸加鹿茸筆花氏曰便血尿血大小腸之熱也然肺與大腸相表裡心與小腸相表裡清肺則肺火自不下移清心則心火自不下注惟腸風所下之血清而色鮮四射如濺乃風性使然用古拜散人參敗毒散均可其他鮮紅鮮紫者為熱色瘀淡者為寒色黑如漆者為畜血若老人虛人溲血便血者宜固本為主便血尿血湯頭赤小豆當歸散二味為末醋湯咽黃土湯取灶心阿膠地朮附甘芩清魂古拜散荊芥當歸便芍藥湯甘草芍藥戊已方理中湯用參朮姜炙草還加制附剛香梅丸烏梅白芷百藥煎歸脾湯用四君遠耆歸木香棗仁眼平胃地榆湯異功厚朴蒼歸芍升葛曲香附並乾薑補中益氣耆朮陳參草升柴當歸身約營煎治血生地地榆槐芍藥芩荊穗續斷草烏梅槐角丸用地榆黃芩枳殼防風歸葛花解酲湯葛花砂蔻香青陳參苓朮神麯瀉豬姜阿膠散用麥血餘生地丹丹歸山梔化肝煎用青陳芍丹梔澤貝添白芥逍遙散用柴歸芍苓朮陳甘煨姜薄十全大補八珍齊再添肉桂與黃耆大分清飲二苓通車澤山梔枳殼從生地四物湯養陰芎歸芍藥地用生天王補心丹參苓味遠玄棗仁天麥梗柏子地歸丹八珍補陰陽四君四物相六味地黃湯山山熟地黃丹苓兼澤瀉八味附桂相人參敗毒參苓草羌獨柴前枳殼好川芎桔梗共牛蒡荊防薄荷就是了鼻衄齒衄經云陽絡傷則血外溢而衄血又曰脾移熱於肝則為驚衄陽明厥逆喘咳身熱善驚衄嘔血少陰所謂咳則有血者陽脈傷也陽氣未盛於上而脈滿故血見於鼻也金匱云尺脈浮目睛暈黃衄未止暈黃去目睛慧了知衄止鼻衄之症血從經絡滲出而行於清道也傷寒衄熱在表雜症衄熱在裡皆因經絡熱甚陽氣壅塞迫血妄行而出於鼻從無發散之理犀角地黃湯主之若因七情喜怒勞役過傷而致無論是何經絡並宜茅花煎湯調止衄散或四物加犀角丹皮沉香若衄多服藥不效此內虛寒而外假熱也千金當歸湯若衄後血因舊路或一月三四發或洗面即衄日以為常並以茅花煎湯調送止衄散凡衄血之脈急疾不調及虛大者難治原病式云陽熱怫鬱於足陽明而上熱則血妄行為鼻衄故衄血之內熱多在陽明而尤有其最者則惟衝脈為十二經之血海陽明所至衝脈無不至十二經亦無不至所以衄之微者不過一經之近衄之甚者或至數升斗許通身形色盡脫豈特肺經之病哉治法衄輕者一陰煎加清降之品甚者白虎湯或用蒜頭搗爛作餅貼腳心左衄貼右右衄貼左暴衄如湧垂脫者獨參湯齒衄之症血從齒縫牙齦中出又名牙宣此手足陽明二經及足少陰腎家之病也而惟陽明為最故陽明火盛則為口臭為牙根腐爛腫痛或血出如湧惟善飲好肥甘者多有此症抽薪飲白虎湯少陰不足者玉女煎便閉者調胃承氣湯外敷冰玉散齒衄有因風壅者齒齦微腫或牽引作痛消風散加犀角連翹外擦青鹽藁本末齒不痛而衄者腎虛也六味丸更有舌上無故出血者以心脾腎之脈皆及於舌諸經之火也用蒲黃炒焦為末滲之或冰玉散亦佳有耳衄者肝火也柴胡清肝散以龍骨燒灰吹入即止有眼衄者乃積熱傷肝或誤擾動陰血所致梔子豉湯加犀角秦皮丹皮赤芍有肌衄者血從毛孔出脈數當歸補血湯脈弱保元湯筆花氏曰鼻衄齒衄皆肺胃之火其逆行不止者亦能令人血脫非大劑鹽水炒石膏及生地汁牛膝龜板澤瀉丹皮之類不能止血輕者止衄散犀角地黃湯玉女煎等足矣然齒症不過作痛清胃滋陰而已唯鼻症有流濁涕者名曰鼻淵俗呼腦漏此由受寒化火宜用川芎茶調散由風熱一味荊芥穗若生瘜肉名鼻痔臭而痛白礬散點之余嘗治一人鼻衄齒衄連用犀角地黃不應而血反多因改用人參黃柏龜板澤瀉等味而止蓋其人酒色過度相火旺而迫血也鼻衄齒衄湯頭犀角地黃湯丹皮赤芍麥冬良止衄散用赤苓地阿膠歸芍共黃耆四物湯治血芎歸熟地芍千金當歸湯阿膠芩芍與炮姜一陰煎用生熟地丹參冬芍牛甘記白虎湯治陽明熱知母石膏糯甘得抽薪飲用芩柏梔澤枳甘通石斛宜玉女煎用熟地石膏麥冬知母漆調胃承氣湯芒硝甘大黃冰玉散用殭蠶石膏月石冰片研消風散芎防參苓草藿香殭蠶蟬蛻共荊芥樸陳羌六味地黃湯山山熟地黃丹苓兼澤瀉八味附桂相柴胡清肝散參芩芎翹桔草山梔成梔子豉湯梔香豉服後隨手探吐之當歸補血湯黃耆當歸方保元湯黃耆人參甘草齊川芎茶調散白芷荊芥同梔芩貝梗異甘草在其中此方與頭痛症稍異白礬散用煅白礬硇砂五分共細研癍疹金匱曰陽毒為病面赤斑斑如錦紋咽喉痛唾膿血升麻鱉甲湯主之虛熱熾甚毒不化者陽毒升麻湯大便結去射干加大黃熱甚去人參加石膏或吐下未當陷邪內甚致壯熱項強躁悶或舌焦鼻煤下利黃赤者犀角黑參湯黃連解毒湯慎勿用下藥陰毒為病面目青身痛如被杖咽喉病升麻鱉甲湯去雄黃蜀椒主之活人書本方加桂枝名陰毒甘草湯按陽毒治以寒涼陰毒治以溫熱如冰炭之異何仲景以一方治之乎且治陰毒去雄黃蜀椒則反去其溫熱者矣故劉守真謂仲景以此方治陰毒乃治陽熱亢極熱深於內表似陰寒之症非治陰寒極盛之陰毒也若陰寒極甚非內溫正氣逼邪外出烏能起死回生耶觀後節便知復有陰寒極盛而成陰毒者反大熱燥渴肢厥冷汗脈沉細而疾此因房勞而內傷生冷復加外寒遂成陰盛格陽胸前發出紅癍其色淡其點小是為陰癍宜附子理中湯若爪甲青腹絞痛舌卷莖縮者急用蔥餅於臍上熨之服附子散人參三白湯四逆湯之屬服後手足不和暖者不治周氏曰有因冬溫誤用辛熱發汗致發癍者升麻葛根湯加犀角元參有春溫之毒失治蘊於胃腑而發出肌表心悶嘔逆咽痛躁熱者黃連解毒湯狂妄無汗者三黃石膏湯若自汗煩渴人參化癍湯煩熱錯語不眠者白虎合黃連解毒湯癍不透犀角大青湯已透熱不退去升麻黃芩加人參生地柴胡便秘癍紫者微下之癍退而便秘譫語者涼膈散景岳曰邪毒直入陰分鬱而成熱乃致液涸血枯癍見肌表輕者如蚊跡重者成粒成片凡汗下溫清而病不能解者便是發癍之候治宜犀角地黃湯若陽明狂躁大渴者白虎湯陽毒赤癍發狂者陽毒升麻湯疫癘大熱而燥者三黃石膏湯便秘者調胃承氣湯若火鬱而寒邪不解者一柴胡飲陽明表邪不解者柴胡白虎煎或升麻湯毒盛咽痛者玄參升麻湯陰虛血熱者玉女煎陰虛血燥大熱大渴者歸葛飲內虛外實陰盛格陽者大溫中飲喻氏曰疫邪留血分裡氣壅閉不下則癍不出下之內壅一通衛氣亦從而疏解癍出於表毒邪外解矣惟下後癍漸出更不可下設有下症宜少與小承氣湯緩服倘誤為大下而中氣不振癍毒內陷危矣唯托裡舉癍湯救之若循衣撮空脈微者本方加人參一錢按發癍一症見色而不礙手或稠如錦紋稀似蚊跡厚如雲片布胸腹見四肢鮮紅者輕紫而成片者重色黑者凶青者不可治也良由邪失宣解蘊於胃腑散入營中治法失表者汗之失下者攻之火甚者清之毒重者化之營虛不足者助其虛而和之託之若陰毒發斑之說見象甚微症亦罕遇必參之脈象及兼症方可用溫勿濫治也至於疹子則有頭粒可摩而得較癍稍輕治亦如癍法若痧若癮亦其同類總以出必周勻沒必徐緩則毒不內陷繆氏專從肺胃論治至為有理筆花氏曰重者為癍輕者為疹方書多在傷寒溫疫症內失治所化近世竟有沿門傳染猝患致斃不必由病而得者即經所謂大氣入於臟腑雖不病而猝死者也其症紅赤者為胃熱紫為胃傷黑為胃爛大抵鮮紅起發者吉稠密成片而紫者凶若雜色青紫及透不出並退速而色乾枯者十無一生矣凡見癍後脈須洪數有力身溫足暖為順如脈小足冷元氣虛弱鮮有不內陷者余嘗治一獨子癍上堆癍色皆深紫用石膏二兩及犀角大青玄參升麻乾鮮生地汁等日進三劑先後計用石膏十四斤余方保其胃不至爛而始克收功可見仲景升麻鱉甲一方行之於古則效若近世之癍疹熱毒甚熾斷不相合即所稱勿用下藥之說亦惟邪陷之症自宜斟酌若初起毒秘者亦不可拘也附及之以見今古之病異宜治法亦不容泥古成方而為古人咎也癍疹湯頭升麻鱉甲湯當歸甘草雄黃蜀椒為陽毒升麻湯犀角黃芩參草射干作犀角黑參湯黃芩升麻射干草人參黃連解毒湯黃連芩柏山梔一併煎陰毒甘草湯升麻鱉甲桂枝當理中湯用參朮姜炙草還加制附剛附子散薑朮歸半桂心末人參三白湯補好四君附子白芍棗四逆湯治少陰寒附子乾薑與炙甘升麻葛根湯升葛芍甘嘗三黃石膏湯石膏共麻黃芩連梔子柏香豉蔥白姜人參化癍湯白虎去米加參良白虎湯治陽明熱知母石膏糯甘得犀角大青湯玄參梔草良升麻芩連柏大渴石膏將涼膈散用翹芩蜜山梔芒甘大黃薄犀角地黃湯丹皮赤芍麥冬良調胃承氣湯芒硝甘大黃一柴胡飲陳生地黃芩芍藥甘草記柴胡白虎煎石膏黃芩麥冬甘升麻湯蒼朮麻黃大青麥黃芩石膏淡竹葉玄參升麻湯赤芍管仲芩甘梗犀角玉女煎用熟地石膏麥冬知母膝歸葛飲治熱渴陰虛作汗用歸葛大溫中飲桂麻黃參朮歸甘柴地姜小承氣湯無芒硝枳實大黃厚朴饒托裡舉癍湯歸芍升柴白芷穿山甲
